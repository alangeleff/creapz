<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>cReapZ — Energy Line Styles</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frijole&family=Inter:wght@400;600;700&display=swap');
:root{ --bg:#0a0712; --gold:#d8b25a; --lime:#c8fb50; --violet:#7b5cff; --ink:#efe9ff; --dim:#9a8fc0; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(130% 80% at 50% -8%, #241546 0%, var(--bg) 60%),var(--bg);
  color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.ttl{font-family:Frijole,serif;font-size:20px;color:#e7d3a0;margin:0 0 2px}
.hint{font:600 11px Inter;color:var(--dim);text-align:center;max-width:460px;margin-bottom:14px;line-height:1.5}
.opt{width:100%;max-width:420px;margin-bottom:22px}
.lbl{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.lbl b{font:700 13px Inter;color:var(--lime)}
.lbl b.v{color:var(--violet)}
.lbl span{font:600 11px Inter;color:var(--dim)}
.case{position:relative;width:100%;aspect-ratio:1;border-radius:22px;overflow:hidden;
  background:#0b0716 url(./assets/artifacts_case.png?v=art2) center/cover;box-shadow:0 18px 44px rgba(0,0,0,.55)}
.bgsvg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.stone{position:absolute;transform:translate(-50%,-50%);z-index:3;pointer-events:none;animation:bob 3.6s ease-in-out infinite}
.stone img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-3px)}}
.glow{position:absolute;inset:8%;border-radius:50%;filter:blur(11px);opacity:.5;z-index:-1}
.core{position:absolute;left:49.84%;top:49.57%;transform:translate(-50%,-50%);z-index:4;width:16%;aspect-ratio:1;animation:bob 3.6s ease-in-out infinite;pointer-events:none}
.core img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 7px rgba(0,0,0,.6))}
.core .ring{position:absolute;inset:-22%;border-radius:50%;border:1px solid rgba(216,178,90,.4);animation:spin 18s linear infinite}
.core .ring.r2{inset:-40%;border-color:rgba(123,92,255,.3);animation-duration:28s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.base{fill:none;stroke-linejoin:round;stroke-linecap:round}
.sweep{fill:none;stroke-linejoin:round;stroke-linecap:round}
.baseA{stroke:#c8fb50;stroke-width:0.85;opacity:.38}
.sweepA{stroke:#efffb8;stroke-width:1.25;filter:drop-shadow(0 0 1.1px rgba(200,251,80,.9))}
.baseB{stroke:url(#gradB);stroke-width:0.95;opacity:.42}
.sweepB{stroke:#f4ecff;stroke-width:1.3;filter:drop-shadow(0 0 1.1px rgba(155,140,255,.9))}
</style>
</head>
<body>
<div class="ttl">Energy Line Styles</div>
<div class="hint">Subtle now — a bright band <b>sweeps through the lines</b> (contained, no outward bloom). Pick A or B.</div>

<div class="opt">
  <div class="lbl"><b>A</b><span>&middot; Lime line, lime sweep traveling through it</span></div>
  <div class="case" id="caseA">
    <svg class="bgsvg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <polyline class="base baseA" id="baseA"></polyline>
      <polyline class="sweep sweepA" id="sweepA"></polyline>
    </svg>
    <div class="stones" id="stonesA"></div>
    <div class="core" id="coreA"></div>
  </div>
</div>

<div class="opt">
  <div class="lbl"><b class="v">B</b><span>&middot; Lime &rarr; violet line, bright sweep traveling through it</span></div>
  <div class="case" id="caseB">
    <svg class="bgsvg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <linearGradient id="gradB" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#c8fb50"></stop><stop offset="50%" stop-color="#7b5cff"></stop><stop offset="100%" stop-color="#c8fb50"></stop>
          <animateTransform attributeName="gradientTransform" type="translate" values="-1 -1; 1 1; -1 -1" dur="6s" repeatCount="indefinite"></animateTransform>
        </linearGradient>
      </defs>
      <polyline class="base baseB" id="baseB"></polyline>
      <polyline class="sweep sweepB" id="sweepB"></polyline>
    </svg>
    <div class="stones" id="stonesB"></div>
    <div class="core" id="coreB"></div>
  </div>
</div>

<script>
const ORDER=['ruby','topaz','emerald','sapphire','amethyst','fluorite','obsidian','chaos'];
const GLOW={ruby:'#ff3d5a',topaz:'#ffd24a',emerald:'#3ddc84',sapphire:'#4aa8ff',amethyst:'#b06bff',fluorite:'#6be0d0',obsidian:'#8a7fb0',chaos:'#ff7ad9'};
const POS=[[50.13,13.93],[74.53,25.25],[84.39,49.59],[74.39,73.93],[49.87,83.24],[25.7,74.02],[15.61,49.85],[25.78,25.33]];
const VERTS=[[49.67,14.67],[74.38,24.96],[84.02,49.53],[73.95,73.8],[49.75,82.79],[26.05,74.38],[15.54,49.75],[25.69,25.18]];
const SCALE=14, OC=[0,3,6,1,4,7,2,5,0];
const seq=OC.map(i=>VERTS[i]);
const pts=seq.map(p=>p.join(',')).join(' ');
let L=0; for(let i=1;i<seq.length;i++){ L+=Math.hypot(seq[i][0]-seq[i-1][0], seq[i][1]-seq[i-1][1]); }
const BAND=Math.round(L*0.22*10)/10;
function url(id){return './assets/stone_'+id+'.png?v=art2';}
['A','B'].forEach(function(suf){
  document.getElementById('base'+suf).setAttribute('points',pts);
  var sweep=document.getElementById('sweep'+suf);
  sweep.setAttribute('points',pts);
  sweep.setAttribute('stroke-dasharray', BAND+' '+(L-BAND).toFixed(1));
  var anim=document.createElementNS('http://www.w3.org/2000/svg','animate');
  anim.setAttribute('attributeName','stroke-dashoffset');
  anim.setAttribute('from', L.toFixed(1)); anim.setAttribute('to','0');
  anim.setAttribute('dur','3.2s'); anim.setAttribute('repeatCount','indefinite');
  sweep.appendChild(anim);
  var sw=document.getElementById('stones'+suf);
  ORDER.forEach(function(id,i){ var el=document.createElement('div'); el.className='stone';
    el.style.width=SCALE+'%'; el.style.aspectRatio='1'; el.style.left=POS[i][0]+'%'; el.style.top=POS[i][1]+'%';
    el.innerHTML='<div class="glow" style="background:radial-gradient(circle,'+GLOW[id]+',transparent 70%)"></div><img src="'+url(id)+'">';
    sw.appendChild(el); });
  document.getElementById('core'+suf).innerHTML='<div class="ring"></div><div class="ring r2"></div><div class="glow" style="background:radial-gradient(circle,#fff3b0,transparent 70%)"></div><img src="'+url('holy')+'">';
});
</script>
</body>
</html>
