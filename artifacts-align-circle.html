<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>cReapZ — Holy Circle Aligner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frijole&family=Inter:wght@400;600;700&display=swap');
:root{ --bg:#0a0712; --gold:#d8b25a; --lime:#c8fb50; --violet:#7b5cff; --ink:#efe9ff; --dim:#9a8fc0; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(130% 80% at 50% -8%, #241546 0%, var(--bg) 60%),var(--bg);
  color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.ttl{font-family:Frijole,serif;font-size:20px;color:#e7d3a0;margin:0 0 2px}
.hint{font:600 11px Inter;color:var(--dim);text-align:center;max-width:460px;margin-bottom:10px;line-height:1.5}
.wrap{width:100%;max-width:440px}
.case{position:relative;width:100%;aspect-ratio:1;border-radius:22px;overflow:hidden;touch-action:none;
  background:#0b0716 url(./assets/artifacts_case.png?v=art2) center/cover;box-shadow:0 18px 44px rgba(0,0,0,.55)}
.bgsvg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.stone{position:absolute;transform:translate(-50%,-50%);z-index:3;pointer-events:none;animation:bob 3.6s ease-in-out infinite}
.stone img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-3px)}}
.glow{position:absolute;inset:-6%;border-radius:50%;filter:blur(15px);opacity:.7;z-index:-1;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.82}}
.core{position:absolute;left:49.84%;top:49.57%;transform:translate(-50%,-50%);z-index:4;width:16%;aspect-ratio:1;pointer-events:none;animation:bob 3.6s ease-in-out infinite}
.core img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 7px rgba(0,0,0,.6))}
.core .ring{position:absolute;inset:-22%;border-radius:50%;border:1px solid rgba(216,178,90,.4);animation:spin 18s linear infinite}
.core .ring.r2{inset:-40%;border-color:rgba(123,92,255,.3);animation-duration:28s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.eline{stroke:#c8fb50;stroke-linecap:round;opacity:.7;animation:eglow 3s ease-in-out infinite}
@keyframes eglow{0%,100%{filter:drop-shadow(0 0 .4px rgba(200,251,80,.35));opacity:.55}50%{filter:drop-shadow(0 0 1.4px rgba(200,251,80,.6));opacity:.85}}
.ecircle{fill:none;stroke:#c8fb50;stroke-linecap:round;animation:eglow 3s ease-in-out infinite}
/* drag handle for circle center */
.chandle{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);z-index:6;border-radius:50%;
  border:2px dashed #fff;background:rgba(255,255,255,.12);box-shadow:0 0 8px rgba(255,255,255,.5);touch-action:none}
.chandle::after{content:"⊕";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 14px Inter}
.row{display:flex;align-items:center;gap:10px;margin-top:9px;width:100%;max-width:440px}
.row label{font:700 11px Inter;color:var(--dim);white-space:nowrap;width:74px}
.row input[type=range]{flex:1}
.row .val{font:700 11px Inter;color:var(--lime);width:48px;text-align:right}
textarea{width:100%;max-width:440px;height:54px;margin-top:10px;background:#0e0b1d;color:#bfe4ff;border:1px solid #33264f;border-radius:10px;padding:8px;font:600 11px monospace}
.copy{width:100%;max-width:440px;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #3fbf6a;background:#16301d;color:#a8f0c0;font:700 13px Inter;cursor:pointer}
.note{font:600 10px Inter;color:#6f6790;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="ttl">Holy Circle Aligner</div>
<div class="hint">The full grid is locked for reference. Drag the <b>⊕ handle</b> to center the ring on the backdrop's carved circle, then dial <b>diameter</b> and <b>thickness</b>. Tap <b>Copy Config</b> and paste it back.</div>
<div class="wrap">
  <div class="case" id="case">
    <svg class="bgsvg" viewBox="0 0 100 100" preserveAspectRatio="none" id="svg">
      <g id="lines"></g>
      <circle class="ecircle" id="circle"></circle>
    </svg>
    <div id="stones"></div>
    <div class="core" id="core"></div>
    <div class="chandle" id="chandle"></div>
  </div>
</div>
<div class="row"><label>Diameter</label><input type="range" id="rad" min="8" max="48" step="0.5" value="31"><span class="val" id="radV">31</span></div>
<div class="row"><label>Thickness</label><input type="range" id="thk" min="0.3" max="3" step="0.1" value="0.9"><span class="val" id="thkV">0.9</span></div>
<textarea id="cfg" readonly></textarea>
<button class="copy" id="copyBtn">📋 Copy Config</button>
<div class="note">paste the copied text back into the chat</div>

<script>
const ORDER=['ruby','topaz','emerald','sapphire','amethyst','fluorite','obsidian','chaos'];
const GLOW={ruby:'#ff3d5a',topaz:'#ffd24a',emerald:'#3ddc84',sapphire:'#4aa8ff',amethyst:'#b06bff',fluorite:'#6be0d0',obsidian:'#8a7fb0',chaos:'#ff7ad9'};
const POS=[[50.13,13.93],[74.53,25.25],[84.39,49.59],[74.39,73.93],[49.87,83.24],[25.7,74.02],[15.61,49.85],[25.78,25.33]];
const VERTS=[[49.67,14.67],[74.38,24.96],[84.02,49.53],[73.95,73.8],[49.75,82.79],[26.05,74.38],[15.54,49.75],[25.69,25.18]];
const SCALE=14, EDGES=[[0,3],[3,6],[6,1],[1,4],[4,7],[7,2],[2,5],[5,0]];
function url(id){return './assets/stone_'+id+'.png?v=art2';}
var CC=[49.84,49.57], CR=31, CT=0.9;
var caseEl=document.getElementById('case'), circle=document.getElementById('circle'), chandle=document.getElementById('chandle');
// reference lines (full grid)
var li=''; EDGES.forEach(function(e){ var a=VERTS[e[0]],b=VERTS[e[1]];
  li+='<line class="eline" stroke-width="0.9" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"></line>'; });
document.getElementById('lines').innerHTML=li;
// reference stones (lit + glow)
var sw=document.getElementById('stones');
ORDER.forEach(function(id,i){ var el=document.createElement('div'); el.className='stone';
  el.style.width=SCALE+'%'; el.style.aspectRatio='1'; el.style.left=POS[i][0]+'%'; el.style.top=POS[i][1]+'%';
  el.innerHTML='<div class="glow" style="background:radial-gradient(circle,'+GLOW[id]+',transparent 70%)"></div><img src="'+url(id)+'">';
  sw.appendChild(el); });
document.getElementById('core').innerHTML='<div class="ring"></div><div class="ring r2"></div><div class="glow" style="background:radial-gradient(circle,#fff3b0,transparent 70%)"></div><img src="'+url('holy')+'">';
function draw(){
  circle.setAttribute('cx',CC[0]); circle.setAttribute('cy',CC[1]); circle.setAttribute('r',CR/2); circle.setAttribute('stroke-width',CT);
  chandle.style.left=CC[0]+'%'; chandle.style.top=CC[1]+'%';
  document.getElementById('cfg').value=JSON.stringify({circleCenter:CC,circleDiameter:CR,circleStroke:CT});
}
chandle.addEventListener('pointerdown',function(e){ e.preventDefault(); chandle.setPointerCapture(e.pointerId);
  var move=function(ev){ var r=caseEl.getBoundingClientRect(); var x=(ev.clientX-r.left)/r.width*100, y=(ev.clientY-r.top)/r.height*100;
    CC=[+Math.max(0,Math.min(100,x)).toFixed(2),+Math.max(0,Math.min(100,y)).toFixed(2)]; draw(); };
  var up=function(){ chandle.removeEventListener('pointermove',move); chandle.removeEventListener('pointerup',up); };
  chandle.addEventListener('pointermove',move); chandle.addEventListener('pointerup',up); });
document.getElementById('rad').addEventListener('input',function(e){ CR=+e.target.value; document.getElementById('radV').textContent=CR; draw(); });
document.getElementById('thk').addEventListener('input',function(e){ CT=+e.target.value; document.getElementById('thkV').textContent=CT; draw(); });
document.getElementById('copyBtn').onclick=function(){ var tx=document.getElementById('cfg'); tx.select();
  navigator.clipboard.writeText(tx.value).then(function(){ var b=document.getElementById('copyBtn'); b.textContent='✓ Copied — paste it to me'; setTimeout(function(){b.textContent='📋 Copy Config';},2000); }).catch(function(){ document.execCommand('copy'); }); };
draw();
</script>
</body>
</html>
