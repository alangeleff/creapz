<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>cReapZ — Mega Souls Aligner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frijole&family=Inter:wght@400;600;700&display=swap');
:root{ --bg:#0a0712; --gold:#d8b25a; --lime:#c8fb50; --violet:#7b5cff; --ink:#efe9ff; --dim:#9a8fc0; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(130% 80% at 50% -8%, #241546 0%, var(--bg) 60%),var(--bg);
  color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.ttl{font-family:Frijole,serif;font-size:20px;color:#e7d3a0;margin:0 0 2px}
.hint{font:600 11px Inter;color:var(--dim);text-align:center;max-width:460px;margin-bottom:10px;line-height:1.5}
.wrap{width:100%;max-width:460px}
.megacase{position:relative;width:100%;aspect-ratio:3.018;border-radius:22px;overflow:hidden;touch-action:none;
  background:#0b0716 url(./assets/mega_case.png?v=art1) center/cover;box-shadow:0 18px 44px rgba(0,0,0,.55)}
.guide{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(200,251,80,.85);z-index:6;display:none;pointer-events:none}
.mslot{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab}
.mslot img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.mslot .tag{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font:700 8px Inter;color:var(--gold);white-space:nowrap;text-shadow:0 1px 2px #000;pointer-events:none}
.sel{outline:2px dashed #fff;outline-offset:3px;border-radius:8px}
.bar{display:flex;gap:10px;align-items:center;margin-top:12px;width:100%;max-width:460px;justify-content:center;flex-wrap:wrap}
.bar button{font:700 12px Inter;padding:8px 13px;border-radius:10px;border:1px solid #33264f;background:#1d1640;color:var(--ink);cursor:pointer}
.bar button.on{border-color:var(--lime);color:var(--lime);background:#1f2616}
.row{display:flex;align-items:center;gap:10px;margin-top:9px;width:100%;max-width:460px}
.row label{font:700 11px Inter;color:var(--dim);white-space:nowrap;width:62px}
.row input[type=range]{flex:1}
.row .val{font:700 11px Inter;color:var(--lime);width:46px;text-align:right}
textarea{width:100%;max-width:460px;height:54px;margin-top:10px;background:#0e0b1d;color:#bfe4ff;border:1px solid #33264f;border-radius:10px;padding:8px;font:600 11px monospace}
.copy{width:100%;max-width:460px;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #3fbf6a;background:#16301d;color:#a8f0c0;font:700 13px Inter;cursor:pointer}
.note{font:600 10px Inter;color:#6f6790;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="ttl">Mega Souls Aligner</div>
<div class="hint">Drag each orb to center it in its socket. <b>Width</b> + <b>Height</b> shape all three. With <b>Snap</b> on, an orb clicks to another's height when they line up (lime guide shows the match). Tap <b>Copy Config</b> and paste it back.</div>
<div class="wrap">
  <div class="megacase" id="case">
    <div class="guide" id="guide"></div>
    <div id="slots"></div>
  </div>
</div>
<div class="bar"><button id="snapBtn" class="on">⇔ Snap: ON</button></div>
<div class="row"><label>Width</label><input type="range" id="w" min="6" max="26" step="0.5" value="12"><span class="val" id="wV">12</span></div>
<div class="row"><label>Height</label><input type="range" id="h" min="20" max="80" step="0.5" value="36"><span class="val" id="hV">36</span></div>
<textarea id="cfg" readonly></textarea>
<button class="copy" id="copyBtn">📋 Copy Config</button>
<div class="note">paste the copied text back into the chat</div>

<script>
var IMG=['mega_vigor','mega_siphon','mega_discord'], TAG=['VIGOR','GREED','DISCORD'];
var SLOTS=[[28.39,51.24],[50.04,51.24],[71.61,51.24]];   // [x% width, y% height], from last config
var WPCT=12, HPCT=36;
var SNAP=true, SNAPTOL=2.0;
var caseEl=document.getElementById('case'), guide=document.getElementById('guide');
var els=[];
SLOTS.forEach(function(p,i){ var el=document.createElement('div'); el.className='mslot';
  el.innerHTML='<img src="./assets/'+IMG[i]+'.png?v=mega2"><div class="tag">'+TAG[i]+'</div>';
  caseEl.appendChild(el); els.push(el); makeDrag(el,i); });
function sizeEls(){ els.forEach(function(el){ el.style.width=WPCT+'%'; el.style.height=HPCT+'%'; }); }
function placeEls(){ els.forEach(function(el,i){ el.style.left=SLOTS[i][0]+'%'; el.style.top=SLOTS[i][1]+'%'; }); }
function makeDrag(el,i){
  el.addEventListener('pointerdown',function(e){ e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('sel');
    var move=function(ev){ var r=caseEl.getBoundingClientRect(); var x=(ev.clientX-r.left)/r.width*100, y=(ev.clientY-r.top)/r.height*100;
      x=Math.max(0,Math.min(100,x)); y=Math.max(0,Math.min(100,y));
      guide.style.display='none';
      if(SNAP){ for(var j=0;j<SLOTS.length;j++){ if(j!==i && Math.abs(y-SLOTS[j][1])<SNAPTOL){ y=SLOTS[j][1]; guide.style.top=y+'%'; guide.style.display='block'; break; } } }
      SLOTS[i]=[+x.toFixed(2),+y.toFixed(2)]; el.style.left=SLOTS[i][0]+'%'; el.style.top=SLOTS[i][1]+'%'; sync(); };
    var up=function(){ el.classList.remove('sel'); guide.style.display='none'; el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); });
}
function sync(){ document.getElementById('cfg').value=JSON.stringify({widthPct:WPCT,heightPct:HPCT,slots:SLOTS}); }
document.getElementById('w').addEventListener('input',function(e){ WPCT=+e.target.value; document.getElementById('wV').textContent=WPCT; sizeEls(); sync(); });
document.getElementById('h').addEventListener('input',function(e){ HPCT=+e.target.value; document.getElementById('hV').textContent=HPCT; sizeEls(); sync(); });
document.getElementById('snapBtn').onclick=function(){ SNAP=!SNAP; var b=document.getElementById('snapBtn'); b.textContent='⇔ Snap: '+(SNAP?'ON':'OFF'); b.classList.toggle('on',SNAP); };
document.getElementById('copyBtn').onclick=function(){ var tx=document.getElementById('cfg'); tx.select();
  navigator.clipboard.writeText(tx.value).then(function(){ var b=document.getElementById('copyBtn'); b.textContent='✓ Copied — paste it to me'; setTimeout(function(){b.textContent='📋 Copy Config';},2000); }).catch(function(){ document.execCommand('copy'); }); };
sizeEls(); placeEls(); sync();
</script>
</body>
</html>
