<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ravenbeast Walk v2</title>
<style>
 body{margin:0;background:#0d0b1a;color:#eaf6ff;font-family:sans-serif;text-align:center}
 h2{font-size:15px;margin:14px 0 4px;color:#c8fb50}
 canvas{image-rendering:auto;background:#1a1430;border-radius:12px;max-width:92vw}
 .ctl{margin:10px}
 button{background:#2a2150;color:#eaf6ff;border:1px solid #7b5cff;border-radius:8px;padding:8px 14px;margin:4px 6px;font-size:14px}
 button.on{background:#7b5cff}
 input[type=range]{width:200px;vertical-align:middle}
</style></head><body>
<h2>SKELETAL RAVENBEAST — walk sheet v2</h2>
<div class="ctl">
  <button id="bAlan" class="on">ALAN 8</button><button id="bSmart">SMART 12</button><button id="bRaw">RAW 12</button>
  <br><span style="font-size:13px">fps <input id="fps" type="range" min="4" max="30" value="10"> <span id="fv">10</span></span>
</div>
<canvas id="c0" width="278" height="322"></canvas>
<div style="font-size:13px;margin-top:6px">frame <span id="f0"></span> (1-based, matches your numbering)</div>
<script>
const SEQS={alan:[11, 0, 6, 8, 11, 4, 6, 8],smart:[0, 1, 6, 2, 11, 10, 8, 4, 7, 9, 5, 3],raw:[...Array(12).keys()]};
let cur='alan', fps=10;
const im=new Image(); let ready=false; im.onload=()=>ready=true; im.src='assets/ravenprev_walk2.png';
for(const k of ['Alan','Smart','Raw']){
  document.getElementById('b'+k).onclick=()=>{ cur=k.toLowerCase();
    for(const k2 of ['Alan','Smart','Raw']) document.getElementById('b'+k2).className=(k===k2)?'on':''; };
}
const fpsEl=document.getElementById('fps');
fpsEl.oninput=()=>{ fps=+fpsEl.value; document.getElementById('fv').textContent=fps; };
const ctx=document.getElementById('c0').getContext('2d');
let t0=performance.now();
function loop(){
  const t=(performance.now()-t0)/1000;
  ctx.clearRect(0,0,278,322);
  if(ready){
    const seq=SEQS[cur];
    const fi=seq[Math.floor(t*fps)%seq.length];
    ctx.drawImage(im, fi*278,0,278,322, 0,0,278,322);
    document.getElementById('f0').textContent=(fi+1);
  }
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
