<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>cReapZ — Holy Stone Aligner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frijole&family=Inter:wght@400;600;700&display=swap');
:root{ --bg:#0a0712; --gold:#d8b25a; --lime:#c8fb50; --violet:#7b5cff; --ink:#efe9ff; --dim:#9a8fc0; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(130% 80% at 50% -8%, #241546 0%, var(--bg) 60%),var(--bg);
  color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.ttl{font-family:Frijole,serif;font-size:20px;color:#e7d3a0;margin:0 0 2px}
.hint{font:600 11px Inter;color:var(--dim);text-align:center;max-width:460px;margin-bottom:10px;line-height:1.5}
.wrap{width:100%;max-width:460px}
.case{position:relative;width:100%;aspect-ratio:1;border-radius:22px;overflow:hidden;touch-action:none;
  background:#0b0716 url(./assets/artifacts_case.png?v=art2) center/cover;box-shadow:0 18px 44px rgba(0,0,0,.55)}
.bgsvg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
/* the 8 reference stones — locked, not draggable */
.stone{position:absolute;transform:translate(-50%,-50%);z-index:3;pointer-events:none;animation:bob 3.6s ease-in-out infinite}
.stone img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-3px)}}
.glow{position:absolute;inset:8%;border-radius:50%;filter:blur(11px);opacity:.5;z-index:-1}
/* the draggable holy */
.core{position:absolute;transform:translate(-50%,-50%);z-index:4;touch-action:none;animation:bob 3.6s ease-in-out infinite}
.core img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 7px rgba(0,0,0,.6))}
.core .ring{position:absolute;inset:-22%;border-radius:50%;border:1px solid rgba(216,178,90,.4);animation:spin 18s linear infinite}
.core .ring.r2{inset:-40%;border-color:rgba(123,92,255,.3);animation-duration:28s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.core .tag{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font:700 8px Inter;color:#fff0a0;white-space:nowrap;text-shadow:0 1px 2px #000}
.sel{outline:2px dashed #fff;outline-offset:4px;border-radius:50%}
.row{display:flex;align-items:center;gap:10px;margin-top:12px;width:100%;max-width:460px}
.row label{font:700 11px Inter;color:var(--dim);white-space:nowrap}
.row input[type=range]{flex:1}
textarea{width:100%;max-width:460px;height:60px;margin-top:10px;background:#0e0b1d;color:#bfe4ff;border:1px solid #33264f;border-radius:10px;padding:8px;font:600 11px monospace}
.copy{width:100%;max-width:460px;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #3fbf6a;background:#16301d;color:#a8f0c0;font:700 13px Inter;cursor:pointer}
.note{font:600 10px Inter;color:#6f6790;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="ttl">Holy Stone Aligner</div>
<div class="hint">The 8 stones are <b>locked</b> exactly where you placed them. Drag <b>only the Holy stone</b> to perfect its center, and use the slider for its size. It hovers + has its rings just like the live preview. Then tap <b>Copy Config</b> and paste it back to me.</div>
<div class="wrap">
  <div class="case" id="case">
    <svg class="bgsvg" id="bgsvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    <div id="stones"></div>
    <div class="core" id="core"></div>
  </div>
</div>
<div class="row"><label>Holy size</label><input type="range" id="size" min="8" max="22" step="0.5" value="14"><span id="sizeV" style="font:700 11px Inter;color:var(--lime)">14%</span></div>
<textarea id="cfg" readonly></textarea>
<button class="copy" id="copyBtn">📋 Copy Config</button>
<div class="note">paste the copied text back into the chat</div>

<script>
const ORDER=['ruby','topaz','emerald','sapphire','amethyst','fluorite','obsidian','chaos'];
const GLOW={ruby:'#ff3d5a',topaz:'#ffd24a',emerald:'#3ddc84',sapphire:'#4aa8ff',amethyst:'#b06bff',fluorite:'#6be0d0',obsidian:'#8a7fb0',chaos:'#ff7ad9'};
// LOCKED — your baked positions (do not change)
const POS=[[50.13,13.93],[74.53,25.25],[84.39,49.59],[74.39,73.93],[49.87,83.24],[25.7,74.02],[15.61,49.85],[25.78,25.33]];
const VERTS=[[49.67,14.67],[74.38,24.96],[84.02,49.53],[73.95,73.8],[49.75,82.79],[26.05,74.38],[15.54,49.75],[25.69,25.18]];
const STONE_SCALE=14;
// draggable holy
let CENTER=[49.87,51.93];
let HSCALE=14;
const caseEl=document.getElementById('case'), sw=document.getElementById('stones'), core=document.getElementById('core');
function url(id){return './assets/stone_'+id+'.png?v=art2';}
// energy star (for visual context)
const OC=[0,3,6,1,4,7,2,5,0];
document.getElementById('bgsvg').innerHTML=`<polyline points="${OC.map(i=>VERTS[i].join(',')).join(' ')}" fill="none" stroke="#7df3c0" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>`;
// reference stones (locked)
ORDER.forEach((id,i)=>{ const el=document.createElement('div'); el.className='stone';
  el.style.width=STONE_SCALE+'%'; el.style.aspectRatio='1'; el.style.left=POS[i][0]+'%'; el.style.top=POS[i][1]+'%';
  el.innerHTML=`<div class="glow" style="background:radial-gradient(circle,${GLOW[id]},transparent 70%)"></div><img src="${url(id)}">`;
  sw.appendChild(el); });
// holy (draggable + sizable)
function placeCore(){ core.style.width=HSCALE+'%'; core.style.aspectRatio='1'; core.style.left=CENTER[0]+'%'; core.style.top=CENTER[1]+'%'; }
core.innerHTML=`<div class="ring"></div><div class="ring r2"></div><div class="glow" style="background:radial-gradient(circle,#fff3b0,transparent 70%)"></div><img src="${url('holy')}"><div class="tag">HOLY · drag me</div>`;
placeCore();
makeDrag(core,(x,y)=>{CENTER=[x,y]; placeCore(); sync();});
function makeDrag(el,onMove){
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('sel');
    const move=ev=>{ const r=caseEl.getBoundingClientRect(); let x=(ev.clientX-r.left)/r.width*100, y=(ev.clientY-r.top)/r.height*100;
      x=Math.max(0,Math.min(100,x)); y=Math.max(0,Math.min(100,y)); onMove(+x.toFixed(2),+y.toFixed(2)); };
    const up=()=>{ el.classList.remove('sel'); el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); };
    el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); });
}
function sync(){ document.getElementById('cfg').value=JSON.stringify({holyScale:HSCALE,holyCenter:CENTER}); }
document.getElementById('size').addEventListener('input',e=>{ HSCALE=+e.target.value; document.getElementById('sizeV').textContent=HSCALE+'%'; placeCore(); sync(); });
document.getElementById('copyBtn').onclick=()=>{ const t=document.getElementById('cfg'); t.select();
  navigator.clipboard.writeText(t.value).then(()=>{ const b=document.getElementById('copyBtn'); b.textContent='✓ Copied — paste it to me'; setTimeout(()=>b.textContent='📋 Copy Config',2000); }).catch(()=>{ document.execCommand('copy'); }); };
sync();
</script>
</body>
</html>
