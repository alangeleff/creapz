<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>cReapZ — World Builder</title>
<style>
 :root{--bg:#0c0a16;--panel:#15112a;--ink:#e8e6f5;--mut:#9b8cff;--lime:#c8fb50;--line:#2a2150;}
 *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
 #wrap{display:flex;height:100%}
 #pal{width:194px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
 #palList{flex:1 1 56%;overflow-y:auto;padding:8px;border-bottom:2px solid var(--line)}
 #layers{flex:1 1 44%;overflow-y:auto;padding:8px}
 #pal h3{font-size:10px;letter-spacing:.5px;color:var(--mut);margin:12px 6px 6px;text-transform:uppercase}
 .cat{font-size:10px;letter-spacing:.5px;color:var(--lime);margin:10px 4px 4px;text-transform:uppercase;font-weight:700}
 .litem{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:6px;font-size:12px;cursor:pointer;margin:1px 0}
 .litem.ldrag{opacity:.5;outline:1px solid var(--lime)}
 .litem.ghead.grouphl{outline:2px solid var(--lime);background:#26331a}
 .litem:hover{background:#1d1838}
 .litem.sel{background:#242a16;outline:1px solid var(--lime)}
 .litem .lc{width:11px;height:11px;border-radius:2px;flex:none}
 .litem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .litem .lb{background:#241d44;border:none;color:#cdbbe6;border-radius:5px;font-size:14px;line-height:1;padding:5px 8px;cursor:pointer;min-width:26px;text-align:center}
 .litem .lb:hover{background:#352a5c}
 .litem.lock{opacity:.5}
 .litem.ghead{background:#1a2336;outline:1px solid #3b5a8c;margin-top:4px}
 .litem.member{margin-left:14px;font-size:11px}
 .lck{width:16px;height:16px;border:1px solid #6a6088;border-radius:3px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#c8fb50}
 #grpbtn,#addgrpbtn{width:100%;margin:4px 0 6px;background:#1d2a3a;border:1px solid #5b9cff;color:#bcd9ff;border-radius:6px;padding:7px;cursor:pointer;font-size:12px}
 #addgrpbtn{background:#16301d;border-color:#3fbf6a;color:#a8f0c0}
 .tool{display:flex;align-items:center;gap:8px;padding:9px 10px;margin:4px 0;border-radius:8px;background:#1d1838;border:1px solid transparent;cursor:grab;font-size:13px;touch-action:pan-y}
 .tool.dragging{opacity:.6;border-color:var(--lime);background:#242a16}
 .tool:active{cursor:grabbing}
 .tool.on{border-color:var(--lime);background:#242a16}
 .tool .sw{width:15px;height:15px;border-radius:3px;flex:none}
 .modebtn{display:flex;align-items:center;gap:8px;padding:9px 10px;margin:4px 0;border-radius:8px;background:#1d1838;border:1px solid transparent;cursor:pointer;font-size:13px}
 .modebtn.on{border-color:var(--lime);background:#242a16}
 #main{flex:1;display:flex;flex-direction:column;min-width:0}
 #bar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
 #bar input,#bar select{background:#0e0b1d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:12px}
 #bar label{font-size:11px;color:var(--mut)}
 .btn{background:#2a2150;color:var(--ink);border:1px solid #7b5cff;border-radius:7px;padding:8px 12px;font-size:13px;cursor:pointer}
 .btn.go{background:var(--lime);color:#10210a;border-color:var(--lime);font-weight:700}
 .btn.warn{border-color:#e23b3b;color:#ff9a9a}
 #cvWrap{flex:1;position:relative;overflow:hidden}
 canvas{display:block;background:#06040e;touch-action:none}
 #hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:#9b8cffaa;pointer-events:none}
 #ghost{position:fixed;pointer-events:none;z-index:50;font-size:11px;color:#10210a;background:#c8fb50dd;border-radius:6px;padding:3px 7px;display:none;transform:translate(-50%,-130%);white-space:nowrap;font-weight:700}
 #sel{position:absolute;right:10px;top:10px;width:210px;background:#15112af2;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;display:none}
 #sel h4{margin:0 0 6px;color:var(--lime);font-size:13px}
 #sel .row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:6px}
 #sel input{width:74px;background:#0e0b1d;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px;font-size:13px}
 #sel .del{width:100%;margin-top:8px;background:#3a1620;border:1px solid #e23b3b;color:#ff9a9a;border-radius:6px;padding:8px;cursor:pointer}
 #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#15112af2;border:1px solid #7b5cff;border-radius:8px;padding:9px 16px;font-size:13px;display:none}
 #zoomb{position:absolute;left:10px;top:10px;display:flex;gap:6px}
 #zoomb button{width:38px;height:38px;border-radius:9px;background:#15112af2;border:1px solid var(--line);color:var(--ink);font-size:18px;cursor:pointer}
 #savesP{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:300px;max-height:74%;overflow:auto;background:#15112af6;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;display:none;z-index:30}
 #newP{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:300px;background:#15112af6;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;display:none;z-index:31}
 #newP h4{margin:0 0 10px;color:var(--lime);font-size:15px}
 #newP .nrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
 #newP .nrow span{color:var(--mut);font-size:12px}
 #newP .nrow input,#newP .nrow select{flex:1;max-width:175px;background:#0e0b1d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px}
 #newP .savebtn{width:100%;background:#16301d;border:1px solid #3fbf6a;color:#a8f0c0;border-radius:8px;padding:11px;cursor:pointer;font-size:13px;margin-top:10px}
 #newP .closebtn{width:100%;background:#241d44;border:1px solid var(--line);color:#cdbbe6;border-radius:8px;padding:9px;cursor:pointer;margin-top:6px}
 #savesP h4{margin:0 0 8px;color:var(--lime);font-size:14px}
 #savesP .srow{display:flex;align-items:center;gap:6px;padding:7px;border-radius:7px;background:#1d1838;margin:5px 0}
 #savesP .srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
 #savesP .sb{border:none;border-radius:6px;padding:8px 11px;font-size:12px;cursor:pointer;flex:none}
 #savesP .sb.load{background:#1d2a3a;border:1px solid #5b9cff;color:#bcd9ff}
 #savesP .sb.del{background:#3a1620;border:1px solid #e23b3b;color:#ff9a9a}
 #savesP .savebtn{width:100%;background:#16301d;border:1px solid #3fbf6a;color:#a8f0c0;border-radius:8px;padding:11px;cursor:pointer;font-size:13px;margin-bottom:8px}
 #savesP .closebtn{width:100%;background:#241d44;border:1px solid var(--line);color:#cdbbe6;border-radius:8px;padding:9px;cursor:pointer;margin-top:6px}
 /* Larger touch targets on tablets / iPads (coarse pointer + roomy screen) */
 @media (pointer: coarse) and (min-width: 700px){
  #pal{width:272px}
  #pal h3{font-size:12px}
  .cat{font-size:12px}
  .tool{padding:14px 14px;font-size:16px;margin:7px 0;gap:11px;border-radius:10px}
  .tool .sw{width:20px;height:20px}
  .modebtn{padding:14px 14px;font-size:16px;margin:7px 0;gap:11px;border-radius:10px}
  .modebtn .sw{width:20px;height:20px}
  .litem{padding:9px 6px;font-size:15px;gap:5px;border-radius:8px}
  .litem .lc{width:13px;height:13px}
  .litem .lb{font-size:16px;padding:7px 8px;min-width:30px;border-radius:6px}
  .lck{width:22px;height:22px;font-size:13px;border-radius:5px}
  #grpbtn,#addgrpbtn{padding:13px;font-size:15px;border-radius:8px}
  #bar{gap:9px;padding:10px 12px}
  #bar input,#bar select{padding:10px 11px;font-size:15px;border-radius:8px}
  #bar label{font-size:13px}
  .btn{padding:13px 19px;font-size:16px;border-radius:9px}
  #sel{width:280px;padding:14px;font-size:14px;border-radius:12px}
  #sel h4{font-size:17px}
  #sel .row{margin:10px 0;gap:8px}
  #sel input{width:104px;padding:9px;font-size:16px;border-radius:7px}
  #sel button{padding:13px!important;font-size:15px!important;border-radius:8px!important}
  #zoomb button{width:54px;height:54px;font-size:25px;border-radius:12px}
  #hint{font-size:14px}
  #ghost{font-size:14px;padding:5px 10px}
  #savesP{width:340px;font-size:14px}
  #newP{width:360px;font-size:14px}
  #newP .nrow input,#newP .nrow select{padding:11px;font-size:15px;max-width:200px}
  #newP .savebtn,#newP .closebtn{padding:13px;font-size:14px}
  #savesP .sb{padding:11px 14px;font-size:13px}
  #savesP .savebtn,#savesP .closebtn{padding:13px;font-size:14px}
 }
</style>
</head><body>
<div id="wrap">
 <div id="pal"><div id="palList"></div><div id="layers"></div></div>
 <div id="main">
  <div id="bar">
   <label>name</label><input id="fName" size="11" value="Crypt Depths">
   <label>act</label><input id="fAct" size="2" value="I">
   <label>theme</label><select id="fTheme"><option value="crypt">crypt</option><option value="">surface</option></select>
   <label>music</label><select id="fMusic"><option>act1</option><option>act2</option><option>crypt1</option><option>crypt2</option><option>ethereal1</option><option>ethereal2</option><option>title</option></select>
   <label>W</label><input id="fW" size="5" value="3200">
   <label>H</label><input id="fH" size="5" value="2900">
   <label>idx</label><input id="fIdx" size="2" value="2">
   <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">↶</button>
   <button class="btn" id="bRedo" title="Redo (Ctrl+Y)">↷</button>
   <button class="btn go" id="bPlay">▶ Play</button>
   <button class="btn" id="bExport">⭳ Export</button>
   <button class="btn" id="bImport">⭱ Import</button>
   <select class="btn" id="bLoad" title="Load an existing level to edit"><option value="">Load level…</option><option value="stage1.js|0">Cemetery · Act I</option><option value="stage2.js|1">Cemetery · Act II</option><option value="crypt1.js|2">Crypt Depths · Act I</option><option value="crypt2.js|3">Crypt Depths · Act II</option></select>
   <button class="btn" id="bSaves" title="Named local saves">💾 Saves</button>
   <button class="btn" id="bNew">✦ New Stage</button>
  </div>
  <div id="cvWrap">
   <canvas id="cv"></canvas>
   <div id="zoomb"><button id="zin">+</button><button id="zout">−</button></div>
   <div id="hint"></div>
   <div id="sel"></div>
   <div id="savesP"></div>
   <div id="newP"></div>
   <div id="toast"></div>
  </div>
 </div>
</div>
<div id="ghost"></div>
<script>
const GRID=20, TERRACE_DROP=130, DEF_TERR=600;
const ENEMY_COLS={zombie:'#6b7d52',zgen:'#3ad07a',gob:'#c8a24a',bd:'#9a6cff'};
const HAZ_COLS={spike:'#d9d2c0',rock:'#7a7280',tar:'#2a1f30',spikeshot:'#cfc8b6'};
const HAZ_LABEL={spike:'Bone Spike Pit',rock:'Rock Drop',tar:'Tar Pit',spikeshot:'Spike Cannon'};
const OBST_COLS={grave:'#8a82a6',crate:'#b6884a',chest:'#caa05a'};
const LOOTS=[['gold','Gold'],['soul','Soul \u00d71'],['soul5','Soul \u00d75'],['soul25','Soul \u00d725'],['soul50','Soul \u00d750'],['soul100','Soul \u00d7100'],['heart','Heart'],['stone_amethyst','Amethyst Stone'],['stone_chaos','Chaos Stone'],['stone_emerald','Emerald Stone'],['stone_fluorite','Fluorite Stone'],['stone_holy','Holy Stone'],['stone_obsidian','Obsidian Stone'],['stone_ruby','Ruby Stone'],['stone_sapphire','Sapphire Stone'],['stone_topaz','Topaz Stone'],['stone_master','Master Stone']];
const CATS=['Background','Foreground','Ground','Hazards','Enemies','Functions','Objects','Textures'];
const SOUL_COL_ED={1:'#7fe0ff',5:'#ff5a5a',25:'#5ae07a',50:'#b25aff',100:'#ffcf3c'};
const ASSET_PV=Date.now();
const BGE_IMG={cavebg:new Image(), cavebg2:new Image(), cryptbg:new Image(), rockwall:new Image()};
BGE_IMG.cavebg.onload=()=>draw(); BGE_IMG.cavebg.src='./assets/cavebg1.png';
BGE_IMG.cavebg2.onload=()=>draw(); BGE_IMG.cavebg2.src='./assets/cavebg2.png';
BGE_IMG.cryptbg.onload=()=>draw(); BGE_IMG.cryptbg.src='./assets/cryptbg1.png';
BGE_IMG.rockwall.onload=()=>draw(); BGE_IMG.rockwall.src='./assets/rockwall1.png?v=2';
const BG_LABEL={cavebg:'Cave Background (far)', cavebg2:'Cave Midground (near)', cryptbg:'Crypt Cavern (deep)', rockwall:'Rock Wall Texture'};
const TEX_COLS={ceiling:'#7a5a36',rockpile:'#8a6a3a'}, TEX_LABEL={ceiling:'Cave Ceiling',rockpile:'Rock Pile'};
const CAVEPLAT_IMG=new Image(); CAVEPLAT_IMG.onload=()=>draw(); CAVEPLAT_IMG.src='./assets/caveplat1.png';
const CHEST_E=new Image(); CHEST_E.onload=()=>draw(); CHEST_E.src='./assets/chest_closed1.png';
const TREEBIG_E=new Image(); TREEBIG_E.onload=()=>draw(); TREEBIG_E.src='./assets/sprites/trees_big.png';
const TREESM_E=new Image(); TREESM_E.onload=()=>draw(); TREESM_E.src='./assets/sprites/trees_small.png';
const GATE_E=new Image(); GATE_E.onload=()=>draw(); GATE_E.src='./assets/sprites/gate.png';
const CLOUD_E=new Image(); CLOUD_E.onload=()=>draw(); CLOUD_E.src='./assets/sprites/cloud.png';
let _cemBG=null;
function cemBG(){ const G=360, world=M.world; if(_cemBG&&_cemBG.world===world) return _cemBG;
  const stars=[],trees=[],graves=[],clouds=[];
  for(let k=0,n=Math.ceil(world/120);k<n;k++) stars.push([(k*149+(k*k*13)%100)%world, (k*71)%Math.floor(G*0.8), 0.6+((k*7)%16)/10]);
  for(let k=0,n=Math.ceil(world/180);k<n;k++) trees.push({x:80+k*180+((k*53)%50), big:(k%4===0)});
  for(let k=0,n=Math.ceil(world/150);k<n;k++) graves.push([80+k*150+((k*53)%40), 0.7+((k*29)%4)*0.1, (k%4===0)]);
  for(let k=0,n=Math.ceil(world/900)+1;k<n;k++) clouds.push({x:120+k*900+((k*131)%300), y:20+((k*61)%130), s:0.6+((k*29)%50)/100});
  _cemBG={world,stars,trees,graves,clouds}; return _cemBG; }
function dGraveBg(wx,sc,cross){ const x=sx(wx), base=sy(364), z=zoom; ctx.fillStyle='#211d33';
  if(cross){ const w=8*sc*z,ah=40*sc*z,aw=26*sc*z; ctx.fillRect(x-w/2,base-ah,w,ah); ctx.fillRect(x-aw/2,base-ah*0.72,aw,w); }
  else { const w=30*sc*z,hh=42*sc*z; ctx.beginPath(); ctx.moveTo(x-w/2,base); ctx.lineTo(x-w/2,base-hh+w/2); ctx.arc(x,base-hh+w/2,w/2,Math.PI,0); ctx.lineTo(x+w/2,base); ctx.closePath(); ctx.fill(); } }
function drawCemeteryBackdrop(){ const G=360, X=sx(0),Y=sy(0),Wd=M.world*zoom,Hd=M.h*zoom, z=zoom;
  ctx.save(); ctx.beginPath(); ctx.rect(X,Y,Wd,Hd); ctx.clip();
  const grad=ctx.createLinearGradient(0,Y,0,Y+Hd); grad.addColorStop(0,'#0d0a22'); grad.addColorStop(.55,'#241844'); grad.addColorStop(1,'#3a2152'); ctx.fillStyle=grad; ctx.fillRect(X,Y,Wd,Hd);
  const bg=cemBG();
  ctx.fillStyle='rgba(255,255,255,.6)'; for(const st of bg.stars){ ctx.fillRect(sx(st[0]),sy(st[1]),Math.max(1,st[2]*z),Math.max(1,st[2]*z)); }
  const mx=sx(740),my=sy(96); const gg=ctx.createRadialGradient(mx,my,4*z,mx,my,120*z); gg.addColorStop(0,'rgba(220,225,255,.35)'); gg.addColorStop(1,'rgba(220,225,255,0)'); ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(mx,my,120*z,0,7); ctx.fill(); ctx.fillStyle='#eef0ff'; ctx.beginPath(); ctx.arc(mx,my,40*z,0,7); ctx.fill();
  if(CLOUD_E.naturalWidth){ ctx.globalAlpha=.30; for(const cl of bg.clouds){ ctx.drawImage(CLOUD_E, sx(cl.x), sy(cl.y), 215*cl.s*z, 96*cl.s*z); } ctx.globalAlpha=1; }
  ctx.fillStyle='#1a1233'; for(let i=0,n=Math.ceil(M.world/620)+1;i<n;i++){ ctx.beginPath(); ctx.ellipse(sx(i*620+200), sy(G+40), 300*z,150*z,0,Math.PI,0); ctx.fill(); }
  for(const t of bg.trees){ const img=t.big?TREEBIG_E:TREESM_E, w=(t.big?165:80), h=(t.big?172:122); if(img.naturalWidth){ ctx.imageSmoothingEnabled=true; ctx.drawImage(img, sx(t.x)-w*z/2, sy(G+10)-h*z, w*z, h*z); } }
  for(const gr of bg.graves) dGraveBg(gr[0],gr[1],gr[2]);
  if(GATE_E.naturalWidth){ const gw=161,gh=90; for(let wx=0;wx<M.world;wx+=gw) ctx.drawImage(GATE_E, sx(wx), sy(G+6)-gh*z, gw*z, gh*z); }
  ctx.restore(); }
const CAVECEIL_IMG=new Image(); CAVECEIL_IMG.onload=()=>draw(); CAVECEIL_IMG.src='./assets/caveceil2.png';
const CAVEGND_IMG=new Image(); CAVEGND_IMG.onload=()=>draw(); CAVEGND_IMG.src='./assets/caveground_dirt1.png';
const CAVETOP_IMG=new Image(); CAVETOP_IMG.onload=()=>draw(); CAVETOP_IMG.src='./assets/caveground_top1.png';
const ROCKPILE_IMG=new Image(); ROCKPILE_IMG.onload=()=>draw(); ROCKPILE_IMG.src='./assets/tex_rockpile1.png';
// ---- real game art for WYSIWYG editor ----
const DIRT_SEAM=new Image(); DIRT_SEAM.onload=()=>draw(); DIRT_SEAM.src='./assets/dirt_seam1.png';
const GRASS_IMG=new Image(); GRASS_IMG.onload=()=>draw(); GRASS_IMG.src='./assets/sprites/grass.png';
const SPIKE_E=new Image(); SPIKE_E.onload=()=>draw(); SPIKE_E.src='./assets/haz_spike2.png';
const SPIKESHOT_E=new Image(); SPIKESHOT_E.onload=()=>draw(); SPIKESHOT_E.src='./assets/haz_spikeshot1.png';
const EDSPR={};
fetch('./assets/sprites.json').then(r=>r.json()).then(S=>{
  const ass=p=> p.startsWith('data:')?p:('./assets/'+p);
  const need={grave:S.obst.grave, crate:S.obst.crate, chkst:S.chkst, goal:S.goal,
    zombie:S.zombie.idle, zgen:(S.zgen&&(S.zgen.idle||S.zgen.walk)), gob:S.gob.idle, bd:S.bd.walk, bat:S.bat.idle};
  for(const k in need){ const m=need[k]; if(!m)continue; const img=new Image(); img.onload=()=>draw(); img.src=ass(m.src); EDSPR[k]={img,m}; }
  draw();
}).catch(()=>{});
// draw one sprite frame (frame 0) anchored bottom-center ('b') or center ('c')
function dSprite(key,dx,dy,sc,anchor,mir){ const e=EDSPR[key]; if(!e||!e.img.naturalWidth) return false;
  const m=e.m, sw=m.sw||m.w, sh=m.sh||m.h, w=m.w*sc, h=m.h*sc;
  ctx.save(); ctx.imageSmoothingEnabled=false; ctx.translate(dx,dy); if(mir)ctx.scale(-1,1);
  const oy = anchor==='c'? -h/2 : -h;
  ctx.drawImage(e.img, 0,0, sw,sh, -w/2, oy, w,h); ctx.restore(); return true; }
function tileSeam(X,Y,Wd,Dp){ if(!DIRT_SEAM.naturalWidth){ ctx.fillStyle='#3a2a1a'; ctx.fillRect(X,Y,Wd,Dp); return; }
  const T=84*zoom; ctx.save(); ctx.beginPath(); ctx.rect(X,Y,Wd,Dp); ctx.clip();
  for(let y=Y;y<Y+Dp;y+=T) for(let x=X;x<X+Wd+T;x+=T) ctx.drawImage(DIRT_SEAM,x,y,T,T); ctx.restore(); }
const STAMPS=[
 {k:'terrace',label:'Cemetery Ground',sw:'#7a5a36',cat:'Ground'},
 {k:'terrace_cave',label:'Cave Ground',sw:'#5a4a36',cat:'Ground'},
 {k:'plat_s',label:'Platform · static',sw:'#caa46a',cat:'Ground'},
 {k:'plat_m',label:'Platform · moving',sw:'#6ad0ff',cat:'Ground'},
 {k:'plat_c',label:'Platform · crumble',sw:'#e0843c',cat:'Ground'},
 {k:'plat_k',label:'Cave Slab (art)',sw:'#9a7b3a',cat:'Ground'},
 {k:'plat_cave_s',label:'Cave Platform · static',sw:'#7a5836',cat:'Ground'},
 {k:'plat_cave_m',label:'Cave Platform · moving',sw:'#6ad0ff',cat:'Ground'},

// ---- hit test ----
function hit(wxp,wyp){
 if(M.goal&&!locked.has('goal')&&Math.hypot(wxp-M.goal,wyp-(M.goalY-30))<44) return selGoal();
 for(const c of M.chk){ if(!locked.has(c)&&Math.hypot(wxp-c[0],wyp-(c[1]-30))<36) return wrap('chk',c,['x','gy'],[0,1]); }
 for(const s of M.souls){ if(!locked.has(s)&&Math.hypot(wxp-s[0],wyp-s[1])<24) return wrap('soul',s,['x','y'],[0,1]); }
 for(const b of M.bats){ if(!locked.has(b)&&Math.hypot(wxp-b[0],wyp-b[3])<28) return wrap('bat',b,['x','min','max','y'],[0,1,2,3]); }
 for(const e of M.enemies){ const ey=(e[4]??M.goalY); if(!locked.has(e)&&Math.abs(wxp-e[0])<32&&wyp<ey+8&&wyp>ey-50) return wrap('enemy',e,['x','min','max','gy'],[0,1,2,4],e[3]); }
 const ps=allProps().sort((a,b)=>b.z-a.z);  // visual top first
 for(const pr of ps){ if(locked.has(pr.raw)) continue; const r=pr.raw;
   if(pr.kind==='obst'){ const rw=r.type==='chest'?50:26, rh=r.type==='chest'?66:56; if(Math.abs(wxp-r.x)<rw&&wyp<(r.gy||0)+6&&wyp>(r.gy||0)-rh) return {type:'obst',kind:r.type,obj:r,raw:r,sync(){}}; }
   else if(pr.kind==='haz'){ if(r.t==='spikeshot'){ if((Math.abs(wxp-r.x)<30&&wyp>r.y-60&&wyp<r.y+60)||(wxp>=r.tx&&wxp<=r.tx+r.tw&&wyp>=r.ty&&wyp<=r.ty+r.th)) return {type:'haz',kind:'haz_'+r.t,obj:r,raw:r,sync(){}}; } else { const top=r.t==='rock'?r.y-16:r.y-24; if(wxp>=r.x-6&&wxp<=r.x+r.w+6&&wyp>=top&&wyp<=r.y+14) return {type:'haz',kind:'haz_'+r.t,obj:r,raw:r,sync(){}}; } }
   else if(pr.kind==='plat'){ const x=r.x??r.x0; if(wxp>=x-8&&wxp<=x+r.w+8&&Math.abs(wyp-r.y)<24) return {type:'plat',kind:'plat_'+r.t,obj:r,raw:r,sync(){}}; }
   else if(pr.kind==='terrace'){ if(wxp>=r[0]&&wxp<=r[1]&&wyp>=r[2]-4&&wyp<=r[2]+(r[3]||TERRACE_DROP)) return wrap('terrace',r,['x0','x1','gy','depth'],[0,1,2,3]); }
   else if(pr.kind==='tex'){ if(r.t==='rockpile'){ const dh=ROCKPILE_IMG.naturalWidth?r.w*ROCKPILE_IMG.naturalHeight/ROCKPILE_IMG.naturalWidth:60; if(wxp>=r.x-4&&wxp<=r.x+r.w+4&&wyp>=r.y-dh-4&&wyp<=r.y+4) return {type:'tex',kind:'tex_'+r.t,obj:r,raw:r,sync(){}}; } else { const dh=CAVECEIL_IMG.naturalWidth?r.w*CAVECEIL_IMG.naturalHeight/CAVECEIL_IMG.naturalWidth:60; if(wxp>=r.x-4&&wxp<=r.x+r.w+4&&wyp>=r.y-4&&wyp<=r.y+dh+4) return {type:'tex',kind:'tex_'+r.t,obj:r,raw:r,sync(){}}; } }
 }
 for(const b of (M.fg||[])){ if(b.w&&b.h&&!locked.has(b)&&wxp>=b.x&&wxp<=b.x+b.w&&wyp>=b.y&&wyp<=b.y+b.h) return {type:'fg',kind:'fg_'+b.t,obj:b,raw:b,sync(){}}; }
 for(const b of (M.bg||[])){ if(b.w&&b.h&&!locked.has(b)&&wxp>=b.x&&wxp<=b.x+b.w&&wyp>=b.y&&wyp<=b.y+b.h) return {type:'bg',kind:'bg_'+b.t,obj:b,raw:b,sync(){}}; }
 return null;
}
function selGoal(){ return {type:'goal',kind:'goal',obj:{x:M.goal,gy:M.goalY},raw:'goal',sync(){M.goal=this.obj.x;M.goalY=this.obj.gy;}}; }

function handles(s){
 if(!s) return [];
 if(s.type==='bg'||s.type==='fg'){ const o=s.obj; if(!(o.w&&o.h)) return []; return [{id:'bgtl',x:o.x,y:o.y},{id:'bgbr',x:o.x+o.w,y:o.y+o.h}]; }
 if(s.type==='terrace'){ const o=s.obj, dep=o.depth||TERRACE_DROP, cx=(o.x0+o.x1)/2, my=o.gy+dep/2;
   return [{id:'left',x:o.x0,y:my},{id:'right',x:o.x1,y:my},{id:'top',x:cx,y:o.gy},{id:'depth',x:cx,y:o.gy+dep}]; }
 if(s.type==='plat'){ const o=s.obj, x=o.x??o.x0; const hs=[{id:'pl',x:x,y:o.y},{id:'pr',x:x+o.w,y:o.y}];
   if(o.t==='m'){ const x0=o.x0??x, r=o.range||0; hs.push({id:'mstart',x:x0,y:o.y-26},{id:'mend',x:x0+r,y:o.y-26}); } return hs; }
 if(s.type==='tex'){ const o=s.obj, dh=CAVECEIL_IMG.naturalWidth?o.w*CAVECEIL_IMG.naturalHeight/CAVECEIL_IMG.naturalWidth:60; return [{id:'txl',x:o.x,y:o.y+dh/2},{id:'txr',x:o.x+o.w,y:o.y+dh/2}]; }
 if(s.type==='haz'){ const o=s.obj; if(o.t==='spikeshot') return [{id:'trxy',x:o.tx,y:o.ty},{id:'trwh',x:o.tx+o.tw,y:o.ty+o.th}]; const my=o.y+((o.t==='tar'?(o.d||22):16))/2; const hd=[{id:'hx',x:o.x,y:my},{id:'hw',x:o.x+o.w,y:my}]; if(o.t==='tar') hd.push({id:'td',x:o.x+o.w/2,y:o.y+(o.d||22)}); return hd; }

 return [];
}

function moveObj(h,start,dx,dy){
 const o=h.obj;
 if(h.type==='terrace'){ o.x0=start.x0+dx; o.x1=start.x1+dx; o.gy=start.gy+dy; }
 else if(h.type==='plat'){ if(start.x0!==undefined)o.x0=start.x0+dx; o.x=(start.x??start.x0)+dx; o.y=start.y+dy; }
 else if(h.type==='goal'){ o.x=start.x+dx; o.gy=start.gy+dy; }
 else if(h.type==='enemy'){ o.x=start.x+dx; o.min=start.min+dx; o.max=start.max+dx; o.gy=start.gy+dy; }
 else if(h.type==='bat'){ o.x=start.x+dx; o.min=start.min+dx; o.max=start.max+dx; o.y=start.y+dy; }
 else if(h.type==='haz'){ o.x=start.x+dx; o.y=start.y+dy; }
 else { o.x=start.x+dx; (o.gy!==undefined)?o.gy=start.gy+dy:o.y=start.y+dy; }
}
function resizeH(h,start,gx,gy){
 const o=sel.obj;
 // terrace
 if(h.id==='left'){ o.x0=Math.min(gx,o.x1-GRID); }
 else if(h.id==='right'){ o.x1=Math.max(gx,o.x0+GRID); }
 else if(h.id==='top'){ const bottom=o.gy+(o.depth||TERRACE_DROP); o.gy=Math.min(gy,bottom-GRID); o.depth=bottom-o.gy; }
 else if(h.id==='depth'){ o.depth=Math.max(GRID,gy-o.gy); }
 // platform (left/right + moving path)
 else if(h.id==='pr'){ const bx=o.x??o.x0; o.w=Math.max(GRID,gx-bx); }
 else if(h.id==='pl'){ const right=(o.x??o.x0)+o.w; o.x=Math.min(gx,right-GRID); if(o.x0!==undefined)o.x0=o.x; o.w=right-o.x; }
 else if(h.id==='mstart'){ const end=(o.x0??o.x)+(o.range||0); const nx=Math.min(gx,end-GRID); o.x0=nx; o.x=nx; o.range=Math.max(GRID,end-nx); }
 else if(h.id==='mend'){ o.range=Math.max(GRID,gx-(o.x0??o.x)); }
 // hazard
 else if(h.id==='td'){ o.d=Math.max(GRID,gy-o.y); }
 else if(h.id==='trxy'){ o.tx=gx; o.ty=gy; }
 else if(h.id==='trwh'){ o.tw=Math.max(GRID,gx-o.tx); o.th=Math.max(GRID,gy-o.ty); }
 else if(h.id==='hw'){ o.w=Math.max(GRID,gx-o.x); }
 else if(h.id==='hx'){ const r=o.x+o.w; o.x=Math.min(gx,r-GRID); o.w=r-o.x; }
 // enemy/bat patrol
 else if(h.id==='txr'){ o.w=Math.max(GRID,gx-o.x); }
 else if(h.id==='txl'){ const r=o.x+o.w; o.x=Math.min(gx,r-GRID); o.w=r-o.x; }
 else if(h.id==='min'){ o.min=Math.min(gx,o.x); }
 else if(h.id==='max'){ o.max=Math.max(gx,o.x); }
 else if(h.id==='bgbr'){ o.w=Math.max(GRID,gx-o.x); o.h=Math.max(GRID,gy-o.y); }
 else if(h.id==='bgtl'){ const rx=o.x+o.w, ry=o.y+o.h; o.x=Math.min(gx,rx-GRID); o.y=Math.min(gy,ry-GRID); o.w=rx-o.x; o.h=ry-o.y; }
}
document.getElementById('zin').onclick=()=>{ zoomAt(1.25); }; document.getElementById('zout').onclick=()=>{ zoomAt(0.8); };
function zoomAt(f){ const bx=wx(CW/2),by=wy(CH/2); zoom=Math.max(0.12,Math.min(1.6,zoom*f)); camx=bx-(CW/2)/zoom; camy=by-(CH/2)/zoom; draw(); }
cv.addEventListener('wheel',e=>{ e.preventDefault(); const c=cvxy(e),bx=wx(c.x),by=wy(c.y); zoom=Math.max(0.12,Math.min(1.6,zoom*(e.deltaY<0?1.12:0.89))); camx=bx-c.x/zoom; camy=by-c.y/zoom; draw(); },{passive:false});

function dTerr(s){ const dep=(s[3]||TERRACE_DROP), crypt=M.theme==='crypt', kind=(s[6]||'cemetery');
 const X=sx(s[0]),Y=sy(s[2]),Wd=(s[1]-s[0])*zoom,Dp=dep*zoom;
 if(kind==='cave'){
   if(CAVEGND_IMG.naturalWidth){ const T=84*zoom; ctx.save(); ctx.beginPath(); ctx.rect(X,Y,Wd,Dp); ctx.clip(); for(let y=Y;y<Y+Dp;y+=T) for(let x=X;x<X+Wd+T;x+=T) ctx.drawImage(CAVEGND_IMG,x,y,T,T); ctx.restore(); }
   else { ctx.fillStyle='#4a3a28'; ctx.fillRect(X,Y,Wd,Dp); }
   if(CAVETOP_IMG.naturalWidth){ const TH=104*zoom, tw=TH*CAVETOP_IMG.naturalWidth/CAVETOP_IMG.naturalHeight, topY=Y-0.40*TH; ctx.save(); ctx.beginPath(); ctx.rect(X,topY,Wd,TH); ctx.clip(); ctx.imageSmoothingEnabled=true; for(let x=X;x<X+Wd+tw;x+=tw) ctx.drawImage(CAVETOP_IMG,x,topY,tw,TH); ctx.restore(); }
   if(sel&&sel.raw===s){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-2,Y-2,Wd+4,Dp+4); }
   return;
 }
 tileSeam(X,Y,Wd,Dp);
 if(crypt){ ctx.fillStyle='rgba(34,22,52,0.55)'; ctx.fillRect(X,Y,Wd,Dp); ctx.fillStyle='rgba(224,169,60,0.10)'; ctx.fillRect(X,Y,Wd,10*zoom); }
 if(!crypt && GRASS_IMG.naturalWidth){ const gh=GRASS_IMG.height*0.55, gw=GRASS_IMG.width; ctx.save(); ctx.beginPath(); ctx.rect(X,Y-gh*0.4*zoom,Wd,gh*zoom); ctx.clip(); for(let xx=X;xx<X+Wd;xx+=gw*zoom) ctx.drawImage(GRASS_IMG,xx,Y-gh*0.4*zoom,gw*zoom,GRASS_IMG.height*zoom); ctx.restore(); }
 else { ctx.fillStyle=crypt?'#e0a93c':'#5a8a3a'; ctx.fillRect(X,Y,Wd,Math.max(2,4*zoom)); }
 if(sel&&sel.raw===s){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-2,Y-2,Wd+4,Dp+4); } }
function dPlat(p){ const x=p.x??p.x0;
 if(p.t==='k'){ if(CAVEPLAT_IMG.naturalWidth){ const dh=p.w*CAVEPLAT_IMG.naturalHeight/CAVEPLAT_IMG.naturalWidth; ctx.imageSmoothingEnabled=true; ctx.drawImage(CAVEPLAT_IMG, sx(x), sy(p.y-dh*0.46), p.w*zoom, dh*zoom); }
   else { ctx.fillStyle='#9a7b3a'; ctx.fillRect(sx(x),sy(p.y),p.w*zoom,Math.max(5,10*zoom)); }
   if(sel&&sel.obj===p){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(sx(x)-2,sy(p.y)-2,p.w*zoom+4,Math.max(5,10*zoom)+4); } return; }
 if(p.skin==='cave'){ const PHv=22*zoom, X=sx(x), Y=sy(p.y);
   if(CAVEGND_IMG.naturalWidth){ const T=84*zoom; ctx.save(); ctx.beginPath(); ctx.rect(X,Y,p.w*zoom,PHv); ctx.clip(); for(let yy=Y;yy<Y+PHv;yy+=T) for(let xx=X;xx<X+p.w*zoom+T;xx+=T) ctx.drawImage(CAVEGND_IMG,xx,yy,T,T); ctx.restore(); }
   else { ctx.fillStyle='#3a2a1a'; ctx.fillRect(X,Y,p.w*zoom,PHv); }
   if(CAVETOP_IMG.naturalWidth){ const TT=48*zoom, tw=TT*CAVETOP_IMG.naturalWidth/CAVETOP_IMG.naturalHeight, ty=Y-0.40*TT; ctx.save(); ctx.beginPath(); ctx.rect(X,ty,p.w*zoom,TT); ctx.clip(); ctx.imageSmoothingEnabled=true; for(let xx=X;xx<X+p.w*zoom+tw;xx+=tw) ctx.drawImage(CAVETOP_IMG,xx,ty,tw,TT); ctx.restore(); }
   if(p.t==='c'){ ctx.strokeStyle='rgba(10,6,16,.55)'; ctx.lineWidth=1; for(let cx2=x+14;cx2<x+p.w-6;cx2+=26){ ctx.beginPath(); ctx.moveTo(sx(cx2),Y+3*zoom); ctx.lineTo(sx(cx2)-4,Y+10*zoom); ctx.stroke(); } }
   if(p.t==='m'){ const x0=p.x0??x, r=p.range||0, py=sy(p.y-26); ctx.strokeStyle='#6ad0ffaa'; ctx.lineWidth=2; ctx.setLineDash([6,4]); ctx.beginPath(); ctx.moveTo(sx(x0),py); ctx.lineTo(sx(x0+r),py); ctx.stroke(); ctx.setLineDash([]); }
   if(sel&&sel.obj===p){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-2,Y-2,p.w*zoom+4,22*zoom+4); }
   return; }
 const PHv=22*zoom, X=sx(x), Y=sy(p.y);
 tileSeam(X,Y,p.w*zoom,PHv);
 if(GRASS_IMG.naturalWidth){ const gw=GRASS_IMG.width*zoom, gh=GRASS_IMG.height*zoom; ctx.save(); ctx.beginPath(); ctx.rect(X,Y-gh*0.4,p.w*zoom,gh*0.7); ctx.clip(); for(let xx=X;xx<X+p.w*zoom;xx+=gw) ctx.drawImage(GRASS_IMG,xx,Y-gh*0.4,gw,gh); ctx.restore(); }
 else { ctx.fillStyle=p.t==='c'?'#e0843c':'#5a8a3a'; ctx.fillRect(X,Y,p.w*zoom,3); }
 if(p.t==='c'){ ctx.strokeStyle='rgba(10,6,16,.55)'; ctx.lineWidth=1; for(let cx2=x+14;cx2<x+p.w-6;cx2+=26){ ctx.beginPath(); ctx.moveTo(sx(cx2),Y+3*zoom); ctx.lineTo(sx(cx2)-4,Y+10*zoom); ctx.stroke(); } }
 if(p.t==='m'){ const x0=p.x0??x, r=p.range||0, py=sy(p.y-26);
   ctx.strokeStyle='#6ad0ffaa'; ctx.lineWidth=2; ctx.setLineDash([6,4]); ctx.beginPath(); ctx.moveTo(sx(x0),py); ctx.lineTo(sx(x0+r),py); ctx.stroke(); ctx.setLineDash([]);
   ctx.fillStyle='#6ad0ff'; [x0,x0+r].forEach(e=>{ ctx.beginPath(); ctx.moveTo(sx(e),py-5); ctx.lineTo(sx(e),py+5); ctx.lineWidth=2; ctx.stroke(); });
   ctx.fillStyle='#6ad0ff99'; ctx.fillRect(sx(x0+p.w),sy(p.y),Math.max(0,(r)*zoom),3); }
 if(sel&&sel.obj===p){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(sx(x)-2,sy(p.y)-2,p.w*zoom+4,22*zoom+4); } }
function dHaz(h){ const X=sx(h.x),Y=sy(h.y),Wd=h.w*zoom;
 if(h.t==='spikeshot'){ const dir=h.dir||-1, tX=sx(h.tx),tY=sy(h.ty),tW=h.tw*zoom,tH=h.th*zoom;
   ctx.fillStyle='rgba(95,180,255,.10)'; ctx.fillRect(tX,tY,tW,tH);
   ctx.strokeStyle='#5fb4ff'; ctx.lineWidth=1.5; ctx.setLineDash([7,5]); ctx.strokeRect(tX,tY,tW,tH); ctx.setLineDash([]);
   ctx.fillStyle='#5fb4ff'; ctx.font=Math.round(11*Math.min(1.5,zoom))+'px sans-serif'; ctx.fillText('TRIGGER ZONE',tX+5,tY+15);
   for(let k=-1;k<=1;k++){ const yy=Y+k*40*zoom;
     if(SPIKESHOT_E.naturalWidth){ const hh=34*zoom, ww=hh*SPIKESHOT_E.naturalWidth/SPIKESHOT_E.naturalHeight; ctx.save(); ctx.translate(X,yy); ctx.scale(dir,1); ctx.imageSmoothingEnabled=true; ctx.drawImage(SPIKESHOT_E,-ww/2,-hh/2,ww,hh); ctx.restore(); }
     else { ctx.fillStyle='#cfc8b6'; ctx.strokeStyle='#6b6457'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(X+dir*16*zoom,yy); ctx.lineTo(X-dir*12*zoom,yy-9*zoom); ctx.lineTo(X-dir*12*zoom,yy+9*zoom); ctx.closePath(); ctx.fill(); ctx.stroke(); } }
   ctx.strokeStyle='#e0506a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X+dir*64*zoom,Y); ctx.stroke();
   ctx.beginPath(); ctx.moveTo(X+dir*64*zoom,Y); ctx.lineTo(X+dir*50*zoom,Y-6*zoom); ctx.lineTo(X+dir*50*zoom,Y+6*zoom); ctx.closePath(); ctx.fillStyle='#e0506a'; ctx.fill();
   if(sel&&sel.raw===h){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-22*zoom,Y-58*zoom,44*zoom,116*zoom); }
   return; }
 if(h.t==='spike'){ if(SPIKE_E.naturalWidth){ const th=72*zoom, tw=th*SPIKE_E.naturalWidth/SPIKE_E.naturalHeight;
     ctx.save(); ctx.beginPath(); ctx.rect(X,Y-th+18*zoom,Wd,th); ctx.clip(); ctx.imageSmoothingEnabled=true; for(let xx=X;xx<X+Wd;xx+=tw) ctx.drawImage(SPIKE_E,xx,Y+22*zoom-th,tw,th); ctx.restore(); }
   else { ctx.fillStyle='#d9d2c0'; for(let cx2=h.x;cx2<h.x+h.w-6;cx2+=18){ const px=sx(cx2),hh=18*zoom; ctx.beginPath(); ctx.moveTo(px,Y); ctx.lineTo(px+8*zoom,Y-hh); ctx.lineTo(px+16*zoom,Y); ctx.fill(); } } }
 else if(h.t==='tar'){ const td=(h.d||22), top=Y-8*zoom, H2=(td+8)*zoom; const g2=ctx.createLinearGradient(0,top,0,top+H2); g2.addColorStop(0,'#241a2e'); g2.addColorStop(1,'#0c0712'); ctx.fillStyle=g2; ctx.fillRect(X,top,Wd,H2); ctx.fillStyle='rgba(150,130,170,.28)'; ctx.fillRect(X,top,Wd,2*zoom); }
 else if(h.t==='rock'){ ctx.fillStyle='#3a3340'; ctx.fillRect(X,Y-12*zoom,Wd,12*zoom);
   ctx.strokeStyle='rgba(122,114,128,.5)'; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X+Wd,Y); ctx.stroke(); ctx.setLineDash([]);
   const n=Math.max(1,Math.round(h.w/160)), step=h.w/n;
   for(let i=0;i<n;i++){ const spx=sx(h.x+step*(i+0.5)); ctx.fillStyle='#ff5050'; ctx.beginPath(); ctx.moveTo(spx-5,Y-2); ctx.lineTo(spx+5,Y-2); ctx.lineTo(spx,Y+8*zoom); ctx.fill();
     ctx.fillStyle='#7a7280'; ctx.beginPath(); ctx.arc(spx,Y-6*zoom,3,0,7); ctx.fill(); }
   ctx.fillStyle='rgba(255,120,120,.7)'; ctx.font='9px sans-serif'; ctx.fillText('\u25bc x'+n+' drop', X+2, Y-15*zoom); }
 if(sel&&sel.raw===h){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-2,Y-(h.t==='rock'?14:24)*zoom-2,Wd+4,(h.t==='rock'?16:38)*zoom+4); } }
function dTex(t){ const X=sx(t.x),Y=sy(t.y);
 if(t.t==='ceiling'&&CAVECEIL_IMG.naturalWidth){ const dh=t.w*CAVECEIL_IMG.naturalHeight/CAVECEIL_IMG.naturalWidth; ctx.imageSmoothingEnabled=true; ctx.globalAlpha=0.96; ctx.drawImage(CAVECEIL_IMG, X, Y, t.w*zoom, dh*zoom); ctx.globalAlpha=1;
   if(sel&&sel.raw===t){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-2,Y-2,t.w*zoom+4,dh*zoom+4); } }
 else if(t.t==='rockpile'&&ROCKPILE_IMG.naturalWidth){ const dh=t.w*ROCKPILE_IMG.naturalHeight/ROCKPILE_IMG.naturalWidth; ctx.imageSmoothingEnabled=true; ctx.drawImage(ROCKPILE_IMG, X, Y-dh*zoom, t.w*zoom, dh*zoom);
   if(sel&&sel.raw===t){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-2,Y-dh*zoom-2,t.w*zoom+4,dh*zoom+4); } }
 else { ctx.fillStyle='#7a5a36'; ctx.fillRect(X,Y,t.w*zoom,30*zoom); } }
function dObst(o){ const X=sx(o.x),Y=sy(o.gy||0);
 if(o.type==='chest'){ if(CHEST_E.naturalWidth){ const dw=96*zoom, dh=dw*CHEST_E.naturalHeight/CHEST_E.naturalWidth; ctx.imageSmoothingEnabled=true; ctx.save(); if(o.f===-1){ctx.translate(X,0);ctx.scale(-1,1);ctx.translate(-X,0);} ctx.drawImage(CHEST_E,X-dw/2,Y-dh,dw,dh); ctx.restore(); if(sel&&sel.raw===o){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-dw/2-2,Y-dh-2,dw+4,dh+4); } }
   else { ctx.fillStyle='#5a3a1e'; ctx.fillRect(X-48*zoom,Y-62*zoom,96*zoom,62*zoom); } return; }
 if(!dSprite(o.type,X,Y,zoom,'b',o.f===-1)){ ctx.fillStyle=OBST_COLS[o.type]||'#999';
   if(o.type==='crate'){ const ww=40*zoom; ctx.fillRect(X-ww/2,Y-ww,ww,ww); } else { const w2=34*zoom,h2=46*zoom; ctx.beginPath(); ctx.moveTo(X-w2/2,Y); ctx.lineTo(X-w2/2,Y-h2+w2/2); ctx.arc(X,Y-h2+w2/2,w2/2,Math.PI,0); ctx.lineTo(X+w2/2,Y); ctx.fill(); } }
 if(sel&&sel.raw===o){ const e=EDSPR[o.type], h=e?e.m.h*zoom:50*zoom, w=e?e.m.w*zoom:40*zoom; ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-w/2-2,Y-h-2,w+4,h+4); } }
function draw(){
 syncFields(); ctx.clearRect(0,0,CW,CH);
 if(M.theme==='crypt'){ ctx.fillStyle='#0a0712'; ctx.fillRect(0,0,CW,CH); }
 else { ctx.fillStyle='#0c0a16'; ctx.fillRect(0,0,CW,CH); drawCemeteryBackdrop(); }
 for(const b of (M.bg||[])){ const img=BGE_IMG[b.t]; if(!img||!img.naturalWidth) continue;
   ctx.globalAlpha=b.t==='cavebg2'?1:0.9;
   if(b.w&&b.h){ const X=sx(b.x||0), Y=sy(b.y||0), W2=b.w*zoom, H2=b.h*zoom;
     if(b.tile){ const ts=(b.tscale||1), tw=Math.max(2,img.naturalWidth*ts*zoom), th=Math.max(2,img.naturalHeight*ts*zoom); ctx.save(); ctx.beginPath(); ctx.rect(X,Y,W2,H2); ctx.clip(); for(let yy=Y; yy<Y+H2; yy+=th) for(let xx=X; xx<X+W2; xx+=tw) ctx.drawImage(img,xx,yy,tw,th); ctx.restore(); }
     else ctx.drawImage(img, X, Y, W2, H2);
     if(sel&&sel.raw===b){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X,Y,W2,H2); } }
   else { const X=sx(0),Y=sy(0),Wd=M.world*zoom,Hd=M.h*zoom;
     const sc=Math.max(Wd/img.naturalWidth,Hd/img.naturalHeight); const dw=img.naturalWidth*sc, dh=img.naturalHeight*sc;
     ctx.save(); ctx.beginPath(); ctx.rect(X,Y,Wd,Hd); ctx.clip();
     for(let y=Y;y<Y+Hd;y+=dh) for(let x=X;x<X+Wd+dw;x+=dw) ctx.drawImage(img,x,y,dw,dh); ctx.restore(); }
   ctx.globalAlpha=1; }
 ctx.strokeStyle='#2a2150'; ctx.lineWidth=2; ctx.strokeRect(sx(0),sy(0),M.world*zoom,M.h*zoom);
 ctx.strokeStyle='#ffffff08'; ctx.lineWidth=1; ctx.beginPath(); const g=GRID*5;
 for(let x=0;x<=M.world;x+=g){ ctx.moveTo(sx(x),sy(0)); ctx.lineTo(sx(x),sy(M.h)); }
 for(let y=0;y<=M.h;y+=g){ ctx.moveTo(sx(0),sy(y)); ctx.lineTo(sx(M.world),sy(y)); }
 ctx.stroke();
 allProps().sort((a,b)=>a.z-b.z).forEach(pr=>{ if(pr.kind==='terrace')dTerr(pr.raw); else if(pr.kind==='plat')dPlat(pr.raw); else if(pr.kind==='haz')dHaz(pr.raw); else if(pr.kind==='tex')dTex(pr.raw); else dObst(pr.raw); });
 if(sel&&sel.type==='bulkswap'){ for(const r of sel.members){ const c=propCenterRaw(r); const X=sx(c[0]),Y=sy(c[1]); ctx.fillStyle='rgba(200,251,80,.16)'; ctx.strokeStyle='#c8fb50'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(X,Y,18,0,7); ctx.fill(); ctx.stroke(); } }
 for(const s of M.souls){ ctx.fillStyle=SOUL_COL_ED[s[2]||1]||'#7fe0ff'; ctx.beginPath(); ctx.arc(sx(s[0]),sy(s[1]),Math.max(3,6*zoom),0,7); ctx.fill(); }
 for(const e of M.enemies){ const ey=(e[4]??M.goalY);
   ctx.strokeStyle='#ffffff2a'; ctx.beginPath(); ctx.moveTo(sx(e[1]),sy(ey)+3); ctx.lineTo(sx(e[2]),sy(ey)+3); ctx.stroke();
   if(!dSprite(e[3], sx(e[0]), sy(ey), zoom, 'b', (e[5]!==undefined?e[5]:-1)===-1)){ ctx.fillStyle=ENEMY_COLS[e[3]]||'#aaa'; const ww=24*zoom,hh=34*zoom; ctx.fillRect(sx(e[0])-ww/2,sy(ey)-hh,ww,hh); ctx.fillStyle='#000a'; ctx.font='9px sans-serif'; ctx.fillText(e[3],sx(e[0])-ww/2+1,sy(ey)-hh+9); }
   if(sel&&sel.raw===e){ const m=EDSPR[e[3]]; const w=(m?m.m.w:30)*zoom,hh=(m?m.m.h:40)*zoom; ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(sx(e[0])-w/2-2,sy(ey)-hh-2,w+4,hh+4); } }
 for(const b of M.bats){
   ctx.strokeStyle='#b07a5a55'; ctx.beginPath(); ctx.moveTo(sx(b[1]),sy(b[3])); ctx.lineTo(sx(b[2]),sy(b[3])); ctx.stroke();
   if(!dSprite('bat', sx(b[0]), sy(b[3]), zoom*0.62, 'c', b[4]===-1)){ ctx.fillStyle='#b07a5a'; ctx.beginPath(); ctx.ellipse(sx(b[0]),sy(b[3]),12*zoom,7*zoom,0,0,7); ctx.fill(); }
   if(sel&&sel.raw===b){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx(b[0]),sy(b[3]),28*zoom,0,7); ctx.stroke(); } }
 for(const c of M.chk){ const X=sx(c[0]),Y=sy(c[1]);
   if(!dSprite('chkst', X, Y, zoom, 'b', false)){ ctx.fillStyle='#ff9a3c'; ctx.fillRect(X-2,Y-46*zoom,4,46*zoom); ctx.beginPath(); ctx.moveTo(X+2,Y-46*zoom); ctx.lineTo(X+26*zoom,Y-38*zoom); ctx.lineTo(X+2,Y-30*zoom); ctx.fill(); }

function openGroupMenu(name, ev){ _openMenu(ev,[
  {label:'\u270e  Rename group', action:()=>{ renameGroup(name); buildLayers(); }},
  {label:'\ud83d\udcc2  Ungroup', danger:true, action:()=>{ ungroup(name); buildLayers(); }}
]); }
function centerOn(x,y){ camx=x-(CW/2)/zoom; camy=y-(CH/2)/zoom; }

// ---- persist / io / play ----
function persist(){ syncFields(); try{ localStorage.setItem('creapz_editdraft',JSON.stringify(M)); }catch(e){} }
// ---- undo / redo (state snapshots) ----
let undoStack=[], redoStack=[];
function snapM(){ syncFields(); return JSON.stringify(M); }
function histPush(){ undoStack.push(snapM()); if(undoStack.length>80) undoStack.shift(); redoStack.length=0; updHist(); }
function restoreM(js){ M=Object.assign(blankLevel(),JSON.parse(js)); M.theme=M.theme||''; loadFields(); sel=null; showSel(); persist(); draw(); }
function undo(){ if(!undoStack.length) return; redoStack.push(snapM()); restoreM(undoStack.pop()); updHist(); }
function redo(){ if(!redoStack.length) return; undoStack.push(snapM()); restoreM(redoStack.pop()); updHist(); }
function updHist(){ const u=document.getElementById('bUndo'),r=document.getElementById('bRedo');
  if(u){ u.style.opacity=undoStack.length?1:0.35; } if(r){ r.style.opacity=redoStack.length?1:0.35; } }
document.getElementById('bUndo').onclick=undo;
document.getElementById('bRedo').onclick=redo;
addEventListener('keydown',e=>{ const z=(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z';
  if(z){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){ e.preventDefault(); if(sel) dupSel(); } });
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2400); }
function cleanLevel(){ syncFields(); const o={name:M.name,act:M.act,music:M.music}; if(M.theme)o.theme=M.theme;
 o.world=M.world;o.h=M.h;o.goal=M.goal;o.goalY=M.goalY;o.seg=M.seg;o.obst=M.obst||[];o.plats=M.plats;o.chk=M.chk;o.souls=M.souls;o.enemies=M.enemies;o.bats=M.bats;o.hazards=M.hazards||[];o.tex=M.tex||[];o.bg=M.bg||[];o.fg=M.fg||[]; return o; }
document.getElementById('bExport').onclick=()=>{ const idx=+v('fIdx')||2; const o=cleanLevel();
 const js='window.STAGES=window.STAGES||[];window.STAGES['+idx+']='+JSON.stringify(o,null,1)+';\n';
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));
 a.download='level-'+(o.name.toLowerCase().replace(/[^a-z0-9]+/g,'')||'stage')+'-act'+o.act+'.js'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('exported - send to Claude to commit'); };
document.getElementById('bImport').onclick=()=>{ const inp=document.createElement('input'); inp.type='file';
 inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; f.text().then(tx=>{ try{ let j=tx.trim(); const i=j.indexOf('={'); if(i>=0)j=j.slice(i+1,j.lastIndexOf('}')+1);
   histPush(); M=Object.assign(blankLevel(),migrateLevel(JSON.parse(j))); M.theme=M.theme||''; loadFields(); sel=null; showSel(); persist(); draw(); toast('imported'); }catch(err){ toast('import failed: '+err.message); } }); }; inp.click(); };
document.getElementById('bLoad').onchange=function(){ const v=this.value; this.selectedIndex=0; if(!v)return; const parts=v.split('|'), file=parts[0], idx=parts[1];
  if(!confirm('Load this level into the editor? Your current unsaved work will be replaced.')) return;
  fetch('./levels/'+file+'?'+Date.now()).then(r=>r.text()).then(tx=>{ try{ const i=tx.indexOf('={');
    histPush(); M=Object.assign(blankLevel(),migrateLevel(JSON.parse(tx.slice(i+1,tx.lastIndexOf('}')+1)))); M.theme=M.theme||''; loadFields(); const fi=document.getElementById('fIdx'); if(fi)fi.value=idx; sel=null; showSel(); persist(); draw(); toast('loaded '+file); }catch(err){ toast('load failed: '+err.message); } }); };
function musicOpts(selv){ return ['act1','act2','crypt1','crypt2','ethereal1','ethereal2','title'].map(m=>'<option'+(m===selv?' selected':'')+'>'+m+'</option>').join(''); }
function openNew(){ const p=document.getElementById('newP');
  p.innerHTML='<h4>✦ New Stage</h4>'
   +'<div class="nrow"><span>name</span><input id="nwName" value="New Stage"></div>'
   +'<div class="nrow"><span>act</span><input id="nwAct" value="I" style="max-width:70px"></div>'
   +'<div class="nrow"><span>theme</span><select id="nwTheme"><option value="crypt">crypt (cave / vertical)</option><option value="">surface (graveyard)</option></select></div>'
   +'<div class="nrow"><span>width</span><input id="nwW" inputmode="numeric" value="3200"></div>'
   +'<div class="nrow"><span>height</span><input id="nwH" inputmode="numeric" value="2900"></div>'
   +'<div class="nrow"><span>music</span><select id="nwMusic">'+musicOpts('crypt1')+'</select></div>'
   +'<button class="savebtn" id="nwCreate">Create stage</button><button class="closebtn" id="nwCancel">Cancel</button>';
  p.style.display='block';
  const th=p.querySelector('#nwTheme');
  th.onchange=()=>{ if(th.value==='crypt'){ p.querySelector('#nwW').value=3200; p.querySelector('#nwH').value=2900; p.querySelector('#nwMusic').value='crypt1'; } else { p.querySelector('#nwW').value=6000; p.querySelector('#nwH').value=520; p.querySelector('#nwMusic').value='act1'; } };
  p.querySelector('#nwCreate').onclick=createNew;
  p.querySelector('#nwCancel').onclick=closeNew; }
function closeNew(){ const p=document.getElementById('newP'); if(p)p.style.display='none'; }
function createNew(){ const p=document.getElementById('newP');
  const name=(p.querySelector('#nwName').value||'New Stage').trim();
  const act=(p.querySelector('#nwAct').value||'I').trim();
  const theme=p.querySelector('#nwTheme').value;
  const w=Math.max(800,+p.querySelector('#nwW').value||3200);
  const h=Math.max(360,+p.querySelector('#nwH').value||(theme==='crypt'?2900:520));
  const music=p.querySelector('#nwMusic').value;
  histPush();
  const G=theme==='crypt'?400:360;
  const ground = theme==='crypt' ? [0, Math.round(w*0.7), G, 140, 10, '1F', 'cave'] : [0, w, G, Math.max(80,Math.min(160,h-G)), 10];
  M={ name, act, music, theme, world:w, h:h,
      goal: theme==='crypt'?Math.round(w*0.85):w-120,
      goalY: theme==='crypt'?Math.max(G+200,h-180):G,
      seg:[ground], plats:[], chk:[], souls:[], enemies:[], bats:[], obst:[], hazards:[], tex:[],
      bg: theme==='crypt'?[{t:'cavebg',par:0.2}]:[], fg:[] };
  loadFields(); sel=null; showSel(); camx=0; camy=0; zoom=Math.min(CW/Math.min(w,1600), CH/Math.min(h,900)); persist(); draw(); closeNew(); toast('new stage “'+name+'” created'); }
document.getElementById('bNew').onclick=()=>{ const p=document.getElementById('newP'); if(p.style.display==='block')closeNew(); else openNew(); };
// ---- named local saves ----
const escH=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getSaves(){ try{ return JSON.parse(localStorage.getItem('creapz_saves')||'{}'); }catch(e){ return {}; } }
function setSaves(o){ try{ localStorage.setItem('creapz_saves',JSON.stringify(o)); return true; }catch(e){ toast('save failed - storage full'); return false; } }
function saveCurrentAs(){ const def=(M.name||'Level')+(M.act?' '+M.act:''); const name=(prompt('Save current level as:', def)||'').trim(); if(!name)return;
  const o=getSaves(); if(o[name] && !confirm('A save named "'+name+'" exists. Overwrite it?'))return;
  o[name]={data:cleanLevel(), ts:Date.now()}; if(setSaves(o)){ toast('saved "'+name+'"'); renderSaves(); } }
function loadSave(name){ const o=getSaves(); if(!o[name])return; if(!confirm('Load "'+name+'"? This replaces the current editor contents.'))return;
  histPush(); M=Object.assign(blankLevel(),migrateLevel(o[name].data)); M.theme=M.theme||''; loadFields(); sel=null; showSel(); persist(); draw(); toast('loaded "'+name+'"'); closeSaves(); }
function deleteSave(name){ if(!confirm('Delete saved level "'+name+'"? This cannot be undone.'))return; const o=getSaves(); delete o[name]; setSaves(o); renderSaves(); }
function renderSaves(){ const p=document.getElementById('savesP'); const o=getSaves(); const names=Object.keys(o).sort((a,b)=>(o[b].ts||0)-(o[a].ts||0));
  let h='<h4>Local Saves</h4><button class="savebtn" id="svSave">+  Save current level…</button>';
  if(!names.length) h+='<div style="opacity:.6;padding:8px 4px;line-height:1.4">No saved levels yet. Save your current work here so it survives loading other levels or closing the tab.</div>';
  names.forEach(n=>{ const d=new Date(o[n].ts||0), ds=isNaN(d.getTime())?'':d.toLocaleString();
    h+='<div class="srow"><span class="nm" title="'+escH(n)+'">'+escH(n)+'<br><span style="font-size:10px;opacity:.5">'+ds+'</span></span>'
      +'<button class="sb load" data-l="'+encodeURIComponent(n)+'">Load</button>'
      +'<button class="sb del" data-d="'+encodeURIComponent(n)+'">✕</button></div>'; });
  h+='<button class="closebtn" id="svClose">Close</button>';
  p.innerHTML=h;
  p.querySelector('#svSave').onclick=saveCurrentAs;
  p.querySelector('#svClose').onclick=closeSaves;
  p.querySelectorAll('.sb.load').forEach(b=>b.onclick=()=>loadSave(decodeURIComponent(b.dataset.l)));
  p.querySelectorAll('.sb.del').forEach(b=>b.onclick=()=>deleteSave(decodeURIComponent(b.dataset.d)));
}
function openSaves(){ document.getElementById('savesP').style.display='block'; renderSaves(); }
function closeSaves(){ document.getElementById('savesP').style.display='none'; }
document.getElementById('bSaves').onclick=()=>{ const p=document.getElementById('savesP'); if(p.style.display==='block')closeSaves(); else openSaves(); };

document.getElementById('bPlay').onclick=()=>{ try{ localStorage.setItem('creapz_testlevel',JSON.stringify(cleanLevel())); }catch(e){} location.href='./?test=1'; };

// ---- boot ----
try{ const d=localStorage.getItem('creapz_editdraft'); if(d){ M=Object.assign(blankLevel(),migrateLevel(JSON.parse(d))); } }catch(e){}
loadFields(); fit(); updHist();
</script>
</body></html>
