<!doctype html>
<html><head>
<script src="assets/vendor/lame.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>cReapZ World Builder · build R11</title>
<style>
 :root{--bg:#0c0a16;--panel:#15112a;--ink:#e8e6f5;--mut:#9b8cff;--lime:#c8fb50;--line:#2a2150;}
 *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
 #wrap{display:flex;height:100%}
 #pal{width:194px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
 #palList{flex:1 1 56%;overflow-y:auto;padding:8px;border-bottom:2px solid var(--line)}
 #layers{flex:1 1 44%;overflow-y:auto;padding:8px}
 #pal h3{font-size:10px;letter-spacing:.5px;color:var(--mut);margin:12px 6px 6px;text-transform:uppercase}
 .cat{font-size:10px;letter-spacing:.5px;color:var(--lime);margin:10px 4px 4px;text-transform:uppercase;font-weight:700}
 .pcat{font-size:10px;letter-spacing:.5px;color:var(--lime);margin:10px 4px 4px;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
 .pcat.sub{margin-left:14px;color:#cdb674;font-size:9px}
 .pcat .cchev{font-size:9px;opacity:.85;width:10px;flex:none}
 .pcat .pcname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .pcat .ccount{background:#241d44;color:#9b8cff;border-radius:8px;padding:1px 6px;font-size:9px;font-weight:600;flex:none}
 .pcat .corg{flex:none;background:none;border:none;color:#9b8cff;font-size:13px;cursor:pointer;padding:0 2px;line-height:1}
 .tool.sub{margin-left:14px}
 .pcat.drop{background:#16301d;outline:1px solid #3fbf6a;border-radius:6px}
 .pcat.catdrop{outline:2px solid var(--lime);background:#1a2410;border-radius:6px}
 .pcat.catdrag{opacity:.45}
 .delasset{margin-left:auto;background:#3a1620;border:1px solid #e23b3b;color:#ff9a9a;border-radius:5px;font-size:11px;line-height:1;padding:3px 7px;cursor:pointer;flex:none}
 .orgbar{display:flex;gap:6px;margin:6px 4px 2px}
 .orgbar button{flex:1;font-size:11px;padding:7px;border-radius:7px;border:1px solid var(--line);background:#1d1838;color:#cdbbe6;cursor:pointer}
 .orgbar button.on{background:#16301d;border-color:#3fbf6a;color:#a8f0c0}
 .litem{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:6px;font-size:12px;cursor:pointer;margin:1px 0}
 .litem.ldrag{opacity:.5;outline:1px solid var(--lime)}
 .litem.ghead.grouphl{outline:2px solid var(--lime);background:#26331a}
 .litem:hover{background:#1d1838}
 .litem.sel{background:#242a16;outline:1px solid var(--lime)}
 .litem .lc{width:11px;height:11px;border-radius:2px;flex:none}
 .litem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .litem .lb{background:#241d44;border:none;color:#cdbbe6;border-radius:5px;font-size:14px;line-height:1;padding:5px 8px;cursor:pointer;min-width:26px;text-align:center}
 .litem .lb:hover{background:#352a5c}
 .litem.lock{opacity:.5}
 .litem.ghead{background:#1a2336;outline:1px solid #3b5a8c;margin-top:4px}
 .litem.member{margin-left:14px;font-size:11px}
 .lck{width:16px;height:16px;border:1px solid #6a6088;border-radius:3px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#c8fb50}
 #grpbtn,#addgrpbtn{width:100%;margin:4px 0 6px;background:#1d2a3a;border:1px solid #5b9cff;color:#bcd9ff;border-radius:6px;padding:7px;cursor:pointer;font-size:12px}
 #addgrpbtn{background:#16301d;border-color:#3fbf6a;color:#a8f0c0}
 .tool{display:flex;align-items:center;gap:8px;padding:9px 10px;margin:4px 0;border-radius:8px;background:#1d1838;border:1px solid transparent;cursor:grab;font-size:13px;touch-action:pan-y}
 .tool.dragging{opacity:.6;border-color:var(--lime);background:#242a16}
 .tool:active{cursor:grabbing}
 .tool.on{border-color:var(--lime);background:#242a16}
 .tool .sw{width:15px;height:15px;border-radius:3px;flex:none}
 .modebtn{display:flex;align-items:center;gap:8px;padding:9px 10px;margin:4px 0;border-radius:8px;background:#1d1838;border:1px solid transparent;cursor:pointer;font-size:13px}
 .modebtn.on{border-color:var(--lime);background:#242a16}
 #main{flex:1;display:flex;flex-direction:column;min-width:0}
 #bar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;max-width:100%;box-sizing:border-box}
 #bar input,#bar select{background:#0e0b1d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:12px}
 #bar label{font-size:11px;color:var(--mut)}
 .btn{background:#2a2150;color:var(--ink);border:1px solid #7b5cff;border-radius:7px;padding:8px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
 .btn svg{width:16px;height:16px;stroke-width:2}
 .btn i[data-lucide]{font-style:normal;display:inline-flex;align-items:center}
 .grp{display:inline-flex;flex-wrap:wrap;max-width:100%;align-items:center;gap:5px 6px;padding:4px 8px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
 .grp>.glabel{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);opacity:.6;padding-right:1px}
 .grp-save{background:rgba(91,156,255,.09);border-color:#2f4663}
 .grp-edit{background:rgba(120,140,160,.06);border-color:#384350}
 .grp-assets{background:rgba(63,207,154,.09);border-color:#275446}
 .grp-terrain{background:rgba(130,170,90,.10);border-color:#46532f}
 .grp-skin{background:rgba(123,92,255,.12);border-color:#473774}
 .grp-fringe{background:rgba(200,251,80,.08);border-color:#56652e}
 #bar.noterr .termode{display:none}
 .grp>.glabel{cursor:pointer;user-select:none;display:inline-flex;align-items:center;padding:2px 2px 2px 0}
 .grp>.glabel::after{content:'\25BE';margin-left:4px;font-size:8px;opacity:.85}
 .grp.collapsed>.glabel::after{content:'\25B8'}
 .grp.collapsed>*:not(.glabel){display:none!important}
 #pal{transition:width .14s ease}
 #pal.collapsed{width:0;min-width:0;border-right:none;overflow:hidden}
 #palTog{position:absolute;left:0;top:10px;z-index:40;width:24px;height:46px;border:1px solid var(--line);border-left:none;border-radius:0 9px 9px 0;background:var(--panel);color:var(--ink);cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
 @media (pointer: coarse) and (min-width: 700px){ .grp>.glabel{font-size:12px;padding:6px 4px 6px 0} #palTog{width:30px;height:58px;font-size:18px} }
 .texMbtn{flex:1;background:#0f0c1a;border:1px solid #2c2740;color:#cfc9e6;border-radius:8px;padding:9px;font-size:13px;cursor:pointer}
 .texMbtn.sel{background:#c8fb50;color:#13160a;border-color:#c8fb50;font-weight:600}
 .texCbtn{background:#241f38;border:1px solid #3a3356;color:#cfc9e6;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
 .texGbtn{background:#c8fb50;border:none;color:#13160a;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
 .btn.on{background:var(--lime);color:#15121f;border-color:var(--lime);font-weight:700}
 .btn.go{background:var(--lime);color:#10210a;border-color:var(--lime);font-weight:700}
 .btn.warn{border-color:#e23b3b;color:#ff9a9a}
 #cvWrap{flex:1;position:relative;overflow:hidden}
 canvas{display:block;background:#06040e;touch-action:none}
 #hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:#9b8cffaa;pointer-events:none}
 #ghost{position:fixed;pointer-events:none;z-index:50;font-size:11px;color:#10210a;background:#c8fb50dd;border-radius:6px;padding:3px 7px;display:none;transform:translate(-50%,-130%);white-space:nowrap;font-weight:700}
 #sel{position:absolute;right:10px;top:10px;width:210px;max-height:calc(100dvh - 20px);overflow-y:auto;overscroll-behavior:contain;background:#15112af2;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;display:none}
 #sel .cg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
 #sel .cg .row{margin:0;gap:4px}
 #sel .cg input{flex:1;width:auto;min-width:0}
 #sel h4{margin:0 0 6px;color:var(--lime);font-size:13px}
 #sel .row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:6px}
 #sel input{width:74px;background:#0e0b1d;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px;font-size:13px}
 #sel .del{width:100%;margin-top:8px;background:#3a1620;border:1px solid #e23b3b;color:#ff9a9a;border-radius:6px;padding:8px;cursor:pointer}
 #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#15112af2;border:1px solid #7b5cff;border-radius:8px;padding:9px 16px;font-size:13px;display:none}
 #zoomb{position:absolute;left:10px;top:10px;display:flex;gap:6px}
 #zoomb button{width:38px;height:38px;border-radius:9px;background:#15112af2;border:1px solid var(--line);color:var(--ink);font-size:18px;cursor:pointer}
 #savesP{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:300px;max-height:74%;overflow:auto;background:#15112af6;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;display:none;z-index:30}
 #newP{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:300px;background:#15112af6;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;display:none;z-index:31}
 #newP h4{margin:0 0 10px;color:var(--lime);font-size:15px}
 #newP .nrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
 #newP .nrow span{color:var(--mut);font-size:12px}
 #newP .nrow input,#newP .nrow select{flex:1;max-width:175px;background:#0e0b1d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px}
 #newP .savebtn{width:100%;background:#16301d;border:1px solid #3fbf6a;color:#a8f0c0;border-radius:8px;padding:11px;cursor:pointer;font-size:13px;margin-top:10px}
 #newP .closebtn{width:100%;background:#241d44;border:1px solid var(--line);color:#cdbbe6;border-radius:8px;padding:9px;cursor:pointer;margin-top:6px}
 #savesP h4{margin:0 0 8px;color:var(--lime);font-size:14px}
 #savesP .srow{display:flex;align-items:center;gap:6px;padding:7px;border-radius:7px;background:#1d1838;margin:5px 0}
 #savesP .srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
 #savesP .sb{border:none;border-radius:6px;padding:8px 11px;font-size:12px;cursor:pointer;flex:none}
 #savesP .sb.load{background:#1d2a3a;border:1px solid #5b9cff;color:#bcd9ff}
 #savesP .sb.del{background:#3a1620;border:1px solid #e23b3b;color:#ff9a9a}
 #savesP .savebtn{width:100%;background:#16301d;border:1px solid #3fbf6a;color:#a8f0c0;border-radius:8px;padding:11px;cursor:pointer;font-size:13px;margin-bottom:8px}
 #savesP .closebtn{width:100%;background:#241d44;border:1px solid var(--line);color:#cdbbe6;border-radius:8px;padding:9px;cursor:pointer;margin-top:6px}
 #benchP{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:300px;max-height:74%;overflow:auto;background:#15112af6;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;display:none;z-index:30}
 #benchP h4{margin:0 0 8px;color:var(--lime);font-size:14px}
 #benchP .srow{display:flex;align-items:center;gap:6px;padding:7px;border-radius:7px;background:#1d1838;margin:5px 0}
 #benchP .srow .nm{flex:1;min-width:0;overflow:hidden;line-height:1.25}
 #benchP .sb{border:none;border-radius:6px;padding:8px 11px;font-size:12px;cursor:pointer;flex:none}
 #benchP .sb.load{background:#1d2a3a;border:1px solid #5b9cff;color:#bcd9ff}
 #benchP .sb.del{background:#3a1620;border:1px solid #e23b3b;color:#ff9a9a}
 #benchP .sb.ren{background:#2a2410;border:1px solid #c8a13a;color:#f0d68a}
 #benchP .savebtn{width:100%;background:#16301d;border:1px solid #3fbf6a;color:#a8f0c0;border-radius:8px;padding:11px;cursor:pointer;font-size:13px;margin-bottom:8px}
 #benchP .closebtn{width:100%;background:#241d44;border:1px solid var(--line);color:#cdbbe6;border-radius:8px;padding:9px;cursor:pointer;margin-top:6px}
 #worldP{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:340px;max-height:80%;overflow:auto;background:#15112af6;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;display:none;z-index:30}
 #worldP h4{margin:0 0 8px;color:var(--lime);font-size:14px}
 #worldP .wz{background:#1a1530;border:1px solid #2c2350;border-radius:9px;padding:8px;margin:7px 0}
 #worldP .wzh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
 #worldP .wzn{color:var(--lime);font-size:13px;font-weight:600}
 #worldP .wzpub{font-size:11px;opacity:.85;display:flex;align-items:center;gap:4px}
 #worldP .wzrow{display:flex;align-items:center;gap:8px;margin:3px 0}
 #worldP .wzact{font-size:11px;opacity:.6;width:44px;flex:none}
 #worldP .actsel{flex:1;min-width:0;background:#120f24;border:1px solid #3a2f5e;color:#dcd2f5;border-radius:6px;padding:6px;font-size:12px}
 #worldP .savebtn{width:100%;background:#16301d;border:1px solid #3fbf6a;color:#a8f0c0;border-radius:8px;padding:11px;cursor:pointer;font-size:13px;margin:8px 0 0}
 #worldP .closebtn{width:100%;background:#241d44;border:1px solid var(--line);color:#cdbbe6;border-radius:8px;padding:9px;cursor:pointer;margin-top:6px}
 /* Larger touch targets on tablets / iPads (coarse pointer + roomy screen) */
 @media (pointer: coarse) and (min-width: 700px){
  #pal{width:272px}
  #pal h3{font-size:12px}
  .cat{font-size:12px}
  .tool{padding:14px 14px;font-size:16px;margin:7px 0;gap:11px;border-radius:10px}
  .tool .sw{width:20px;height:20px}
  .modebtn{padding:14px 14px;font-size:16px;margin:7px 0;gap:11px;border-radius:10px}
  .modebtn .sw{width:20px;height:20px}
  .litem{padding:9px 6px;font-size:15px;gap:5px;border-radius:8px}
  .litem .lc{width:13px;height:13px}
  .litem .lb{font-size:16px;padding:7px 8px;min-width:30px;border-radius:6px}
  .lck{width:22px;height:22px;font-size:13px;border-radius:5px}
  #grpbtn,#addgrpbtn{padding:13px;font-size:15px;border-radius:8px}
  #bar{gap:9px;padding:10px 12px}
  #bar input,#bar select{padding:10px 11px;font-size:15px;border-radius:8px}
  #bar label{font-size:13px}
  .btn{padding:13px 19px;font-size:16px;border-radius:9px}
  #sel{width:280px;padding:14px;font-size:14px;border-radius:12px}
  #sel h4{font-size:17px}
  #sel .row{margin:10px 0;gap:8px}
  #sel input{width:104px;padding:9px;font-size:16px;border-radius:7px}
  #sel button{padding:13px!important;font-size:15px!important;border-radius:8px!important}
  #zoomb button{width:54px;height:54px;font-size:25px;border-radius:12px}
  #hint{font-size:14px}
  #ghost{font-size:14px;padding:5px 10px}
  #savesP{width:340px;font-size:14px}
  #newP{width:360px;font-size:14px}
  #newP .nrow input,#newP .nrow select{padding:11px;font-size:15px;max-width:200px}
  #newP .savebtn,#newP .closebtn{padding:13px;font-size:14px}
  #savesP .sb{padding:11px 14px;font-size:13px}
  #savesP .savebtn,#savesP .closebtn{padding:13px;font-size:14px}
 }
</style>
</head><body>
<div id="wrap">
 <div id="pal"><div id="palList"></div><div id="layers"></div></div>
 <div id="main">
  <div id="bar">
   <span class="grp grp-stage"><span class="glabel">Stage</span><label>name</label><input id="fName" size="9" value="Crypt Depths"><label>act</label><input id="fAct" size="2" value="I"><label>theme</label><select id="fTheme"><option value="crypt">crypt</option><option value="plains">ethereal plains</option><option value="witch">witchwood</option><option value="harbor">drowned harbor</option><option value="spire">bell spire</option><option value="charnel">charnel peak</option><option value="rift">the rift</option><option value="castle">blood moon castle</option><option value="">surface</option></select><label>music</label><select id="fMusic"><option>act1</option><option>act2</option><option>crypt1</option><option>crypt2</option><option>ethereal1</option><option>ethereal2</option><option>title</option></select><label>W</label><input id="fW" size="4" value="3200"><label>H</label><input id="fH" size="4" value="2900"><label>idx</label><input id="fIdx" size="2" value="2"><label title="Gameplay camera zoom — lower = more zoomed out (test via Play)">zoom</label><input id="stageZoom" type="range" min="0.6" max="1.5" step="0.05" value="1" style="width:70px;vertical-align:middle"><button class="btn" id="bNew"><i data-lucide="file-plus-2">✦</i> New</button></span>
   <span class="grp grp-save"><span class="glabel">Save</span><button class="btn" id="bBench" title="Committed stage bench — permanent, every device"><i data-lucide="archive">🗄</i> Bench</button><button class="btn" id="bMap" title="World Map — assign bench stages to zones/acts"><i data-lucide="map">🗺</i> Map</button><select class="btn" id="bLoad" title="Load an existing level to edit"><option value="">Load level…</option><option value="stage1.js|0">Cemetery · Act I</option><option value="stage2.js|1">Cemetery · Act II</option><option value="crypt1.js|2">Crypt Depths · Act I</option><option value="crypt2.js|3">Crypt Depths · Act II</option></select><button class="btn" id="bExport" title="Export a full backup — this stage + all custom assets + every bench stage"><i data-lucide="download">⭳</i> Backup</button><button class="btn" id="bImport" title="Import a level file"><i data-lucide="file-up">⭱</i> Import</button></span>
   <span class="grp grp-edit"><span class="glabel">Edit</span><button class="btn" id="bUndo" title="Undo (Ctrl+Z)"><i data-lucide="undo-2">↶</i></button><button class="btn" id="bRedo" title="Redo (Ctrl+Y)"><i data-lucide="redo-2">↷</i></button><button class="btn" id="bRuler" title="Measure / jump-reach ruler"><i data-lucide="ruler">📏</i></button><button class="btn" id="bSnap" title="Magnetic edge snapping"><i data-lucide="magnet">🧲</i></button><button class="btn" id="mMarq" title="Marquee select — drag a box to select multiple, then drag to move them together"><i data-lucide="box-select">⬚</i></button><button class="btn" id="mZone" title="Zoom zones — drag to create a camera-zoom band, tap to edit"><i data-lucide="scan-search">🔭</i></button><button class="btn" id="mResize" title="Resize stage — drag the edge &amp; corner handles to grow/shrink; dragging the top or left edge opens new room and shifts your layout"><i data-lucide="scaling">⤢</i></button></span>

  const list=cats.map((c,i)=>(i+1)+'. '+(c.parent?'   \u21b3 ':'')+c.name+(c.id===cur?'  \u2713':'')).join('\n');
  const ans=prompt('Move this asset to which category?\nType the number:\n\n'+list); if(ans===null) return;
  const idx=parseInt(ans,10)-1; if(isNaN(idx)||idx<0||idx>=cats.length){ toast('cancelled'); return; }
  BCONFIG.itemCat=BCONFIG.itemCat||{}; BCONFIG.itemCat[kind]=cats[idx].id; buildPalette(); toast('moved to '+cats[idx].name);
}
function hideBuiltin(k){ const lbl=((typeof STAMPS!=='undefined'&&STAMPS.find(s=>s.k===k))||{}).label||k;
  if(!confirm('Hide built-in asset \u201c'+lbl+'\u201d from your palette?\n\nIt\u2019s a built-in, so this is a stronger action. Existing placements keep working, and hidden built-ins can be restored later.')) return;
  if(!confirm('Are you sure? Hide \u201c'+lbl+'\u201d? (second confirmation)')) return;
  BCONFIG.hidden=BCONFIG.hidden||[]; if(!BCONFIG.hidden.includes(k)) BCONFIG.hidden.push(k); buildPalette();
  commitFiles([{path:'config/builder.json',content:JSON.stringify(BCONFIG,null,1),encoding:'utf8'}],'builder: hide '+lbl).then(r=>{ if(r) toast('hid \u201c'+lbl+'\u201d'); });
}
function moveCat(id,dir){ const cats=catModel(); const c=cats.find(x=>x.id===id); if(!c) return;
  const sibs=cats.filter(x=>(x.parent||null)===(c.parent||null)); const pos=sibs.indexOf(c), np=pos+dir; if(np<0||np>=sibs.length) return;

function delAsset(id){ const a=(BCONFIG.customAssets||[]).find(x=>x.id===id); if(!a) return;

  M={ name, act, music, theme, world:w, h:h,
      goal: theme==='crypt'?Math.round(w*0.85):w-120,
      goalY: theme==='crypt'?Math.max(G+200,h-180):G,
      seg: usePoly?[]:[ground], plats:[], chk:[], souls:[], enemies:[], bats:[], obst:[], hazards:[], tex:[],
      bg: theme==='crypt'?[{t:'cavebg',par:0.2}]:[], fg:[], poly:null, wallSlope:1.3 };
  if(usePoly){ const nodes=[]; for(let i=0;i<6;i++) nodes.push({x:Math.round(i*w/5),y:380,corner:false,wn:'auto',ho:{x:0,y:0},hi:{x:0,y:0},ha:true}); M.poly=[{nodes,closed:false,layer:'main'}]; polyActive=0; polyMode=true; const mp=document.getElementById('mPoly'); if(mp)mp.classList.add('on'); }
  loadFields(); sel=null; showSel(); camx=0; camy=0; zoom=Math.min(CW/Math.min(w,1600), CH/Math.min(h,900)); persist(); draw(); closeNew(); toast('new stage “'+name+'” created'); }
document.getElementById('bNew').onclick=()=>{ const p=document.getElementById('newP'); if(p.style.display==='block')closeNew(); else openNew(); };
// ---- named local saves ----
const escH=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getSaves(){ try{ return JSON.parse(localStorage.getItem('creapz_saves')||'{}'); }catch(e){ return {}; } }
function setSaves(o){ try{ localStorage.setItem('creapz_saves',JSON.stringify(o)); return true; }catch(e){ toast('save failed - storage full'); return false; } }
function saveCurrentAs(){ const def=(M.name||'Level')+(M.act?' '+M.act:''); const name=(prompt('Save current level as:', def)||'').trim(); if(!name)return;
  const o=getSaves(); if(o[name] && !confirm('A save named "'+name+'" exists. Overwrite it?'))return;
  o[name]={data:cleanLevel(), ts:Date.now()}; if(setSaves(o)){ toast('saved "'+name+'"'); renderSaves(); } }
function loadSave(name){ const o=getSaves(); if(!o[name])return; if(!confirm('Load "'+name+'"? This replaces the current editor contents.'))return;
  histPush(); M=Object.assign(blankLevel(),migrateLevel(o[name].data)); M.theme=M.theme||''; loadFields(); sel=null; showSel(); persist(); draw(); toast('loaded "'+name+'"'); closeSaves(); }
function deleteSave(name){ if(!confirm('Delete saved level "'+name+'"? This cannot be undone.'))return; const o=getSaves(); delete o[name]; setSaves(o); renderSaves(); }
function renderSaves(){ const p=document.getElementById('savesP'); const o=getSaves(); const names=Object.keys(o).sort((a,b)=>(o[b].ts||0)-(o[a].ts||0));
  let h='<h4>Local Saves</h4><button class="savebtn" id="svSave">+  Save current level…</button>';
  if(!names.length) h+='<div style="opacity:.6;padding:8px 4px;line-height:1.4">No saved levels yet. Save your current work here so it survives loading other levels or closing the tab.</div>';
  names.forEach(n=>{ const d=new Date(o[n].ts||0), ds=isNaN(d.getTime())?'':d.toLocaleString();
    h+='<div class="srow"><span class="nm" title="'+escH(n)+'">'+escH(n)+'<br><span style="font-size:10px;opacity:.5">'+ds+'</span></span>'
      +'<button class="sb load" data-l="'+encodeURIComponent(n)+'">Load</button>'
      +'<button class="sb del" data-d="'+encodeURIComponent(n)+'">✕</button></div>'; });
  h+='<button class="closebtn" id="svClose">Close</button>';
  p.innerHTML=h;
  p.querySelector('#svSave').onclick=saveCurrentAs;
  p.querySelector('#svClose').onclick=closeSaves;
  p.querySelectorAll('.sb.load').forEach(b=>b.onclick=()=>loadSave(decodeURIComponent(b.dataset.l)));
  p.querySelectorAll('.sb.del').forEach(b=>b.onclick=()=>deleteSave(decodeURIComponent(b.dataset.d)));
}
function openSaves(){ document.getElementById('savesP').style.display='block'; renderSaves(); }
function closeSaves(){ document.getElementById('savesP').style.display='none'; }

// ---- Bench: committed, permanent, re-editable stages ----
function benchEl(){ return document.getElementById('benchP'); }
async function saveToBench(){
  const def=(M.name||'Stage')+(M.act?' '+M.act:'');
  const name=(prompt('Save this stage to the Bench (permanent, every device):', def)||'').trim(); if(!name)return;
  const id = M.__benchId || ('st'+Date.now().toString(36));
  const data=cleanLevel();
  BCONFIG.bench=BCONFIG.bench||[];
  let entry=BCONFIG.bench.find(b=>b.id===id);
  if(!entry){ entry={id}; BCONFIG.bench.push(entry); }
  entry.name=name; entry.theme=M.theme||''; entry.act=M.act||''; entry.ts=Date.now();
  M.__benchId=id; persist();
  const res=await commitFiles([
    {path:'config/bench/'+id+'.json', content:JSON.stringify(data), encoding:'utf8'},
    {path:'config/builder.json', content:JSON.stringify(BCONFIG,null,1), encoding:'utf8'}
  ], 'bench: save '+name);
  if(res){ toast('on the bench ✓ "'+name+'"'); renderBench(); }
}
async function loadFromBench(id){
  if(!confirm('Load this bench stage into the editor? Replaces current contents.'))return;
  try{
    const r=await fetch('./config/bench/'+id+'.json?cb='+Date.now());
    if(!r.ok){ toast('stage file not found'); return; }
    const data=await r.json();
    histPush(); M=Object.assign(blankLevel(),migrateLevel(data)); M.theme=M.theme||''; M.__benchId=id;
    loadFields(); sel=null; showSel(); persist(); draw(); toast('loaded from bench'); closeBench();
  }catch(e){ toast('load failed: '+e.message); }
}
async function removeFromBench(id){
  if(!confirm('Remove this stage from the Bench list? (the saved file stays in the repo; this just unlists it)'))return;
  BCONFIG.bench=(BCONFIG.bench||[]).filter(b=>b.id!==id);
  const res=await commitFiles([{path:'config/builder.json',content:JSON.stringify(BCONFIG,null,1),encoding:'utf8'}],'bench: remove stage');
  if(res){ toast('removed from bench'); renderBench(); }
}
async function renameBench(id){
  const entry=(BCONFIG.bench||[]).find(b=>b.id===id); if(!entry)return;
  const nn=(prompt('Rename bench stage:', entry.name||entry.id)||'').trim(); if(!nn)return;
  const na=(prompt('Act label (e.g. I, II, III \u2014 blank for none):', entry.act||'')||'').trim();
  if(nn===(entry.name||'') && na===(entry.act||'')) return;
  entry.name=nn; entry.act=na;
  const res=await commitFiles([{path:'config/builder.json',content:JSON.stringify(BCONFIG,null,1),encoding:'utf8'}],'bench: rename '+nn);
  if(res){ toast('renamed \u2713 "'+nn+'"'); renderBench(); }
}
function renderBench(){
  const p=benchEl(); const list=(BCONFIG.bench||[]).slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  let h='<h4>Bench — committed stages</h4><button class="savebtn" id="bnSave">+  Save current stage to Bench…</button>';
  if(!list.length) h+='<div style="opacity:.6;padding:8px 4px;line-height:1.4">No bench stages yet. Save a finished stage here to keep it permanently on every device, ready to assign on the World Map. Bench stays editable — load, tweak, re-save.</div>';
  list.forEach(b=>{ const ds=b.ts?new Date(b.ts).toLocaleDateString():'';
    h+='<div class="srow"><span class="nm">'+escH(b.name||b.id)+'<br><span style="font-size:10px;opacity:.5">'+escH(b.theme||'')+(b.act?' · Act '+escH(b.act):'')+(ds?' · '+ds:'')+'</span></span>'
      +'<button class="sb load" data-l="'+b.id+'">Load</button>'
      +'<button class="sb ren" data-r="'+b.id+'">✎</button>'
      +'<button class="sb del" data-d="'+b.id+'">✕</button></div>'; });
  h+='<button class="closebtn" id="bnClose">Close</button>';
  p.innerHTML=h;
  p.querySelector('#bnSave').onclick=saveToBench;
  p.querySelector('#bnClose').onclick=closeBench;
  p.querySelectorAll('.sb.load').forEach(x=>x.onclick=()=>loadFromBench(x.dataset.l));
  p.querySelectorAll('.sb.ren').forEach(x=>x.onclick=()=>renameBench(x.dataset.r));
  p.querySelectorAll('.sb.del').forEach(x=>x.onclick=()=>removeFromBench(x.dataset.d));
}
function openBench(){ if(document.getElementById('savesP').style.display==='block')closeSaves(); benchEl().style.display='block'; renderBench(); }
function closeBench(){ benchEl().style.display='none'; }
document.getElementById('bBench').onclick=()=>{ const p=benchEl(); if(p.style.display==='block')closeBench(); else openBench(); };

// ---- World Map: assign bench stages to zone/act slots ----
const WZONES=[['cem','cReapY Cemetery'],['witch','Witchwood'],['crypt','Crypt Depths'],['harbor','Drowned Harbor'],['spire','Bell Spire'],['plains','Ethereal Plains'],['charnel','Charnel Peak'],['rift','The Rift'],['castle','Blood Moon Castle']];
function renderWorldMap(){
  const p=document.getElementById('worldP');
  BCONFIG.worldMap=BCONFIG.worldMap||{};
  const bench=(BCONFIG.bench||[]);
  const opts=(selId)=>'<option value="">— empty —</option>'+bench.map(b=>'<option value="'+b.id+'"'+(b.id===selId?' selected':'')+'>'+escH(b.name||b.id)+'</option>').join('');
  let h='<h4>World Map — assign bench stages</h4>';
  if(!bench.length) h+='<div style="opacity:.65;padding:6px 2px;line-height:1.45;margin-bottom:6px">Save stages to the 🗄 Bench first, then pick which act slot each one fills here. "public" makes a zone playable to everyone; leave it off to keep a zone dev-only.</div>';
  WZONES.forEach(([zid,zname])=>{
    let wm=BCONFIG.worldMap[zid]; if(!wm){ wm=BCONFIG.worldMap[zid]={public:(zid==='cem'),acts:[null,null,null]}; }
    if(!Array.isArray(wm.acts)) wm.acts=[null,null,null];
    h+='<div class="wz"><div class="wzh"><span class="wzn">'+escH(zname)+'</span>'
      +'<label class="wzpub"><input type="checkbox" class="pubck" data-z="'+zid+'"'+(wm.public?' checked':'')+'> public</label></div>';
    ['I','II','III'].forEach((rn,i)=>{
      h+='<div class="wzrow"><span class="wzact">Act '+rn+'</span><select class="actsel" data-z="'+zid+'" data-i="'+i+'">'+opts(wm.acts[i])+'</select></div>';
    });
    h+='</div>';
  });
  h+='<button class="savebtn" id="wmSave">Save World Map (commit)</button><button class="closebtn" id="wmClose">Close</button>';
  p.innerHTML=h;
  p.querySelectorAll('.actsel').forEach(s=>s.onchange=()=>{ BCONFIG.worldMap[s.dataset.z].acts[+s.dataset.i]=s.value||null; });
  p.querySelectorAll('.pubck').forEach(c=>c.onchange=()=>{ BCONFIG.worldMap[c.dataset.z].public=c.checked; });
  p.querySelector('#wmSave').onclick=async()=>{ const r=await commitFiles([{path:'config/builder.json',content:JSON.stringify(BCONFIG,null,1),encoding:'utf8'}],'worldmap: update stage assignments'); if(r){ toast('world map saved ✓'); } };
  p.querySelector('#wmClose').onclick=closeWorld;
}
function openWorld(){ closeSaves(); closeBench(); document.getElementById('worldP').style.display='block'; renderWorldMap(); }
function closeWorld(){ document.getElementById('worldP').style.display='none'; }
document.getElementById('bMap').onclick=()=>{ const p=document.getElementById('worldP'); if(p.style.display==='block')closeWorld(); else openWorld(); };

document.getElementById('bPlay').onclick=()=>{ try{ localStorage.setItem('creapz_testlevel',JSON.stringify(cleanLevel())); }catch(e){} location.href='./?test=1'; };

// ---- boot ----
try{ const d=localStorage.getItem('creapz_editdraft'); if(d){ M=Object.assign(blankLevel(),migrateLevel(JSON.parse(d))); } }catch(e){}
loadFields(); fit(); updHist();
</script>
