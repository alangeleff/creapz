<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>cReapZ — World Builder</title>
<style>
 :root{--bg:#0c0a16;--panel:#15112a;--ink:#e8e6f5;--mut:#9b8cff;--lime:#c8fb50;--line:#2a2150;}
 *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
 #wrap{display:flex;height:100%}
 #pal{width:194px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
 #palList{flex:1 1 56%;overflow-y:auto;padding:8px;border-bottom:2px solid var(--line)}
 #layers{flex:1 1 44%;overflow-y:auto;padding:8px}
 #pal h3{font-size:10px;letter-spacing:.5px;color:var(--mut);margin:12px 6px 6px;text-transform:uppercase}
 .cat{font-size:10px;letter-spacing:.5px;color:var(--lime);margin:10px 4px 4px;text-transform:uppercase;font-weight:700}
 .litem{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:6px;font-size:12px;cursor:pointer;margin:1px 0}
 .litem:hover{background:#1d1838}
 .litem.sel{background:#242a16;outline:1px solid var(--lime)}
 .litem .lc{width:11px;height:11px;border-radius:2px;flex:none}
 .litem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .litem .lb{background:#241d44;border:none;color:#cdbbe6;border-radius:4px;font-size:12px;line-height:1;padding:3px 5px;cursor:pointer}
 .litem .lb:hover{background:#352a5c}
 .litem.lock{opacity:.5}
 .tool{display:flex;align-items:center;gap:8px;padding:9px 10px;margin:4px 0;border-radius:8px;background:#1d1838;border:1px solid transparent;cursor:grab;font-size:13px;touch-action:none}
 .tool:active{cursor:grabbing}
 .tool.on{border-color:var(--lime);background:#242a16}
 .tool .sw{width:15px;height:15px;border-radius:3px;flex:none}
 .modebtn{display:flex;align-items:center;gap:8px;padding:9px 10px;margin:4px 0;border-radius:8px;background:#1d1838;border:1px solid transparent;cursor:pointer;font-size:13px}
 .modebtn.on{border-color:var(--lime);background:#242a16}
 #main{flex:1;display:flex;flex-direction:column;min-width:0}
 #bar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
 #bar input,#bar select{background:#0e0b1d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:12px}
 #bar label{font-size:11px;color:var(--mut)}
 .btn{background:#2a2150;color:var(--ink);border:1px solid #7b5cff;border-radius:7px;padding:8px 12px;font-size:13px;cursor:pointer}
 .btn.go{background:var(--lime);color:#10210a;border-color:var(--lime);font-weight:700}
 .btn.warn{border-color:#e23b3b;color:#ff9a9a}
 #cvWrap{flex:1;position:relative;overflow:hidden}
 canvas{display:block;background:#06040e;touch-action:none}
 #hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:#9b8cffaa;pointer-events:none}
 #ghost{position:fixed;pointer-events:none;z-index:50;font-size:11px;color:#10210a;background:#c8fb50dd;border-radius:6px;padding:3px 7px;display:none;transform:translate(-50%,-130%);white-space:nowrap;font-weight:700}
 #sel{position:absolute;right:10px;top:10px;width:210px;background:#15112af2;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;display:none}
 #sel h4{margin:0 0 6px;color:var(--lime);font-size:13px}
 #sel .row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:6px}
 #sel input{width:74px;background:#0e0b1d;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px;font-size:13px}
 #sel .del{width:100%;margin-top:8px;background:#3a1620;border:1px solid #e23b3b;color:#ff9a9a;border-radius:6px;padding:8px;cursor:pointer}
 #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#15112af2;border:1px solid #7b5cff;border-radius:8px;padding:9px 16px;font-size:13px;display:none}
 #zoomb{position:absolute;left:10px;top:10px;display:flex;gap:6px}
 #zoomb button{width:38px;height:38px;border-radius:9px;background:#15112af2;border:1px solid var(--line);color:var(--ink);font-size:18px;cursor:pointer}
</style>
</head><body>
<div id="wrap">
 <div id="pal"><div id="palList"></div><div id="layers"></div></div>
 <div id="main">
  <div id="bar">
   <label>name</label><input id="fName" size="11" value="Crypt Depths">
   <label>act</label><input id="fAct" size="2" value="I">
   <label>theme</label><select id="fTheme"><option value="crypt">crypt</option><option value="">surface</option></select>
   <label>music</label><select id="fMusic"><option>act1</option><option selected>act2</option><option>title</option></select>
   <label>W</label><input id="fW" size="5" value="3200">
   <label>H</label><input id="fH" size="5" value="2900">
   <label>idx</label><input id="fIdx" size="2" value="2">
   <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">↶</button>
   <button class="btn" id="bRedo" title="Redo (Ctrl+Y)">↷</button>
   <button class="btn go" id="bPlay">▶ Play</button>
   <button class="btn" id="bExport">⭳ Export</button>
   <button class="btn" id="bImport">⭱ Import</button>
   <button class="btn" id="bLoadCrypt">Load Crypt I</button>
   <button class="btn warn" id="bClear">Clear</button>
  </div>
  <div id="cvWrap">
   <canvas id="cv"></canvas>
   <div id="zoomb"><button id="zin">+</button><button id="zout">−</button></div>
   <div id="hint"></div>
   <div id="sel"></div>
   <div id="toast"></div>
  </div>
 </div>
</div>
<div id="ghost"></div>
<script>
const GRID=20, TERRACE_DROP=130, DEF_TERR=600;
const ENEMY_COLS={zombie:'#6b7d52',zgen:'#3ad07a',gob:'#c8a24a',bd:'#9a6cff'};
const HAZ_COLS={spike:'#d9d2c0',rock:'#7a7280',tar:'#2a1f30'};
const HAZ_LABEL={spike:'Bone Spike Pit',rock:'Rock Drop',tar:'Tar Pit'};
const OBST_COLS={grave:'#8a82a6',crate:'#b6884a'};
const CATS=['Ground','Hazards','Enemies','Functions','Objects'];
const STAMPS=[
 {k:'terrace',label:'Terrace ground',sw:'#7a5a36',cat:'Ground'},
 {k:'plat_s',label:'Platform · static',sw:'#caa46a',cat:'Ground'},
 {k:'plat_m',label:'Platform · moving',sw:'#6ad0ff',cat:'Ground'},
 {k:'plat_c',label:'Platform · crumble',sw:'#e0843c',cat:'Ground'},
 {k:'haz_spike',label:'Bone Spike Pit',sw:'#d9d2c0',cat:'Hazards'},
 {k:'haz_rock',label:'Rock Drop',sw:'#7a7280',cat:'Hazards'},
 {k:'haz_tar',label:'Tar Pit',sw:'#2a1f30',cat:'Hazards'},
 {k:'zombie',label:'Zombie',sw:ENEMY_COLS.zombie,cat:'Enemies'},
 {k:'zgen',label:'Zombie General',sw:ENEMY_COLS.zgen,cat:'Enemies'},
 {k:'gob',label:'Goblin',sw:ENEMY_COLS.gob,cat:'Enemies'},
 {k:'bd',label:'Brain Dead',sw:ENEMY_COLS.bd,cat:'Enemies'},
 {k:'bat',label:'Bat (flyer)',sw:'#b07a5a',cat:'Enemies'},
 {k:'chk',label:'Checkpoint',sw:'#ff9a3c',cat:'Functions'},
 {k:'goal',label:'Goal (exit)',sw:'#e0506a',cat:'Functions'},
 {k:'soul',label:'Soul',sw:'#7fe0ff',cat:'Functions'},
 {k:'grave',label:'Gravestone',sw:OBST_COLS.grave,cat:'Objects'},
 {k:'crate',label:'Crate',sw:OBST_COLS.crate,cat:'Objects'},
];
const LABELOF={}; STAMPS.forEach(s=>LABELOF[s.k]=s.label);
let eraseMode=false;
let M=blankLevel();
function blankLevel(){ return {name:'Crypt Depths',act:'I',music:'act2',theme:'crypt',world:3200,h:2900,
  goal:3000,goalY:2480, seg:[], plats:[], chk:[], souls:[], enemies:[], bats:[], obst:[], hazards:[]}; }

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let camx=-40,camy=-40,zoom=0.42, CW=0,CH=0;
function fit(){ const r=document.getElementById('cvWrap').getBoundingClientRect(); CW=r.width; CH=r.height; cv.width=CW; cv.height=CH; draw(); }
addEventListener('resize',fit);
function sx(x){return (x-camx)*zoom;} function sy(y){return (y-camy)*zoom;}
function wx(px){return px/zoom+camx;} function wy(py){return py/zoom+camy;}
function snap(v){return Math.round(v/GRID)*GRID;}
function cvxy(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }

// ---- palette (drag sources) ----
const pal=document.getElementById('palList');
let palHtml='<h3>Drag a piece onto the map</h3>';
for(const cat of CATS){ palHtml+='<div class="cat">'+cat+'</div>';
  for(const t of STAMPS.filter(s=>s.cat===cat)) palHtml+=`<div class="tool" data-k="${t.k}"><span class="sw" style="background:${t.sw}"></span>${t.label}</div>`;
}
palHtml+='<h3>Modes</h3><div class="modebtn" id="mErase"><span class="sw" style="background:#e23b3b"></span>Eraser (tap to delete)</div>';
pal.innerHTML=palHtml;
document.getElementById('mErase').onclick=function(){ eraseMode=!eraseMode; this.classList.toggle('on',eraseMode); sel=null; showSel(); };

// ---- selection / edit panel ----
let sel=null;
const selBox=document.getElementById('sel');
const SEL_FIELDS={terrace:['x0','x1','gy','depth'],plat:['x','x0','y','w','range','spd'],chk:['x','gy'],goal:['x','gy'],soul:['x','y'],enemy:['x','min','max','gy'],bat:['x','min','max','y'],haz:['x','y','w','d'],obst:['x','gy']};
function showSel(){
 if(!sel){ selBox.style.display='none'; return; }
 selBox.style.display='block';
 const o=sel.obj; let html='<h4>'+(LABELOF[sel.kind]||sel.type)+'</h4>';
 for(const f of (SEL_FIELDS[sel.type]||[])){ if(o[f]===undefined)continue; html+=`<div class="row"><span>${f}</span><input data-f="${f}" inputmode="numeric" value="${o[f]}"></div>`; }
 html+='<button class="del">Delete</button>';
 selBox.innerHTML=html;
 selBox.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{ const v=parseFloat(inp.value); if(!isNaN(v)){ histPush(); o[inp.dataset.f]=v; syncBack(sel); persist(); draw(); } });
 selBox.querySelector('.del').onclick=()=>{ histPush(); delObj(sel); sel=null; showSel(); persist(); draw(); };
}
function syncBack(s){ if(s.sync) s.sync(); }
function delObj(s){
 const A={terrace:M.seg,chk:M.chk,soul:M.souls,enemy:M.enemies,bat:M.bats}[s.type];
 if(A&&s.raw){ const i=A.indexOf(s.raw); if(i>=0)A.splice(i,1); }
 else if(s.type==='plat'){ const i=M.plats.indexOf(s.obj); if(i>=0)M.plats.splice(i,1); }
 else if(s.type==='haz'){ const i=M.hazards.indexOf(s.raw); if(i>=0)M.hazards.splice(i,1); }
 else if(s.type==='obst'){ const i=M.obst.indexOf(s.raw); if(i>=0)M.obst.splice(i,1); }
 else if(s.type==='goal'){ M.goal=0; M.goalY=0; }
}

// ---- hit test ----
function hit(wxp,wyp){
 if(M.goal&&!locked.has('goal')&&Math.hypot(wxp-M.goal,wyp-(M.goalY-30))<44) return selGoal();
 for(const c of M.chk){ if(!locked.has(c)&&Math.hypot(wxp-c[0],wyp-(c[1]-30))<36) return wrap('chk',c,['x','gy'],[0,1]); }
 for(const o of (M.obst||[])){ if(!locked.has(o)&&Math.abs(wxp-o.x)<26&&wyp<(o.gy||0)+6&&wyp>(o.gy||0)-56) return {type:'obst',kind:o.type,obj:o,raw:o,sync(){}}; }
 for(const s of M.souls){ if(!locked.has(s)&&Math.hypot(wxp-s[0],wyp-s[1])<24) return wrap('soul',s,['x','y'],[0,1]); }
 for(const b of M.bats){ if(!locked.has(b)&&Math.hypot(wxp-b[0],wyp-b[3])<28) return wrap('bat',b,['x','min','max','y'],[0,1,2,3]); }
 for(const e of M.enemies){ const ey=(e[4]??M.goalY); if(!locked.has(e)&&Math.abs(wxp-e[0])<32&&wyp<ey+8&&wyp>ey-50) return wrap('enemy',e,['x','min','max','gy'],[0,1,2,4],e[3]); }
 for(const h of (M.hazards||[])){ const top=h.t==='rock'?h.y-16:h.y-24; if(!locked.has(h)&&wxp>=h.x-6&&wxp<=h.x+h.w+6&&wyp>=top&&wyp<=h.y+14) return {type:'haz',kind:'haz_'+h.t,obj:h,raw:h,sync(){}}; }
 for(const p of M.plats){ const x=p.x??p.x0; if(!locked.has(p)&&wxp>=x-8&&wxp<=x+p.w+8&&Math.abs(wyp-p.y)<24) return {type:'plat',kind:'plat_'+p.t,obj:p,raw:p,sync(){}}; }
 for(const s of M.seg){ if(!locked.has(s)&&wxp>=s[0]&&wxp<=s[1]&&wyp>=s[2]-4&&wyp<=s[2]+TERRACE_DROP) return wrap('terrace',s,['x0','x1','gy','depth'],[0,1,2,3]); }
 return null;
}
function selGoal(){ return {type:'goal',kind:'goal',obj:{x:M.goal,gy:M.goalY},raw:'goal',sync(){M.goal=this.obj.x;M.goalY=this.obj.gy;}}; }
function wrap(type,raw,names,idx,kind){ const o={}; names.forEach((n,i)=>o[n]=raw[idx[i]]);
 return {type,kind:kind||type,obj:o,raw,sync(){names.forEach((n,i)=>{ if(o[n]!==undefined) raw[idx[i]]=o[n]; });}}; }

// ---- handles for selected terrace/platform (resize) ----
function handles(s){
 if(!s) return [];
 if(s.type==='terrace'){ const dep=s.obj.depth||TERRACE_DROP; return [{id:'x0',x:s.obj.x0,y:s.obj.gy},{id:'x1',x:s.obj.x1,y:s.obj.gy},{id:'depth',x:(s.obj.x0+s.obj.x1)/2,y:s.obj.gy+dep}]; }
 if(s.type==='plat'){ const x=s.obj.x??s.obj.x0; return [{id:'w',x:x+s.obj.w,y:s.obj.y}]; }
 if(s.type==='haz'){ const hd=[{id:'hx',x:s.obj.x,y:s.obj.y},{id:'hw',x:s.obj.x+s.obj.w,y:s.obj.y}]; if(s.obj.t==='tar') hd.push({id:'td',x:s.obj.x+s.obj.w/2,y:s.obj.y+(s.obj.d||22)}); return hd; }
 if(s.type==='enemy'||s.type==='bat'){ const yy=s.type==='bat'?s.obj.y:s.obj.gy; return [{id:'min',x:s.obj.min,y:yy},{id:'max',x:s.obj.max,y:yy}]; }
 return [];
}
function hitHandle(wxp,wyp){ for(const h of handles(sel)){ if(Math.hypot(wxp-h.x,wyp-h.y)<16/zoom) return h; } return null; }

// ---- pointer model: pan / pinch / move / select / handle-drag ----
const ptrs=new Map();
let act=null; // {mode:'pan'|'move'|'handle', ...}
let pinch=null;
let carry=null; // {kind} from palette drag

// palette drag start
pal.querySelectorAll('.tool').forEach(el=>{
 el.addEventListener('pointerdown',e=>{ e.preventDefault(); carry={kind:el.dataset.k}; el.setPointerCapture(e.pointerId);
   showGhost(e.clientX,e.clientY); });
});
const ghost=document.getElementById('ghost');
function showGhost(cx,cy){ if(!carry)return; ghost.style.display='block'; ghost.textContent=LABELOF[carry.kind]; ghost.style.left=cx+'px'; ghost.style.top=cy+'px'; }
addEventListener('pointermove',e=>{ if(carry){ showGhost(e.clientX,e.clientY); } });
addEventListener('pointerup',e=>{ if(carry){ ghost.style.display='none';
   const r=cv.getBoundingClientRect();
   if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){ placeAt(carry.kind, snap(wx(e.clientX-r.left)), snap(wy(e.clientY-r.top))); }
   carry=null; } });

function placeAt(kind,gx,gy){
 histPush();
 if(kind==='terrace'){ const s=[gx,gx+DEF_TERR,gy]; M.seg.push(s); M.seg.sort((a,b)=>a[2]-b[2]); sel=wrap('terrace',s,['x0','x1','gy','depth'],[0,1,2,3]); }
 else if(kind.startsWith('plat_')){ const t=kind.split('_')[1]; const p={x:gx,y:gy,w:120,t}; if(t==='m'){p.x0=gx;p.range=180;p.spd=0.3;} M.plats.push(p); sel={type:'plat',kind,obj:p,raw:p,sync(){}}; }
 else if(kind==='chk'){ const c=[gx,gy]; M.chk.push(c); sel=wrap('chk',c,['x','gy'],[0,1]); }
 else if(kind==='goal'){ M.goal=gx; M.goalY=gy; sel=null; }
 else if(kind==='soul'){ M.souls.push([gx,gy]); sel=null; }
 else if(kind==='bat'){ const b=[gx,Math.max(0,gx-300),gx+300,gy]; M.bats.push(b); sel=wrap('bat',b,['x','min','max','y'],[0,1,2,3]); }
 else if(kind.startsWith('haz_')){ const t=kind.split('_')[1]; const h={t,x:gx,y:gy,w:240}; (M.hazards=M.hazards||[]).push(h); sel={type:'haz',kind,obj:h,raw:h,sync(){}}; }
 else if(OBST_COLS[kind]){ const o={x:gx,type:kind,gy}; (M.obst=M.obst||[]).push(o); sel={type:'obst',kind,obj:o,raw:o,sync(){}}; }
 else if(ENEMY_COLS[kind]){ const en=[gx,Math.max(0,gx-300),gx+300,kind,gy]; M.enemies.push(en); sel=wrap('enemy',en,['x','min','max','gy'],[0,1,2,4],kind); }
 showSel(); persist(); draw();
}

cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,cvxy(e));
 if(ptrs.size===2){ const p=[...ptrs.values()]; pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),z:zoom,
   mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2, bx:wx((p[0].x+p[1].x)/2),by:wy((p[0].y+p[1].y)/2)}; act=null; return; }
 const c=cvxy(e), wxp=wx(c.x),wyp=wy(c.y);
 if(eraseMode){ const h=hit(wxp,wyp); if(h){ histPush(); delObj(h); persist(); draw(); } return; }
 const hh=hitHandle(wxp,wyp);
 if(hh){ act={mode:'handle',h:hh,start:JSON.parse(JSON.stringify(sel.obj)),pre:snapM(),moved:false}; return; }
 const h=hit(wxp,wyp);
 if(h){ sel=h; showSel(); act={mode:'move',h,px:c.x,py:c.y,start:JSON.parse(JSON.stringify(h.obj)),pre:snapM(),moved:false}; }
 else { sel=null; showSel(); act={mode:'pan',px:c.x,py:c.y,cx:camx,cy:camy}; }
 draw();
});
cv.addEventListener('pointermove',e=>{
 if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,cvxy(e));
 const c=cvxy(e);
 document.getElementById('hint').textContent='x '+Math.round(wx(c.x))+'  y '+Math.round(wy(c.y));
 if(pinch&&ptrs.size>=2){ const p=[...ptrs.values()]; const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
   zoom=Math.max(0.12,Math.min(1.6,pinch.z*d/pinch.d)); camx=pinch.bx-pinch.mx/zoom; camy=pinch.by-pinch.my/zoom; draw(); return; }
 if(!act) return;
 if(act.mode==='pan'){ camx=act.cx-(c.x-act.px)/zoom; camy=act.cy-(c.y-act.py)/zoom; draw(); return; }
 if(act.mode==='move'){ const dx=snap((c.x-act.px)/zoom), dy=snap((c.y-act.py)/zoom); moveObj(act.h,act.start,dx,dy); act.moved=true; syncBack(act.h); persist(); showSel(); draw(); return; }
 if(act.mode==='handle'){ resizeH(act.h,act.start, snap(wx(c.x)), snap(wy(c.y))); act.moved=true; syncBack(sel); persist(); showSel(); draw(); return; }
});
function endPtr(e){ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
 if(ptrs.size===0){ if(act&&(act.mode==='move'||act.mode==='handle')&&act.moved&&act.pre){ undoStack.push(act.pre); if(undoStack.length>80)undoStack.shift(); redoStack.length=0; updHist(); } act=null; } }
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);

function moveObj(h,start,dx,dy){
 const o=h.obj;
 if(h.type==='terrace'){ o.x0=start.x0+dx; o.x1=start.x1+dx; o.gy=start.gy+dy; }
 else if(h.type==='plat'){ if(start.x0!==undefined)o.x0=start.x0+dx; o.x=(start.x??start.x0)+dx; o.y=start.y+dy; }
 else if(h.type==='goal'){ o.x=start.x+dx; o.gy=start.gy+dy; }
 else if(h.type==='enemy'){ o.x=start.x+dx; o.min=start.min+dx; o.max=start.max+dx; o.gy=start.gy+dy; }
 else if(h.type==='bat'){ o.x=start.x+dx; o.min=start.min+dx; o.max=start.max+dx; o.y=start.y+dy; }
 else if(h.type==='haz'){ o.x=start.x+dx; o.y=start.y+dy; }
 else { o.x=start.x+dx; (o.gy!==undefined)?o.gy=start.gy+dy:o.y=start.y+dy; }
}
function resizeH(h,start,gx,gy){
 const o=sel.obj;
 if(h.id==='x0'){ o.x0=Math.min(gx,o.x1-GRID); }
 else if(h.id==='x1'){ o.x1=Math.max(gx,o.x0+GRID); }
 else if(h.id==='depth'){ o.depth=Math.max(GRID,gy-o.gy); }
 else if(h.id==='td'){ o.d=Math.max(GRID,gy-o.y); }
 else if(h.id==='w'){ const bx=o.x??o.x0; o.w=Math.max(GRID,gx-bx); }
 else if(h.id==='hw'){ o.w=Math.max(GRID,gx-o.x); }
 else if(h.id==='hx'){ const r=o.x+o.w; o.x=Math.min(gx,r-GRID); o.w=r-o.x; }
 else if(h.id==='min'){ o.min=Math.min(gx,o.x); }
 else if(h.id==='max'){ o.max=Math.max(gx,o.x); }
 if(sel.obj.gy!==undefined&&(h.id==='min'||h.id==='max')){} // y unaffected
}
document.getElementById('zin').onclick=()=>{ zoomAt(1.25); }; document.getElementById('zout').onclick=()=>{ zoomAt(0.8); };
function zoomAt(f){ const bx=wx(CW/2),by=wy(CH/2); zoom=Math.max(0.12,Math.min(1.6,zoom*f)); camx=bx-(CW/2)/zoom; camy=by-(CH/2)/zoom; draw(); }
cv.addEventListener('wheel',e=>{ e.preventDefault(); const c=cvxy(e),bx=wx(c.x),by=wy(c.y); zoom=Math.max(0.12,Math.min(1.6,zoom*(e.deltaY<0?1.12:0.89))); camx=bx-c.x/zoom; camy=by-c.y/zoom; draw(); },{passive:false});

// ---- draw ----
function draw(){
 syncFields(); ctx.clearRect(0,0,CW,CH);
 ctx.fillStyle=M.theme==='crypt'?'#0a0712':'#0e1326'; ctx.fillRect(0,0,CW,CH);
 ctx.strokeStyle='#2a2150'; ctx.lineWidth=2; ctx.strokeRect(sx(0),sy(0),M.world*zoom,M.h*zoom);
 ctx.strokeStyle='#ffffff08'; ctx.lineWidth=1; ctx.beginPath(); const g=GRID*5;
 for(let x=0;x<=M.world;x+=g){ ctx.moveTo(sx(x),sy(0)); ctx.lineTo(sx(x),sy(M.h)); }
 for(let y=0;y<=M.h;y+=g){ ctx.moveTo(sx(0),sy(y)); ctx.lineTo(sx(M.world),sy(y)); }
 ctx.stroke();
 for(const s of M.seg){ const dep=(s[3]||TERRACE_DROP); ctx.fillStyle=M.theme==='crypt'?'#241834':'#3a2a1a'; ctx.fillRect(sx(s[0]),sy(s[2]),(s[1]-s[0])*zoom,dep*zoom);
   ctx.fillStyle=M.theme==='crypt'?'#e0a93c':'#5a8a3a'; ctx.fillRect(sx(s[0]),sy(s[2]),(s[1]-s[0])*zoom,4);
   if(sel&&sel.raw===s){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(sx(s[0])-2,sy(s[2])-2,(s[1]-s[0])*zoom+4,dep*zoom+4); } }
 for(const p of M.plats){ const x=p.x??p.x0; ctx.fillStyle=p.t==='m'?'#6ad0ff':p.t==='c'?'#e0843c':'#caa46a';
   ctx.fillRect(sx(x),sy(p.y),p.w*zoom,Math.max(5,10*zoom));
   if(p.t==='m'){ ctx.strokeStyle='#6ad0ff55'; ctx.beginPath(); ctx.moveTo(sx(x),sy(p.y+5)); ctx.lineTo(sx(x+(p.range||0)),sy(p.y+5)); ctx.stroke(); }
   if(sel&&sel.obj===p){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(sx(x)-2,sy(p.y)-2,p.w*zoom+4,Math.max(5,10*zoom)+4); } }
 for(const h of (M.hazards||[])){ const X=sx(h.x),Y=sy(h.y),Wd=h.w*zoom;
   if(h.t==='spike'){ ctx.fillStyle='#d9d2c0'; for(let cx2=h.x;cx2<h.x+h.w-6;cx2+=18){ const px=sx(cx2),hh=18*zoom; ctx.beginPath(); ctx.moveTo(px,Y); ctx.lineTo(px+8*zoom,Y-hh); ctx.lineTo(px+16*zoom,Y); ctx.fill(); } }
   else if(h.t==='tar'){ const td=(h.d||22); ctx.fillStyle='#2a1f30'; ctx.fillRect(X,Y-8*zoom,Wd,(td+8)*zoom); ctx.fillStyle='rgba(150,130,170,.3)'; ctx.fillRect(X,Y-8*zoom,Wd,2); }
   else if(h.t==='rock'){ ctx.fillStyle='#3a3340'; ctx.fillRect(X,Y-12*zoom,Wd,12*zoom);
     ctx.strokeStyle='rgba(122,114,128,.5)'; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X+Wd,Y); ctx.stroke(); ctx.setLineDash([]);
     const n=Math.max(1,Math.round(h.w/160)), step=h.w/n;   // matches engine spawn-point spacing
     for(let i=0;i<n;i++){ const spx=sx(h.x+step*(i+0.5)); ctx.fillStyle='#ff5050'; ctx.beginPath(); ctx.moveTo(spx-5,Y-2); ctx.lineTo(spx+5,Y-2); ctx.lineTo(spx,Y+8*zoom); ctx.fill();
       ctx.fillStyle='#7a7280'; ctx.beginPath(); ctx.arc(spx,Y-6*zoom,3,0,7); ctx.fill(); }
     ctx.fillStyle='rgba(255,120,120,.7)'; ctx.font='9px sans-serif'; ctx.fillText('\u25bc x'+n+' drop', X+2, Y-15*zoom); }
   if(sel&&sel.raw===h){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-2,Y-(h.t==='rock'?14:24)*zoom-2,Wd+4,(h.t==='rock'?16:38)*zoom+4); }
 }
 for(const s of M.souls){ ctx.fillStyle='#7fe0ff'; ctx.beginPath(); ctx.arc(sx(s[0]),sy(s[1]),Math.max(3,6*zoom),0,7); ctx.fill(); }
 for(const e of M.enemies){ const ey=(e[4]??M.goalY); ctx.fillStyle=ENEMY_COLS[e[3]]||'#aaa'; const ww=24*zoom,hh=34*zoom;
   ctx.fillRect(sx(e[0])-ww/2,sy(ey)-hh,ww,hh); ctx.strokeStyle='#ffffff33'; ctx.beginPath(); ctx.moveTo(sx(e[1]),sy(ey)+3); ctx.lineTo(sx(e[2]),sy(ey)+3); ctx.stroke();
   ctx.fillStyle='#000a'; ctx.font='9px sans-serif'; ctx.fillText(e[3],sx(e[0])-ww/2+1,sy(ey)-hh+9); }
 for(const o of (M.obst||[])){ const X=sx(o.x),Y=sy(o.gy||0); ctx.fillStyle=OBST_COLS[o.type]||'#999';
   if(o.type==='crate'){ const ww=40*zoom; ctx.fillRect(X-ww/2,Y-ww,ww,ww); ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=1; ctx.strokeRect(X-ww/2,Y-ww,ww,ww); ctx.beginPath(); ctx.moveTo(X-ww/2,Y-ww); ctx.lineTo(X+ww/2,Y); ctx.moveTo(X+ww/2,Y-ww); ctx.lineTo(X-ww/2,Y); ctx.stroke(); }
   else { const w2=34*zoom,h2=46*zoom; ctx.beginPath(); ctx.moveTo(X-w2/2,Y); ctx.lineTo(X-w2/2,Y-h2+w2/2); ctx.arc(X,Y-h2+w2/2,w2/2,Math.PI,0); ctx.lineTo(X+w2/2,Y); ctx.fill(); }
   if(sel&&sel.raw===o){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2; ctx.strokeRect(X-24*zoom,Y-52*zoom,48*zoom,56*zoom); } }
 for(const b of M.bats){ ctx.fillStyle='#b07a5a'; ctx.beginPath(); ctx.ellipse(sx(b[0]),sy(b[3]),12*zoom,7*zoom,0,0,7); ctx.fill();
   ctx.strokeStyle='#b07a5a55'; ctx.beginPath(); ctx.moveTo(sx(b[1]),sy(b[3])); ctx.lineTo(sx(b[2]),sy(b[3])); ctx.stroke(); }
 for(const c of M.chk){ const X=sx(c[0]),Y=sy(c[1]); ctx.fillStyle='#ff9a3c'; ctx.fillRect(X-2,Y-46*zoom,4,46*zoom);
   ctx.beginPath(); ctx.moveTo(X+2,Y-46*zoom); ctx.lineTo(X+26*zoom,Y-38*zoom); ctx.lineTo(X+2,Y-30*zoom); ctx.fill(); }
 if(M.goal){ const X=sx(M.goal),Y=sy(M.goalY); ctx.strokeStyle='#e0506a'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(X,Y-34*zoom,22*zoom,0,7); ctx.stroke();
   ctx.fillStyle='#e0506a'; ctx.font='11px sans-serif'; ctx.fillText('EXIT',X-12,Y+12); }
 const sp=spawnY(90); if(sp!==null){ const X=sx(90),Y=sy(sp); ctx.fillStyle='#c8fb50'; ctx.beginPath(); ctx.arc(X,Y-30*zoom,Math.max(5,9*zoom),0,7); ctx.fill();
   ctx.fillStyle='#c8fb50'; ctx.font='10px sans-serif'; ctx.fillText('START',X-14,Y-44*zoom); }
 // handles
 for(const h of handles(sel)){ ctx.fillStyle='#c8fb50'; ctx.strokeStyle='#10210a'; ctx.lineWidth=2;
   ctx.beginPath(); ctx.arc(sx(h.x),sy(h.y),7,0,7); ctx.fill(); ctx.stroke(); }
 if(typeof buildLayers==='function') buildLayers();
}
function spawnY(x){ let best=null; for(const s of M.seg){ if(x>=s[0]&&x<=s[1]){ if(best===null||s[2]<best)best=s[2]; } } return best; }

// ---- fields ----
function syncFields(){ M.name=v('fName'); M.act=v('fAct'); M.theme=v('fTheme'); M.music=v('fMusic'); M.world=+v('fW')||M.world; M.h=+v('fH')||M.h; }
function v(id){return document.getElementById(id).value;}
function loadFields(){ document.getElementById('fName').value=M.name; document.getElementById('fAct').value=M.act;
 document.getElementById('fTheme').value=M.theme||''; document.getElementById('fMusic').value=M.music; document.getElementById('fW').value=M.world; document.getElementById('fH').value=M.h; }
['fName','fAct','fTheme','fMusic','fW','fH'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{syncFields();persist();draw();}));

// ---- layers panel: select / reorder / lock any placed piece ----
const locked=new Set();
function itemList(){
 const out=[];
 M.seg.forEach((sg,i)=>out.push({cat:'Ground',label:'Terrace',color:'#7a5a36',raw:sg,arr:M.seg,idx:i,mk:()=>wrap('terrace',sg,['x0','x1','gy','depth'],[0,1,2,3]),cx:(sg[0]+sg[1])/2,cy:sg[2]}));
 M.plats.forEach((p,i)=>out.push({cat:'Ground',label:'Platform '+p.t,color:p.t==='m'?'#6ad0ff':p.t==='c'?'#e0843c':'#caa46a',raw:p,arr:M.plats,idx:i,mk:()=>({type:'plat',kind:'plat_'+p.t,obj:p,raw:p,sync(){}}),cx:(p.x??p.x0)+p.w/2,cy:p.y}));
 (M.hazards||[]).forEach((h,i)=>out.push({cat:'Hazards',label:HAZ_LABEL[h.t]||h.t,color:HAZ_COLS[h.t],raw:h,arr:M.hazards,idx:i,mk:()=>({type:'haz',kind:'haz_'+h.t,obj:h,raw:h,sync(){}}),cx:h.x+h.w/2,cy:h.y}));
 M.enemies.forEach((e,i)=>out.push({cat:'Enemies',label:(LABELOF[e[3]]||e[3]),color:ENEMY_COLS[e[3]]||'#aaa',raw:e,arr:M.enemies,idx:i,mk:()=>wrap('enemy',e,['x','min','max','gy'],[0,1,2,4],e[3]),cx:e[0],cy:e[4]??M.goalY}));
 M.bats.forEach((b,i)=>out.push({cat:'Enemies',label:'Bat',color:'#b07a5a',raw:b,arr:M.bats,idx:i,mk:()=>wrap('bat',b,['x','min','max','y'],[0,1,2,3]),cx:b[0],cy:b[3]}));
 M.chk.forEach((c,i)=>out.push({cat:'Functions',label:'Checkpoint',color:'#ff9a3c',raw:c,arr:M.chk,idx:i,mk:()=>wrap('chk',c,['x','gy'],[0,1]),cx:c[0],cy:c[1]}));
 if(M.goal) out.push({cat:'Functions',label:'Goal (exit)',color:'#e0506a',raw:'goal',arr:null,idx:-1,mk:()=>selGoal(),cx:M.goal,cy:M.goalY});
 (M.obst||[]).forEach((o,i)=>out.push({cat:'Objects',label:o.type==='grave'?'Gravestone':'Crate',color:OBST_COLS[o.type]||'#999',raw:o,arr:M.obst,idx:i,mk:()=>({type:'obst',kind:o.type,obj:o,raw:o,sync(){}}),cx:o.x,cy:o.gy||0}));
 return out;
}
function buildLayers(){
 const host=document.getElementById('layers'); if(!host) return;
 const items=itemList(); let html='<h3>Layers — tap to select</h3>';
 const soulN=M.souls.length;
 for(const cat of CATS){
   const list=items.filter(it=>it.cat===cat); if(!list.length && !(cat==='Functions'&&soulN)) continue;
   html+='<div class="cat">'+cat+'</div>';
   list.forEach((it,k)=>{ const isSel=sel&&sel.raw===it.raw; const lk=locked.has(it.raw);
     html+=`<div class="litem${isSel?' sel':''}${lk?' lock':''}" data-cat="${cat}" data-i="${k}">`
       +`<span class="lc" style="background:${it.color}"></span><span class="nm">${it.label}</span>`
       +`<button class="lb" data-act="front" title="bring forward">▲</button>`
       +`<button class="lb" data-act="back" title="send back">▼</button>`
       +`<button class="lb" data-act="lock" title="lock">${lk?'🔒':'🔓'}</button></div>`;
   });
   if(cat==='Functions'&&soulN) html+=`<div class="litem" style="opacity:.7;cursor:default"><span class="lc" style="background:#7fe0ff"></span><span class="nm">Souls ×${soulN}</span></div>`;
 }
 host.innerHTML=html;
 host.querySelectorAll('.litem[data-i]').forEach(row=>{
   const cat=row.dataset.cat, k=+row.dataset.i; const it=items.filter(x=>x.cat===cat)[k];
   row.querySelectorAll('.lb').forEach(b=>b.onclick=ev=>{ ev.stopPropagation();
     const a=b.dataset.act;
     if(a==='lock'){ if(locked.has(it.raw))locked.delete(it.raw); else locked.add(it.raw); buildLayers(); return; }
     if(it.arr){ histPush(); const i=it.arr.indexOf(it.raw); if(i<0)return; it.arr.splice(i,1);
       if(a==='front') it.arr.push(it.raw); else it.arr.unshift(it.raw); persist(); draw(); }
   });
   row.onclick=()=>{ sel=it.mk(); centerOn(it.cx,it.cy); showSel(); draw(); };
 });
}
function centerOn(x,y){ camx=x-(CW/2)/zoom; camy=y-(CH/2)/zoom; }

// ---- persist / io / play ----
function persist(){ syncFields(); try{ localStorage.setItem('creapz_editdraft',JSON.stringify(M)); }catch(e){} }
// ---- undo / redo (state snapshots) ----
let undoStack=[], redoStack=[];
function snapM(){ syncFields(); return JSON.stringify(M); }
function histPush(){ undoStack.push(snapM()); if(undoStack.length>80) undoStack.shift(); redoStack.length=0; updHist(); }
function restoreM(js){ M=Object.assign(blankLevel(),JSON.parse(js)); M.theme=M.theme||''; loadFields(); sel=null; showSel(); persist(); draw(); }
function undo(){ if(!undoStack.length) return; redoStack.push(snapM()); restoreM(undoStack.pop()); updHist(); }
function redo(){ if(!redoStack.length) return; undoStack.push(snapM()); restoreM(redoStack.pop()); updHist(); }
function updHist(){ const u=document.getElementById('bUndo'),r=document.getElementById('bRedo');
  if(u){ u.style.opacity=undoStack.length?1:0.35; } if(r){ r.style.opacity=redoStack.length?1:0.35; } }
document.getElementById('bUndo').onclick=undo;
document.getElementById('bRedo').onclick=redo;
addEventListener('keydown',e=>{ const z=(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z';
  if(z){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); } });
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2400); }
function cleanLevel(){ syncFields(); const o={name:M.name,act:M.act,music:M.music}; if(M.theme)o.theme=M.theme;
 o.world=M.world;o.h=M.h;o.goal=M.goal;o.goalY=M.goalY;o.seg=M.seg;o.obst=M.obst||[];o.plats=M.plats;o.chk=M.chk;o.souls=M.souls;o.enemies=M.enemies;o.bats=M.bats;o.hazards=M.hazards||[]; return o; }
document.getElementById('bExport').onclick=()=>{ const idx=+v('fIdx')||2; const o=cleanLevel();
 const js='window.STAGES=window.STAGES||[];window.STAGES['+idx+']='+JSON.stringify(o,null,1)+';\n';
 const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));
 a.download='level-'+(o.name.toLowerCase().replace(/[^a-z0-9]+/g,'')||'stage')+'-act'+o.act+'.js'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('exported - send to Claude to commit'); };
document.getElementById('bImport').onclick=()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='.js,.json';
 inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; f.text().then(tx=>{ try{ let j=tx.trim(); const i=j.indexOf('={'); if(i>=0)j=j.slice(i+1,j.lastIndexOf('}')+1);
   histPush(); M=Object.assign(blankLevel(),JSON.parse(j)); M.theme=M.theme||''; loadFields(); sel=null; showSel(); persist(); draw(); toast('imported'); }catch(err){ toast('import failed: '+err.message); } }); }; inp.click(); };
document.getElementById('bLoadCrypt').onclick=()=>{ fetch('./levels/crypt1.js?'+Date.now()).then(r=>r.text()).then(tx=>{ try{ const i=tx.indexOf('={');
   histPush(); M=Object.assign(blankLevel(),JSON.parse(tx.slice(i+1,tx.lastIndexOf('}')+1))); M.theme=M.theme||''; loadFields(); sel=null; showSel(); persist(); draw(); toast('loaded current Crypt Act I'); }catch(err){ toast('load failed: '+err.message); } }); };
document.getElementById('bClear').onclick=()=>{ if(confirm('Clear the whole level?')){ histPush(); M=blankLevel(); loadFields(); sel=null; showSel(); persist(); draw(); } };
document.getElementById('bPlay').onclick=()=>{ try{ localStorage.setItem('creapz_testlevel',JSON.stringify(cleanLevel())); }catch(e){} location.href='./?test=1'; };

// ---- boot ----
try{ const d=localStorage.getItem('creapz_editdraft'); if(d){ M=Object.assign(blankLevel(),JSON.parse(d)); } }catch(e){}
loadFields(); fit(); updHist();
</script>
</body></html>
