<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Realm of cReapZ — Overworld</title>
<style>
  @font-face{font-family:'Creepster';src:url('assets/fonts/Creepster.woff2') format('woff2')}
  html,body{margin:0;padding:0;background:#06040e;overflow:hidden;height:100%;font-family:sans-serif}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head><body>
<canvas id="cv"></canvas>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0;
function fit(){ const d=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0); }
fit(); addEventListener('resize',fit);
const VW=1672,VH=941, ZOOM=1.45;
function vs(){ return Math.max(W/VW,H/VH)*ZOOM; }
let camX=220,camY=590;
function clampCam(){
  const s=vs();
  const hw=W/(2*s), hh=H/(2*s);
  camX=Math.max(hw,Math.min(VW-hw,camX));
  camY=Math.max(hh,Math.min(VH-hh,camY));
}
function vx(x){ return (x-camX)*vs()+W/2; }
function vy(y){ return (y-camY)*vs()+H/2; }
function wx(px){ return (px-W/2)/vs()+camX; }
function wy(py){ return (py-H/2)/vs()+camY; }

const MAPIMG=new Image(); let MAPok=false;
MAPIMG.onload=()=>{ MAPok=true; }; MAPIMG.src='assets/owmap2.png';

const WORLDS=[
 {id:'cem',    x:220,y:590, name:'cReapY Cemetery',  col:'#a98aff', acts:['done','done','open']},
 {id:'witch',  x:425,y:350, name:'Witchwood',        col:'#3ddc5a', acts:['done','open','locked']},
 {id:'crypt',  x:515,y:735, name:'Crypt Depths',     col:'#e0a93c', acts:['open','locked','locked']},
 {id:'harbor', x:835,y:800, name:'Drowned Harbor',   col:'#41c8ff', acts:['open','locked','locked']},
 {id:'spire',  x:710,y:160, name:'Bell Spire',       col:'#8f86b8', acts:['open','locked','locked']},
 {id:'plains', x:830,y:400, name:'Ethereal Plains',  col:'#7df3e1', acts:['open','locked','locked']},
 {id:'charnel',x:1170,y:510,name:'Charnel Peak',     col:'#ff5c4a', acts:['open','locked','locked']},
 {id:'rift',   x:1130,y:160,name:'The Rift',         col:'#d36cff', acts:['open','locked','locked']},
 {id:'castle', x:1500,y:360,name:'Blood Moon Castle',col:'#e0506a', acts:['locked','locked','locked'], locked:true},
];
const ALL={}; for(const n of WORLDS) ALL[n.id]=n;
const EDGES=[['cem','witch'],['cem','crypt'],['witch','spire'],['witch','plains'],
 ['crypt','harbor'],['harbor','plains'],['spire','plains'],['plains','rift'],
 ['harbor','charnel'],['plains','charnel'],['charnel','castle'],['rift','castle']];
// polylines auto-traced along the painted footpaths (A* over trail-color cost field)
const EDGEPATHS={"cem_witch": [[220, 589], [256, 595], [292, 583], [328, 550], [364, 532], [400, 526], [433, 493], [457, 457], [493, 427], [514, 391], [499, 358], [463, 355], [427, 346], [424, 349]], "cem_crypt": [[220, 589], [256, 619], [292, 646], [328, 664], [364, 673], [400, 679], [436, 688], [472, 706], [508, 733], [514, 736]], "witch_spire": [[424, 349], [460, 355], [496, 355], [532, 355], [568, 322], [604, 298], [640, 268], [676, 238], [712, 217], [730, 190], [709, 160]], "witch_plains": [[424, 349], [460, 355], [496, 358], [532, 382], [568, 394], [604, 400], [640, 400], [676, 397], [712, 385], [748, 382], [784, 403], [820, 397], [829, 400]], "crypt_harbor": [[514, 736], [547, 751], [580, 775], [616, 775], [652, 760], [688, 754], [724, 766], [757, 799], [790, 814], [826, 799], [835, 799]], "harbor_plains": [[835, 799], [850, 763], [838, 727], [829, 691], [829, 655], [832, 619], [829, 583], [805, 547], [811, 511], [835, 475], [829, 439], [829, 403], [829, 400]], "spire_plains": [[709, 160], [736, 196], [772, 226], [808, 262], [829, 298], [835, 334], [829, 370], [829, 400]], "plains_rift": [[829, 400], [865, 370], [895, 334], [931, 307], [967, 304], [1003, 304], [1039, 289], [1075, 271], [1096, 235], [1108, 199], [1129, 163], [1129, 160]], "harbor_charnel": [[835, 799], [871, 763], [901, 727], [937, 697], [973, 670], [1009, 640], [1045, 625], [1081, 604], [1117, 571], [1135, 535], [1165, 511], [1171, 511]], "plains_charnel": [[829, 400], [859, 436], [895, 442], [931, 469], [967, 493], [1003, 502], [1039, 496], [1075, 502], [1111, 511], [1147, 496], [1171, 511]], "charnel_castle": [[1171, 511], [1207, 514], [1243, 541], [1279, 574], [1315, 562], [1351, 541], [1387, 520], [1423, 496], [1453, 466], [1474, 430], [1495, 397], [1498, 361], [1501, 361]], "rift_castle": [[1129, 160], [1153, 196], [1153, 232], [1177, 265], [1213, 298], [1249, 313], [1285, 334], [1321, 352], [1357, 370], [1393, 388], [1429, 385], [1465, 373], [1498, 361], [1501, 361]]};
function edgePts(a,b){
  const k1=a+'_'+b, k2=b+'_'+a;
  if(EDGEPATHS[k1]) return EDGEPATHS[k1];
  if(EDGEPATHS[k2]) return EDGEPATHS[k2].slice().reverse();
  return [[ALL[a].x,ALL[a].y],[ALL[b].x,ALL[b].y]];
}

let hero='cem', hx=ALL.cem.x, hy=ALL.cem.y, route=[], ptQ=[], walking=false;
let panel=null, toast=null, toastT=0, lastDir={r:1,m:1};
const HEROES={
  bat:   {src:'assets/owbat3.png',  img:null, mirrorFB:true},
  reaper:{src:'assets/owreap2.png', img:null, mirrorFB:false},
};
let heroSel='bat';
for(const k in HEROES){ const img=new Image(); img.onload=()=>{ HEROES[k].img=img; }; img.src=HEROES[k].src; }

function nbrs(id){ const o=[]; for(const [a,b] of EDGES){ if(a===id)o.push(b); if(b===id)o.push(a);} return o; }
function pathTo(from,to){
  const blocked=id=>ALL[id].locked;
  if(blocked(to)) return null;
  const q=[from],seen=new Set([from]),par={};
  while(q.length){ const c=q.shift();
    if(c===to){ const p=[to]; let k=to; while(k!==from){k=par[k];p.unshift(k);} return p; }
    for(const nb of nbrs(c)){ if(!seen.has(nb)&&!blocked(nb)){ seen.add(nb); par[nb]=c; q.push(nb); } } }
  return null;
}
function startEdge(){ // load polyline for hero->route[0]
  if(!route.length) return;
  ptQ=edgePts(hero,route[0]).slice(1).map(p=>({x:p[0],y:p[1]}));
}
function panelRect(){ const w=Math.min(W-24,420), h=128; return {x:W/2-w/2,y:H-h-14,w,h}; }
function chipRect(P,i){ const cw=(P.w-56)/3; return {x:P.x+16+i*(cw+12), y:P.y+58, w:cw, h:52}; }
cv.addEventListener('pointerdown',e=>{
  const s=vs();
  if(e.clientX>W-120&&e.clientY<46){ heroSel=heroSel==='bat'?'reaper':'bat'; return; }
  if(panel){
    const P=panelRect();
    if(e.clientX>P.x&&e.clientX<P.x+P.w&&e.clientY>P.y&&e.clientY<P.y+P.h){
      const wld=ALL[panel];
      for(let i=0;i<3;i++){
        const c=chipRect(P,i);
        if(e.clientX>c.x&&e.clientX<c.x+c.w&&e.clientY>c.y&&e.clientY<c.y+c.h){
          const st=wld.acts[i];
          if(st==='locked') toast='Act '+'I II III'.split(' ')[i]+' is still locked';
          else toast=(st==='done'?'Replaying ':'Launching ')+wld.name+' — Act '+'I II III'.split(' ')[i]+'!';
          toastT=2.4; return;
        }
      }
      return;
    }
    panel=null;
  }
  for(const n of WORLDS){
    const dx=e.clientX-vx(n.x), dy=e.clientY-vy(n.y), r=(26*s+14);
    if(dx*dx+dy*dy<r*r){
      if(n.locked){ toast='Sealed by the usurper\'s power...'; toastT=2.2; return; }
      if(hero===n.id&&!walking){ panel=n.id; return; }
      // on-rails redirect: finish current edge, then re-path
      if(walking&&route.length){
        const anchor=route[0];
        const p=pathTo(anchor,n.id);
        if(p){ route=p; } // ptQ continues to anchor=route[0]; arrival logic shifts route
        else { toast='No open path there'; toastT=2; }
      } else {
        const p=pathTo(hero,n.id);
        if(p){ route=p.slice(1); walking=true; panel=null; startEdge(); }
      }
      return;
    }
  }
});

let t0=performance.now(),last=t0;
function loop(){
  const now=performance.now(), t=(now-t0)/1000, dt=Math.min(0.05,(now-last)/1000); last=now;
  const s=vs();
  // camera follows hero
  camX+=(hx-camX)*Math.min(1,dt*3.2);
  camY+=(hy-camY)*Math.min(1,dt*3.2);
  clampCam();
  ctx.fillStyle='#06040e'; ctx.fillRect(0,0,W,H);
  if(MAPok){ ctx.imageSmoothingEnabled=true; ctx.drawImage(MAPIMG, vx(0),vy(0), VW*s,VH*s); }
  // glow dots along traced footpaths
  for(const [a,b] of EDGES){
    const lit=!(ALL[a].locked||ALL[b].locked);
    const pts=edgePts(a,b);
    let acc=0;
    for(let i=1;i<pts.length;i++){
      const x0=pts[i-1][0],y0=pts[i-1][1],x1=pts[i][0],y1=pts[i][1];
      const seg=Math.hypot(x1-x0,y1-y0); const n=Math.max(1,Math.floor(seg/26));
      for(let k2=0;k2<n;k2++){
        acc++;
        const px=x0+(x1-x0)*k2/n, py=y0+(y1-y0)*k2/n;
        if(vx(px)<-20||vx(px)>W+20||vy(py)<-20||vy(py)>H+20) continue;
        ctx.globalAlpha=lit?(0.4+0.3*Math.sin(t*3-acc*0.7)):0.14;
        ctx.fillStyle=lit?'#b9a6ff':'#5a5470';
        ctx.beginPath(); ctx.arc(vx(px),vy(py),2.4*s,0,7); ctx.fill();
      }
    }
  }
  ctx.globalAlpha=1;
  // nodes
  for(const n of WORLDS){
    if(vx(n.x)<-120||vx(n.x)>W+120||vy(n.y)<-120||vy(n.y)>H+120) continue;
    const R=22*s, done=n.acts.filter(a=>a==='done').length;
    const pulse=(!n.locked&&n.acts.includes('open'))?1+0.06*Math.sin(t*4):1;
    if(!n.locked){ const gr=ctx.createRadialGradient(vx(n.x),vy(n.y),0,vx(n.x),vy(n.y),R*2.4);
      gr.addColorStop(0,n.col+'55'); gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gr; ctx.fillRect(vx(n.x)-R*2.4,vy(n.y)-R*2.4,R*4.8,R*4.8); }
    ctx.fillStyle=n.locked?'rgba(43,38,64,0.88)':'rgba(34,26,68,0.88)';
    ctx.strokeStyle=n.locked?'#4c4566':n.col; ctx.lineWidth=3*s;
    ctx.beginPath(); ctx.arc(vx(n.x),vy(n.y),R*pulse,0,7); ctx.fill(); ctx.stroke();
    if(done===3){ ctx.strokeStyle='#c8fb50'; ctx.lineWidth=2.5*s; ctx.beginPath(); ctx.arc(vx(n.x),vy(n.y),R*0.55,0,7); ctx.stroke(); }
    if(n.locked){ ctx.fillStyle='#8a82a6'; ctx.font='bold '+(14*s)+'px sans-serif'; ctx.textAlign='center'; ctx.fillText('🔒',vx(n.x),vy(n.y)+5*s); }
    for(let i=0;i<3;i++){
      const ax=vx(n.x)+(i-1)*11*s, ay=vy(n.y)+R+11*s, st=n.acts[i];
      ctx.beginPath(); ctx.arc(ax,ay,3.8*s,0,7);
      if(st==='done'){ ctx.fillStyle='#c8fb50'; ctx.fill(); }
      else { ctx.strokeStyle=st==='open'?'#b9a6ff':'#55506e'; ctx.lineWidth=1.7*s; ctx.stroke();
        if(st==='open'){ ctx.fillStyle='rgba(185,166,255,'+(0.3+0.3*Math.sin(t*4))+')'; ctx.fill(); } }
    }
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=6*s;
    ctx.fillStyle=n.locked?'#8a82a6':'#efe9ff';
    ctx.font=(14*s)+'px Creepster, cursive'; ctx.textAlign='center';
    ctx.fillText(n.name, vx(n.x), vy(n.y)-R-9*s);
    ctx.restore();
  }
  // hero movement along traced polyline
  if(walking){
    if(!ptQ.length&&route.length) startEdge();
    if(ptQ.length){
      const tgt=ptQ[0];
      const dx=tgt.x-hx, dy=tgt.y-hy, d=Math.hypot(dx,dy), sp=170*dt;
      if(d<sp){
        hx=tgt.x; hy=tgt.y; ptQ.shift();
        if(!ptQ.length){ hero=route.shift(); if(!route.length) walking=false; else startEdge(); }
      } else {
        hx+=dx/d*sp; hy+=dy/d*sp;
        if(Math.abs(dx)>Math.abs(dy)) lastDir={r:0,m:dx>=0?1:-1};
        else if(Math.abs(dy)>2) lastDir={r:dy>=0?1:2,m:1};
      }
    } else walking=false;
  }
  const hop=walking?Math.abs(Math.sin(t*9))*3*s:0;
  const HCFG=HEROES[heroSel];
  if(HCFG.img){
    const C=120;
    const st4=Math.floor(t*7)%4, st8=Math.floor(t*7)%8;
    let fi,mir;
    if(lastDir.r===0){ fi=st4; mir=lastDir.m<0; }
    else if(HCFG.mirrorFB){ fi=st8%4; mir=st8>=4; }
    else { fi=st4; mir=false; }
    if(!walking){ fi=0; }
    const hsc=(40*s)/C;
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(vx(hx),vy(hy)+4*s,10*s,3.6*s,0,0,7); ctx.fill();
    ctx.save(); ctx.translate(vx(hx),vy(hy)+5*s-hop); ctx.scale(mir?-hsc:hsc,hsc);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(HCFG.img, fi*C,lastDir.r*C,C,C, -C/2,-C, C,C); ctx.restore();
  }
  // act panel
  if(panel){
    const wld=ALL[panel], P=panelRect();
    ctx.fillStyle='rgba(18,14,36,0.95)'; ctx.strokeStyle=wld.col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(P.x,P.y,P.w,P.h,14); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#e6e0fa'; ctx.font='22px Creepster, cursive'; ctx.textAlign='center';
    ctx.fillText(wld.name, P.x+P.w/2, P.y+34);
    ctx.font='12px sans-serif'; ctx.fillStyle='#9b8cff'; ctx.fillText('choose your act', P.x+P.w/2, P.y+50);
    for(let i=0;i<3;i++){
      const c=chipRect(P,i), st=wld.acts[i];
      ctx.fillStyle=st==='done'?'rgba(200,251,80,0.12)':st==='open'?'rgba(123,92,255,0.25)':'rgba(60,56,80,0.4)';
      ctx.strokeStyle=st==='done'?'#c8fb50':st==='open'?'#a98aff':'#55506e'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(c.x,c.y,c.w,c.h,10); ctx.fill(); ctx.stroke();
      ctx.fillStyle=st==='locked'?'#6e6886':'#e6e0fa'; ctx.font='bold 15px sans-serif';
      ctx.fillText('ACT '+['I','II','III'][i], c.x+c.w/2, c.y+22);
      ctx.font='11px sans-serif';
      ctx.fillStyle=st==='done'?'#c8fb50':st==='open'?'#b9a6ff':'#6e6886';
      ctx.fillText(st==='done'?'★ replay':st==='open'?'play':'🔒 locked', c.x+c.w/2, c.y+40);
    }
  }
  // HUD
  ctx.fillStyle='rgba(20,16,36,.6)'; ctx.beginPath(); ctx.roundRect(12,12,236,30,8); ctx.fill();
  ctx.fillStyle='#9b8cff'; ctx.font='12px sans-serif'; ctx.textAlign='left';
  ctx.fillText('REALM OF CREAPZ — scrolling overworld', 22,31);
  ctx.fillStyle='rgba(20,16,36,.6)'; ctx.beginPath(); ctx.roundRect(W-112,12,100,30,8); ctx.fill();
  ctx.strokeStyle='#7b5cff'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#c8fb50'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
  ctx.fillText(heroSel==='bat'?'→ REAPER':'→ BAT', W-62, 31);
  if(toast&&toastT>0){ toastT-=dt;
    ctx.font='bold 14px sans-serif';
    const tw=ctx.measureText(toast).width+40;
    ctx.fillStyle='rgba(20,16,40,.9)'; ctx.strokeStyle='#7b5cff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(W/2-tw/2,16,tw,36,9); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#eaf6ff'; ctx.textAlign='center'; ctx.fillText(toast, W/2, 39);
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body></html>
