<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Soul Preview</title>
<style>
  html,body{margin:0;padding:0;background:#0d0b1a;color:#eaf6ff;font-family:sans-serif;overflow:hidden;height:100%}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head><body>
<canvas id="cv"></canvas>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

const STARS=[]; for(let i=0;i<90;i++) STARS.push([Math.random(),Math.random()*0.9,Math.random()*1.4+0.4,Math.random()*6.28]);

// ---- current soul sprite (reference) ----
let SA=null;
fetch('assets/sprites.json').then(r=>r.json()).then(sp=>{
  const e=sp.soul; const img=new Image();
  img.onload=()=>{ SA={img,sw:e.sw,sh:e.sh,w:e.w,h:e.h,frames:e.frames}; };
  img.src=e.src.startsWith('data:')?e.src:('assets/'+e.src);
});

// ---- cached bitmaps (built once) ----
function radial(size, stops){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d'), gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const [o,col] of stops) gr.addColorStop(o,col);
  g.fillStyle=gr; g.fillRect(0,0,size,size); return c;
}
const GLOW=radial(128,[[0,'rgba(120,215,255,0.55)'],[0.35,'rgba(95,205,255,0.28)'],[0.7,'rgba(70,160,255,0.10)'],[1,'rgba(60,140,255,0)']]);
const CORE=radial(64,[[0,'rgba(255,255,255,1)'],[0.28,'rgba(225,250,255,1)'],[0.55,'rgba(130,220,255,0.95)'],[0.82,'rgba(80,175,255,0.55)'],[1,'rgba(70,160,255,0)']]);
const MOTE=radial(20,[[0,'rgba(255,255,255,1)'],[0.4,'rgba(160,230,255,0.9)'],[1,'rgba(110,200,255,0)']]);
const RING=(function(){ const s=128,c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d'), gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(0.70,'rgba(120,215,255,0)');
  gr.addColorStop(0.82,'rgba(170,235,255,0.85)'); gr.addColorStop(0.92,'rgba(95,205,255,0.25)'); gr.addColorStop(1,'rgba(95,205,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s); return c; })();

function bobOf(t,ph){ return Math.sin(t*2.2+ph)*4; }
function L(){ ctx.globalCompositeOperation='lighter'; }
function NL(){ ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }
function halo(x,cy,R,br,amt){ const gs=R*(4.6+0.7*br); ctx.globalAlpha=amt*(0.55+0.40*br); ctx.drawImage(GLOW,x-gs/2,cy-gs/2,gs,gs); }
function core(x,cy,s,a){ ctx.globalAlpha=a==null?1:a; ctx.drawImage(CORE,x-s/2,cy-s/2,s,s); }
function mote(x,y,s,a){ ctx.globalAlpha=a; ctx.drawImage(MOTE,x-s*2,y-s*2,s*4,s*4); }

// ---- A ORBIT: motes on tilted ellipse + rising wisp ----
function dA(x,y,t,ph,R){
  const bob=bobOf(t,ph), br=0.5+0.5*Math.sin(t*2.6+ph*1.7), cy=y+bob;
  const ms=[];
  for(let i=0;i<3;i++){ const a=t*1.9+ph+i*2.094;
    ms.push({x:x+Math.cos(a)*R*1.95, y:cy+Math.sin(a)*R*0.62-Math.cos(a)*R*0.30, z:Math.sin(a)}); }
  L();
  for(const m of ms) if(m.z<0) mote(m.x,m.y,2.1+0.9*(m.z*0.5+0.5),0.5);
  halo(x,cy,R,br,1);
  core(x,cy,R*2*(1+0.07*br));
  const wt=((t*0.62+ph)%1);
  if(wt<0.7){ const wa=(wt<0.15?wt/0.15:1-(wt-0.15)/0.55);
    mote(x+Math.sin(wt*9+ph)*4, cy-R*1.2-wt*26, 3.6, 0.8*wa); }
  for(const m of ms) if(m.z>=0) mote(m.x,m.y,2.1+0.9*(m.z*0.5+0.5),0.95);
  NL();
}
// ---- B WISP: will-o'-wisp flame, flicker + licks rising off the crown ----
function dB(x,y,t,ph,R){
  const bob=bobOf(t,ph), cy=y+bob;
  const fl=0.5+0.32*Math.sin(t*8.5+ph)+0.18*Math.sin(t*13.7+ph*2.3);
  L();
  halo(x,cy,R,fl*0.6+0.2,0.9);
  // flame body: vertically-stretched core + smaller inner tongue, both flickering
  const w1=R*1.9*(1+0.05*fl), h1=R*2.7*(1+0.14*fl);
  ctx.globalAlpha=0.95; ctx.drawImage(CORE,x-w1/2,cy-h1*0.58,w1,h1);
  const w2=R*1.15, h2=R*1.7*(1+0.22*fl);
  ctx.globalAlpha=1; ctx.drawImage(CORE,x-w2/2+Math.sin(t*10+ph)*1.2,cy-h2*0.62,w2,h2);
  // licks: 3 sparks peeling off the crown, rising + wobbling
  for(let i=0;i<3;i++){ const u=((t*0.9+ph+i/3)%1);
    if(u<0.62){ const ua=(u<0.12?u/0.12:1-(u-0.12)/0.5);
      mote(x+Math.sin(u*14+ph+i*2.1)*R*0.55, cy-R*1.1-u*22, 2.6*(1-u*0.6), 0.85*ua); } }
  NL();
}
// ---- C HALO: tilted saturn ring with a comet riding it ----
function dC(x,y,t,ph,R){
  const bob=bobOf(t,ph), br=0.5+0.5*Math.sin(t*2.4+ph*1.7), cy=y+bob;
  const rx=R*2
