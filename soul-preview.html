<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Soul Preview</title>
<style>
  html,body{margin:0;padding:0;background:#0d0b1a;color:#eaf6ff;font-family:sans-serif;overflow:hidden;height:100%}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head><body>
<canvas id="cv"></canvas>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function fit(){ DPR=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
fit(); addEventListener('resize',fit);

const STARS=[]; for(let i=0;i<90;i++) STARS.push([Math.random(),Math.random()*0.9,Math.random()*1.4+0.4,Math.random()*6.28]);

let SA=null;
fetch('assets/sprites.json').then(r=>r.json()).then(sp=>{
  const e=sp.soul; const img=new Image();
  img.onload=()=>{ SA={img,sw:e.sw,sh:e.sh,w:e.w,h:e.h,frames:e.frames}; };
  img.src=e.src.startsWith('data:')?e.src:('assets/'+e.src);
});

function radial(size, stops){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d'), gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const st of stops) gr.addColorStop(st[0],st[1]);
  g.fillStyle=gr; g.fillRect(0,0,size,size); return c;
}
const GLOW=radial(128,[[0,'rgba(120,215,255,0.55)'],[0.35,'rgba(95,205,255,0.28)'],[0.7,'rgba(70,160,255,0.10)'],[1,'rgba(60,140,255,0)']]);
const CORE=radial(64,[[0,'rgba(255,255,255,1)'],[0.28,'rgba(225,250,255,1)'],[0.55,'rgba(130,220,255,0.95)'],[0.82,'rgba(80,175,255,0.55)'],[1,'rgba(70,160,255,0)']]);
const MOTE=radial(20,[[0,'rgba(255,255,255,1)'],[0.4,'rgba(160,230,255,0.9)'],[1,'rgba(110,200,255,0)']]);
const RING=(function(){ const s=128,c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d'), gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(0.70,'rgba(120,215,255,0)');
  gr.addColorStop(0.82,'rgba(170,235,255,0.85)'); gr.addColorStop(0.92,'rgba(95,205,255,0.25)'); gr.addColorStop(1,'rgba(95,205,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s); return c; })();

function bobOf(t,ph){ return Math.sin(t*2.2+ph)*4; }
function L(){ ctx.globalCompositeOperation='lighter'; }
function NL(){ ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }
function halo(x,cy,R,br,amt){ const gs=R*(4.6+0.7*br); ctx.globalAlpha=amt*(0.55+0.40*br); ctx.drawImage(GLOW,x-gs/2,cy-gs/2,gs,gs); }
function core(x,cy,s,a){ ctx.globalAlpha=(a==null?1:a); ctx.drawImage(CORE,x-s/2,cy-s/2,s,s); }
function mote(x,y,s,a){ ctx.globalAlpha=a; ctx.drawImage(MOTE,x-s*2,y-s*2,s*4,s*4); }

function dA(x,y,t,ph,R){
  const bob=bobOf(t,ph), br=0.5+0.5*Math.sin(t*2.6+ph*1.7), cy=y+bob;
  const ms=[];
  for(let i=0;i<3;i++){ const a=t*1.9+ph+i*2.094;
    ms.push({x:x+Math.cos(a)*R*1.95, y:cy+Math.sin(a)*R*0.62-Math.cos(a)*R*0.30, z:Math.sin(a)}); }
  L();
  for(const m of ms) if(m.z<0) mote(m.x,m.y,2.1+0.9*(m.z*0.5+0.5),0.5);
  halo(x,cy,R,br,1);
  core(x,cy,R*2*(1+0.07*br));
  const wt=((t*0.62+ph)%1);
  if(wt<0.7){ const wa=(wt<0.15?wt/0.15:1-(wt-0.15)/0.55);
    mote(x+Math.sin(wt*9+ph)*4, cy-R*1.2-wt*26, 3.6, 0.8*wa); }
  for(const m of ms) if(m.z>=0) mote(m.x,m.y,2.1+0.9*(m.z*0.5+0.5),0.95);
  NL();
}
function dB(x,y,t,ph,R){
  const bob=bobOf(t,ph), cy=y+bob;
  const fl=0.5+0.32*Math.sin(t*8.5+ph)+0.18*Math.sin(t*13.7+ph*2.3);
  L();
  halo(x,cy,R,fl*0.6+0.2,0.9);
  const w1=R*1.9*(1+0.05*fl), h1=R*2.7*(1+0.14*fl);
  ctx.globalAlpha=0.95; ctx.drawImage(CORE,x-w1/2,cy-h1*0.58,w1,h1);
  const w2=R*1.15, h2=R*1.7*(1+0.22*fl);
  ctx.globalAlpha=1; ctx.drawImage(CORE,x-w2/2+Math.sin(t*10+ph)*1.2,cy-h2*0.62,w2,h2);
  for(let i=0;i<3;i++){ const u=((t*0.9+ph+i/3)%1);
    if(u<0.62){ const ua=(u<0.12?u/0.12:1-(u-0.12)/0.5);
      mote(x+Math.sin(u*14+ph+i*2.1)*R*0.55, cy-R*1.1-u*22, 2.6*(1-u*0.6), 0.85*ua); } }
  NL();
}
function dC(x,y,t,ph,R){
  const bob=bobOf(t,ph), br=0.5+0.5*Math.sin(t*2.4+ph*1.7), cy=y+bob;
  const rx=R*2.15, ry=R*0.85, tilt=-0.45, a=t*2.6+ph;
  const cx2=Math.cos(a)*rx, cy2=Math.sin(a)*ry;
  const px=x+cx2*Math.cos(tilt)-cy2*Math.sin(tilt), py=cy+cx2*Math.sin(tilt)+cy2*Math.cos(tilt);
  const front=Math.sin(a)>0;
  L();
  halo(x,cy,R,br,0.9);
  ctx.strokeStyle='rgba(150,225,255,0.7)'; ctx.lineWidth=2.2;
  ctx.globalAlpha=0.35+0.25*br;
  ctx.beginPath(); ctx.ellipse(x,cy,rx,ry,tilt,Math.PI,2*Math.PI); ctx.stroke();
  if(!front) mote(px,py,2.8,0.95);
  core(x,cy,R*2*(1+0.06*br));
  ctx.globalAlpha=0.55+0.35*br;
  ctx.beginPath(); ctx.ellipse(x,cy,rx,ry,tilt,0,Math.PI); ctx.stroke();
  if(front) mote(px,py,2.8,0.95);
  NL();
}
function dD(x,y,t,ph,R){
  const bob=bobOf(t,ph), cy=y+bob;
  L();
  halo(x,cy,R,0.5,0.8);
  for(let i=0;i<2;i++){ const u=((t*0.55+ph*0.7+i*0.5)%1);
    const s=R*2.2*(0.9+u*2.4), ua=(u<0.1?u/0.1:1-(u-0.1)/0.9);
    ctx.globalAlpha=0.75*ua; ctx.drawImage(RING,x-s/2,cy-s/2,s,s); }
  const pop=Math.pow(1-((t*0.55+ph*0.7)%1),3);
  core(x,cy,R*2*(1+0.16*pop));
  NL();
}
function dE(x,y,t,ph,R){
  const bob=bobOf(t,ph), br=0.5+0.5*Math.sin(t*2.6+ph*1.7), cy=y+bob;
  L();
  halo(x,cy,R,br,0.85);
  core(x,cy,R*1.9*(1+0.06*br));
  for(let i=0;i<5;i++){ const u=((t*0.42+ph+i/5)%1);
    const yy=cy+R*1.0-u*R*4.2, xx=x+Math.cos(u*10.5+ph+i)*R*1.25*(1-u*0.45);
    const ua=(u<0.12?u/0.12:1-(u-0.12)/0.88);
    mote(xx,yy,2.4*(1-u*0.5),0.9*ua); }
  NL();
}
function dF(x,y,t,ph,R){
  const bob=bobOf(t,ph), br=0.5+0.5*Math.sin(t*2.6+ph*1.7), cy=y+bob;
  const a=t*2.3+ph;
  const o=[{dx:Math.cos(a)*R*1.05, z:Math.sin(a)},{dx:-Math.cos(a)*R*1.05, z:-Math.sin(a)}];
  o.sort(function(p,q){return p.z-q.z});
  L();
  halo(x,cy,R*1.05,br,1);
  for(const s of o){ const k=1+0.22*s.z;
    core(x+s.dx, cy+s.z*R*0.18, R*1.45*k, 0.9+0.1*s.z); }
  NL();
}

const DESIGNS=[
  {f:dA,name:'A · ORBIT'},{f:dB,name:'B · WISP'},{f:dC,name:'C · HALO'},
  {f:dD,name:'D · PULSE'},{f:dE,name:'E · ASCEND'},{f:dF,name:'F · TWIN'}];
let sel=0;

function label(txt,x,y,hot){ ctx.fillStyle=hot?'#c8fb50':'#9fb8d8'; ctx.font=(hot?'bold 14px':'13px')+' sans-serif'; ctx.textAlign='center'; ctx.fillText(txt,x,y); }

function cells(){
  const cols=(W>700)?4:2, n=7, rows=Math.ceil(n/cols);
  const gh=H*0.66, cw=W/cols, ch=gh/rows, out=[];
  for(let i=0;i<n;i++) out.push({x:cw*(i%cols)+cw/2, y:ch*Math.floor(i/cols)+ch*0.52, ch:ch});
  return out;
}
cv.addEventListener('pointerdown',function(e){
  const cs=cells();
  for(let i=1;i<cs.length;i++){ const c=cs[i];
    if(Math.abs(e.clientX-c.x)<W/(W>700?8:4) && Math.abs(e.clientY-c.y)<c.ch*0.5){ sel=i-1; return; } }
});

let t0=performance.now();
function loop(){
  const t=(performance.now()-t0)/1000;
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0d0b1a'); g.addColorStop(1,'#1a1430');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(const s of STARS){ ctx.globalAlpha=0.35+0.45*(0.5+0.5*Math.sin(t*1.3+s[3])); ctx.fillStyle='#cfe4ff'; ctx.fillRect(s[0]*W,s[1]*H,s[2],s[2]); }
  ctx.globalAlpha=1;
  const cs=cells();
  if(SA){ const fi=Math.floor(t*20)%SA.frames;
    ctx.drawImage(SA.img, fi*SA.sw,0,SA.sw,SA.sh, cs[0].x-SA.w/2, cs[0].y-SA.h/2, SA.w,SA.h); }
  label('CURRENT', cs[0].x, cs[0].y+cs[0].ch*0.38, false);
  for(let i=0;i<6;i++){ const c=cs[i+1];
    DESIGNS[i].f(c.x,c.y,t,i*1.13,13);
    label(DESIGNS[i].name, c.x, c.y+c.ch*0.38, sel===i); }
  const ty=H*0.84;
  for(let i=0;i<3;i++) DESIGNS[sel].f(W*(0.5+(i-1)*0.24), ty, t, i*1.9, 13);
  label(DESIGNS[sel].name+'  ×3 — tap any design above', W*0.5, Math.min(H-10,ty+62), true);
  requestAnimationFrame(loop);
}
loop();
</script>
</body></html>
