<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>cReapZ — Title Screen Preview</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frijole&family=Creepster&family=Inter:wght@600;700;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#08060f;color:#e8e6f5;font-family:Inter,system-ui,sans-serif;min-height:100dvh;
  padding:max(12px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.ttl{font-family:Frijole,serif;font-size:18px;color:#e7d3a0;margin:2px 0 2px;text-align:center}
.hint{font:600 11px Inter;color:#9a8fc0;text-align:center;max-width:560px;margin-bottom:10px;line-height:1.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.bar .grp{display:flex;gap:6px;background:#140f28;border:1px solid #2a2150;border-radius:10px;padding:5px}
.bar button{font:700 11px Inter;padding:7px 11px;border-radius:7px;border:1px solid #33264f;background:#1d1640;color:#e8e6f5;cursor:pointer}
.bar button.on{border-color:#c8fb50;color:#c8fb50;background:#1f2616}
.lbl{font:700 9px Inter;letter-spacing:1px;color:#6f6790;align-self:center;padding:0 4px}

.screen{width:100%;max-width:780px;aspect-ratio:960/440;position:relative;border-radius:14px;overflow:hidden;
  box-shadow:0 22px 60px rgba(0,0,0,.6);border:1px solid #2a2150;background:#000;cursor:pointer}
.art{position:absolute;inset:0;background-image:url('./assets/title_keyart.png?v=t2');background-position:center center;background-repeat:no-repeat;background-size:cover;
  filter:saturate(1.22) brightness(1.09) contrast(1.05);transition:filter .2s}
.screen.fit .art{background-size:contain;background-color:#06040c}
.screen.orig .art{filter:none}
.screen.spot .art{filter:saturate(1.12) brightness(1.02)}
.spotlight{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(46% 60% at 50% 50%, rgba(255,240,210,.28), rgba(255,200,150,.08) 45%, transparent 70%)}
.screen.spot .spotlight{opacity:1}

.scrim{position:absolute;left:0;right:0;bottom:0;height:42%;pointer-events:none;opacity:0;transition:opacity .3s;
  background:linear-gradient(to top, rgba(5,3,12,.92) 0%, rgba(5,3,12,.5) 42%, transparent 100%)}
.screen.menuon .scrim{opacity:1}
.topscrim{position:absolute;left:0;right:0;top:0;height:30%;pointer-events:none;
  background:linear-gradient(to bottom, rgba(5,3,12,.6), transparent)}
.brand{position:absolute;top:4%;left:0;right:0;text-align:center;font:700 clamp(8px,1.4vw,11px) Inter;letter-spacing:4px;color:#d8b25a;opacity:.9;text-shadow:0 2px 6px #000;z-index:4}

/* attract logo — sits high, above the heroes' heads */
.logo{position:absolute;left:0;right:0;top:11%;text-align:center;z-index:4;transition:opacity .3s, transform .3s}
.logo .t{font-family:Frijole,Creepster,serif;font-size:clamp(26px,7vw,58px);line-height:.9;color:#c8fb50;
  text-shadow:0 0 16px rgba(200,251,80,.5), 0 3px 0 #16102e, 0 6px 18px rgba(0,0,0,.85)}
.logo .sub{font:700 9px Inter;letter-spacing:3px;color:#e7d3a0;opacity:.85;margin-top:2px;text-shadow:0 2px 5px #000}
.screen.posbot .logo{top:auto;bottom:20%}
.screen.menuon .logo{opacity:0;transform:translateY(-8px);pointer-events:none}

/* shrunk corner logo that stays during menu */
.miniLogo{position:absolute;top:7%;left:4%;font-family:Frijole,Creepster,serif;font-size:clamp(13px,2.6vw,22px);color:#c8fb50;text-shadow:0 0 10px rgba(200,251,80,.5),0 2px 0 #16102e,0 4px 10px #000;z-index:4;opacity:0;transition:opacity .3s}
.screen.menuon.mini .miniLogo{opacity:1}

.press{position:absolute;left:0;right:0;bottom:9%;text-align:center;font:700 clamp(11px,1.8vw,16px) Inter;letter-spacing:2px;color:#eae6ff;text-shadow:0 2px 8px #000;z-index:4;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.screen.menuon .press{display:none}

.menu{position:absolute;left:0;right:0;bottom:8%;display:flex;gap:clamp(6px,1.4vw,16px);justify-content:center;z-index:4;padding:0 12px;opacity:0;transform:translateY(8px);transition:opacity .3s, transform .3s;pointer-events:none}
.screen.menuon .menu{opacity:1;transform:none;pointer-events:auto}
.menu button{font:700 clamp(10px,1.7vw,15px) Inter;padding:clamp(7px,1.3vw,11px) clamp(10px,2.2vw,22px);border-radius:9px;cursor:pointer;
  background:rgba(20,16,40,.82);border:1.5px solid rgba(155,140,255,.5);color:#e8e6f5;backdrop-filter:blur(2px)}
.menu button.play{border-color:#c8fb50;color:#c8fb50;background:rgba(31,38,22,.82)}
</style>
</head>
<body>
<div class="ttl">cReapZ — Title Screen Preview</div>
<div class="hint">Tap the screen to go from the attract logo → menu (the logo lifts away and the buttons appear). Toggles below.</div>
<div class="bar">
  <div class="grp"><span class="lbl">COLOR</span>
    <button data-t="treat" data-v="vivid" class="on">Vivid</button>
    <button data-t="treat" data-v="orig">Original</button>
    <button data-t="treat" data-v="spot">Spotlight</button>
  </div>
  <div class="grp"><span class="lbl">LOGO SPOT</span>
    <button data-t="pos" data-v="top" class="on">High</button>
    <button data-t="pos" data-v="bot">Lower</button>
  </div>
  <div class="grp"><span class="lbl">MENU STATE</span>
    <button data-t="mini" data-v="off">Logo hides</button>
    <button data-t="mini" data-v="on" class="on">Mini corner</button>
  </div>
  <div class="grp"><button id="reset">↺ Replay intro</button></div>
</div>

<div class="screen orig posTopDummy vivid posTop" id="screen" style="">
  <div class="art"></div>
  <div class="spotlight"></div>
  <div class="topscrim"></div>
  <div class="scrim"></div>
  <div class="brand">REALM OF cReapZ</div>
  <div class="logo"><div class="t">cReapZ</div><div class="sub">The Myth of Ascension</div></div>
  <div class="miniLogo">cReapZ</div>
  <div class="press">TAP TO BEGIN</div>
  <div class="menu">
    <button class="play">Play</button>
    <button>Crypt</button>
    <button>Options</button>
    <button>Soul Box</button>
  </div>
</div>

<script>
var sc=document.getElementById('screen');
sc.className='screen vivid mini';   // locked: vivid, logo High, Mini-corner after press
sc.addEventListener('click',function(e){ if(e.target.closest('.menu button')) return; sc.classList.add('menuon'); });
document.getElementById('reset').onclick=function(e){ e.stopPropagation(); sc.classList.remove('menuon'); };
document.querySelectorAll('.bar button[data-t]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation();
  var t=b.dataset.t, v=b.dataset.v;
  document.querySelectorAll('.bar button[data-t="'+t+'"]').forEach(function(x){x.classList.toggle('on',x===b);});
  if(t==='treat'){ sc.classList.remove('vivid','orig','spot'); sc.classList.add(v); }
  if(t==='pos'){ sc.classList.toggle('posbot', v==='bot'); }
  if(t==='mini'){ sc.classList.toggle('mini', v==='on'); }
};});
</script>
</body>
</html>
